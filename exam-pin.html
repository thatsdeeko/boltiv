<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Exam PINs</title><link rel="stylesheet" href="style.css"><script src="transaction-pin.js?v=20260820-exampin"></script><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");</script><style>body{background:#f7f7f5}.exam-page{min-height:100vh;padding-bottom:110px}.head{display:flex;align-items:center;gap:13px;padding:18px 0 24px}.back{width:40px;height:40px;border-radius:12px;border:1px solid #e5e5e1;background:#fff;color:#b8860b;font-size:22px}.title{color:#b8860b;font-size:21px;font-weight:1000}.sub{color:#666;font-size:10px;margin-top:4px}.hero{padding:23px;border-radius:23px;background:linear-gradient(145deg,#fffdf4,#fff);border:1px solid #e5e5e1;margin-bottom:20px}.hero b{color:#b8860b;font-size:10px;letter-spacing:1px}.hero h1{margin:7px 0;color:#171717;font-size:23px}.hero p{margin:0;color:#777;font-size:11px;line-height:1.6}.card{padding:20px;border-radius:21px;background:#fff;border:1px solid #e5e5e1}.label{display:block;color:#777;font-size:10px;font-weight:900;letter-spacing:.6px;margin-bottom:9px}.select,.qty{width:100%;box-sizing:border-box;padding:14px;border-radius:13px;border:1px solid #e5e5e1;background:#fff;color:#171717;font-family:inherit;font-size:12px;font-weight:800;margin-bottom:18px}.products{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px}.product{padding:15px;border:1px solid #e5e5e1;border-radius:15px;background:#fafaf8;text-align:left}.product.active{border-color:#b8860b;background:#fffdf4}.product strong{display:block;color:#171717;font-size:13px}.product span{display:block;color:#777;font-size:10px;margin-top:5px}.price{color:#b8860b!important;font-size:13px!important;font-weight:1000!important}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#f5d76e,#b8860b);color:#fff;font-family:inherit;font-size:11px;font-weight:1000}.loading{text-align:center;color:#777;padding:18px;font-size:10px}.result{margin-top:15px;padding:15px;border-radius:14px;background:#fffdf4;border:1px solid #ead99b;display:none}.pin{font-weight:1000;color:#171717;word-break:break-all;padding:9px 0;border-bottom:1px solid #ead99b}.pin:last-child{border-bottom:0}</style></head><body><div class="page exam-page"><div class="container"><div class="head"><button class="back" onclick="history.back()">‹</button><div><div class="title">Exam PINs</div><div class="sub">WAEC • NECO • NABTEB</div></div></div><div class="hero"><b>BOLTIV EDUCATION</b><h1>Get your Exam PIN.</h1><p>Buy available examination PINs instantly from your BOLTIV wallet.</p></div><div class="card"><label class="label">SELECT EXAM</label><select id="exam" class="select"><option value="">Loading products...</option></select><label class="label">QUANTITY</label><select id="quantity" class="qty"><option value="1">1 PIN</option><option value="2">2 PINS</option><option value="5">5 PINS</option></select><label class="label">AVAILABLE PRODUCTS</label><div id="products" class="products"><div class="loading">Loading exam PINs...</div></div><button id="buy" class="btn" disabled>BUY EXAM PIN</button><div id="result" class="result"></div></div></div></div><script>const API=(localStorage.getItem("boltivApiBase")||"https://boltiv-backend.onrender.com").replace(/\/$/,"");const productsEl=document.getElementById("products"),examEl=document.getElementById("exam"),qtyEl=document.getElementById("quantity"),buy=document.getElementById("buy"),result=document.getElementById("result");let products=[],selected=null;async function request(path,opts={}){const token=localStorage.getItem("boltivToken")||localStorage.getItem("token");const headers={"Content-Type":"application/json",...(opts.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch(API+path,{...opts,headers});let d={};try{d=await r.json()}catch{};return d}function money(v){return "₦"+Number(v).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}function render(){const exam=examEl.value;const list=products.filter(p=>!exam||String(p.exam_name||p.name).toUpperCase().includes(exam));productsEl.innerHTML=list.length?list.map(p=>`<button type="button" class="product ${selected&&selected.product_id===p.product_id?'active':''}" onclick="choose(${p.product_id})"><strong>${p.name}</strong><span>${p.exam_name||''}</span><span class="price">${money(p.customer_price)} each</span></button>`).join(''):'<div class="loading">No available exam PINs for this selection.</div>';buy.disabled=!selected}function choose(id){selected=products.find(p=>p.product_id===id)||null;render()}async function load(){const r=await request('/api/vtu/exam-pin/products');if(!r.success){productsEl.innerHTML='<div class="loading">'+(r.message||'Unable to load exam PINs.')+'</div>';return}products=r.products||[];const names=[...new Set(products.map(p=>p.exam_name||p.name).filter(Boolean))];examEl.innerHTML='<option value="">All exams</option>'+names.map(n=>`<option value="${n}">${n}</option>`).join('');examEl.onchange=()=>{selected=null;render()};render()}buy.onclick=async()=>{if(!selected)return;const qty=Number(qtyEl.value);const total=Number(selected.customer_price)*qty;if(!confirm('Buy '+qty+' PIN(s) for '+money(total)+'?'))return;const pin=prompt('Enter your 4-digit Transaction PIN:');if(!pin)return;if(!/^\d{4}$/.test(pin))return alert('Transaction PIN must be 4 digits.');buy.disabled=true;const idem='BOLTIV-EXAM-'+Date.now()+'-'+Math.random().toString(16).slice(2);const r=await request('/api/vtu/exam-pin',{method:'POST',headers:{'X-Idempotency-Key':idem},body:JSON.stringify({service:'exam_pin',product_id:selected.product_id,quantity:qty,amount:total,transactionPin:pin,idempotencyKey:idem})});buy.disabled=false;if(!r.success){alert(r.message||'Exam PIN purchase failed.');return}result.style.display='block';const delivery=r.delivery||r.providerData?.delivery||{};const pins=delivery.pins||r.pins||[];result.innerHTML='<strong>PIN PURCHASE SUCCESSFUL</strong><div style="margin-top:8px">'+(pins.length?pins.map(x=>`<div class="pin">${x}</div>`).join(''):'Your PIN purchase was successful. Check Transactions for the provider reference.')+'</div>'};load();</script></body></html>
