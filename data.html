<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Buy Data</title><link rel="stylesheet" href="style.css"><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");</script><style>
.data-page{min-height:100vh;padding-bottom:110px}.data-header{display:flex;align-items:center;gap:13px;padding:18px 0 24px}.back-button{width:40px;height:40px;border-radius:12px;border:1px solid #e5e5e1;background:#ffffff;color:#c49a24;font-size:22px;display:flex;align-items:center;justify-content:center}.data-title{color:#c49a24;font-size:20.9px;font-weight:1000}.data-subtitle{color:#666;font-size:8.8px;margin-top:4px}.data-hero{padding:23px;border-radius:23px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 38%),linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;margin-bottom:20px}.data-hero-label{color:#c49a24;font-size:8.8px;font-weight:1000;letter-spacing:1px}.data-hero-title{color:#171717;font-size:23.1px;font-weight:1000;margin-top:7px}.data-hero-text{color:#777;font-size:9.9px;line-height:1.6;margin-top:6px}.data-card{padding:20px;border-radius:21px;background:#ffffff;border:1px solid #e5e5e1}.data-label{display:block;color:#777;font-size:8.8px;font-weight:900;letter-spacing:.6px;margin-bottom:8px}.data-input{width:100%;box-sizing:border-box;padding:15px;border-radius:13px;border:1px solid #e5e5e1;background:#ffffff;color:#171717;outline:none;font-family:inherit;font-size:13.2px;font-weight:800;margin-bottom:18px}.data-input::placeholder{color:#555}.data-input:focus{border-color:#c49a24;box-shadow:0 0 0 2px rgba(212,175,55,.07)}.network-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.network-button{padding:13px 5px;border-radius:12px;border:1px solid #e5e5e1;background:#fafaf8;color:#777;font-size:7.7px;font-weight:1000}.network-button.active{color:#c49a24;border-color:#c49a24;background:#fffdf4}.plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.plan-button{text-align:left;padding:15px;border-radius:15px;border:1px solid #e5e5e1;background:#fafaf8;color:#fff}.plan-button.active{border-color:#c49a24;background:#fffdf4}.plan-size{color:#c49a24;font-size:14.3px;font-weight:1000;margin-bottom:5px}.plan-validity{color:#777;font-size:8.8px;margin-bottom:8px}.plan-price{color:#171717;font-size:11px;font-weight:1000}.purchase-button{width:100%;padding:16px;border:1px solid #e5e5e1;border-radius:14px;background:#ffffff;color:#c49a24;font-family:inherit;font-size:11px;font-weight:1000;letter-spacing:.8px}.boltiv-modal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,20,20,.45);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.25s}.boltiv-modal.show{opacity:1;visibility:visible}.boltiv-modal-card{width:100%;max-width:390px;box-sizing:border-box;padding:28px 22px;border-radius:25px;text-align:center;background:linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;box-shadow:0 30px 90px rgba(0,0,0,.75);transform:translateY(25px) scale(.94);transition:.3s}.boltiv-modal.show .boltiv-modal-card{transform:translateY(0) scale(1)}.modal-icon{width:66px;height:66px;margin:0 auto 17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30.8px;font-weight:1000}.boltiv-modal.warning .modal-icon,.boltiv-modal.processing .modal-icon{background:#fffdf4;border:1px solid #c49a24;color:#c49a24}.boltiv-modal.success .modal-icon{background:#101c12;border:1px solid #56b866;color:#70d47b}.boltiv-modal.failed .modal-icon{background:#fff0f0;border:1px solid #b94c4c;color:#e07878}.modal-spinner{width:24px;height:24px;border-radius:50%;border:3px solid #332b16;border-top-color:#c49a24;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.modal-status{color:#c49a24;font-size:8.8px;font-weight:1000;letter-spacing:1px;margin-bottom:8px}.modal-title{color:#171717;font-size:20.9px;font-weight:1000}.modal-message{color:#777;font-size:9.9px;line-height:1.6;margin-top:8px}.modal-details{margin-top:20px;padding:5px 14px;border-radius:15px;background:#fafaf8;border:1px solid #e5e5e1}.modal-detail{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e9e9e5;text-align:left}.modal-detail:last-child{border-bottom:0}.modal-detail span{color:#666;font-size:8.8px}.modal-detail strong{color:#171717;font-size:9.9px;font-weight:900;text-align:right;word-break:break-word}.modal-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#f5d76e,#c49a24,#b8860b);color:#f7f7f5;font-family:inherit;font-size:9.9px;font-weight:1000}
</style></head><body>
<div class="page data-page"><div class="container">
<div class="data-header"><button class="back-button" onclick="history.back()">‹</button><div><div class="data-title">Buy Data</div><div class="data-subtitle">INSTANT DATA RECHARGE</div></div></div>
<div class="data-hero"><div class="data-hero-label">BOLTIV DATA</div><div class="data-hero-title">Stay Connected.</div><div class="data-hero-text">Choose a data plan and recharge instantly from your BOLTIV wallet.</div></div>
<div class="data-card">
<label class="data-label">PHONE NUMBER</label><input class="data-input" id="phoneNumber" type="tel" inputmode="numeric" maxlength="11" placeholder="08012345678">
<label class="data-label">SELECT NETWORK</label><div class="network-grid"><button type="button" class="network-button" data-network="MTN">MTN</button><button type="button" class="network-button" data-network="AIRTEL">AIRTEL</button><button type="button" class="network-button" data-network="GLO">GLO</button><button type="button" class="network-button" data-network="9MOBILE">9MOBILE</button></div>
<label class="data-label">SELECT DATA PLAN</label><div class="plan-grid">
<button type="button" class="plan-button" data-plan="500MB" data-price="150"><div class="plan-size">500MB</div><div class="plan-validity">30 Days</div><div class="plan-price">₦150</div></button>
<button type="button" class="plan-button" data-plan="1GB" data-price="300"><div class="plan-size">1GB</div><div class="plan-validity">30 Days</div><div class="plan-price">₦300</div></button>
<button type="button" class="plan-button" data-plan="2GB" data-price="600"><div class="plan-size">2GB</div><div class="plan-validity">30 Days</div><div class="plan-price">₦600</div></button>
<button type="button" class="plan-button" data-plan="3GB" data-price="900"><div class="plan-size">3GB</div><div class="plan-validity">30 Days</div><div class="plan-price">₦900</div></button>
<button type="button" class="plan-button" data-plan="5GB" data-price="1500"><div class="plan-size">5GB</div><div class="plan-validity">30 Days</div><div class="plan-price">₦1,500</div></button>
<button type="button" class="plan-button" data-plan="10GB" data-price="3000"><div class="plan-size">10GB</div><div class="plan-validity">30 Days</div><div class="plan-price">₦3,000</div></button>
</div><button type="button" class="purchase-button" id="purchaseButton">BUY DATA</button>
</div></div></div>
<nav class="bottom-nav"><button class="nav-item" data-page="index.html"><span class="nav-icon">⌂</span><span>Home</span></button><button class="nav-item" data-page="wallet.html"><span class="nav-icon">₦</span><span>Wallet</span></button><button class="nav-item" data-page="transactions.html"><span class="nav-icon">↯</span><span>Activity</span></button><button class="nav-item" data-page="profile.html"><span class="nav-icon">◉</span><span>Profile</span></button></nav>
<div class="boltiv-modal" id="boltivModal"><div class="boltiv-modal-card"><div class="modal-icon" id="modalIcon">!</div><div class="modal-status" id="modalStatus">NOTICE</div><div class="modal-title" id="modalTitle">Complete Your Purchase</div><div class="modal-message" id="modalMessage">Please complete the required information.</div><div class="modal-details" id="modalDetails" style="display:none"></div><button type="button" class="modal-button" id="modalButton">GOT IT</button></div></div>
<script>
// Data purchase logic
let selectedNetwork="",selectedPlan=null;
const $=id=>document.getElementById(id),phone=$("phoneNumber"),modal=$("boltivModal"),icon=$("modalIcon"),status=$("modalStatus"),title=$("modalTitle"),msg=$("modalMessage"),details=$("modalDetails"),modalBtn=$("modalButton");
const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const balance=()=>Number(localStorage.getItem("boltivWalletBalance")||0);
const setBalance=v=>localStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(v)||0)));
function transactions(){try{let x=JSON.parse(localStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveTransaction(x){let t=transactions();t.unshift(x);localStorage.setItem("boltivTransactions",JSON.stringify(t))}
function show(type,t,m,b="GOT IT",d=""){modal.className="boltiv-modal show "+type;title.textContent=t;msg.textContent=m;modalBtn.textContent=b;status.textContent=type==="success"?"SUCCESSFUL":type==="failed"?"FAILED":type==="processing"?"PROCESSING":"NOTICE";icon.innerHTML=type==="success"?"✓":type==="failed"?"×":type==="processing"?'<div class="modal-spinner"></div>':"!";details.innerHTML=d;details.style.display=d?"block":"none"}
function close(){modal.classList.remove("show");modalBtn.style.display="block"}
modalBtn.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
document.querySelectorAll(".network-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".network-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedNetwork=b.dataset.network});
document.querySelectorAll(".plan-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".plan-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedPlan={plan:b.dataset.plan,price:Number(b.dataset.price)}});
function info(p,id="",bal=""){let h=`<div class="modal-detail"><span>Service</span><strong>Data</strong></div><div class="modal-detail"><span>Network</span><strong>${selectedNetwork}</strong></div><div class="modal-detail"><span>Phone</span><strong>${p}</strong></div><div class="modal-detail"><span>Data Plan</span><strong>${selectedPlan.plan}</strong></div><div class="modal-detail"><span>Amount</span><strong>${money(selectedPlan.price)}</strong></div>`;if(id)h+=`<div class="modal-detail"><span>Transaction ID</span><strong>${id}</strong></div>`;if(bal!=="")h+=`<div class="modal-detail"><span>Wallet Balance</span><strong>${money(bal)}</strong></div>`;return h}
$("purchaseButton").onclick=()=>{
const p=phone.value.trim(),bal=balance();
if(!p)return show("warning","Phone Number Required","Enter the 11-digit phone number you want to recharge.");
if(p.length!==11||!/^\d{11}$/.test(p))return show("warning","Check Your Number","Please enter a valid 11-digit Nigerian phone number.");
if(!selectedNetwork)return show("warning","Select Your Network","Choose the network you want to use.");
if(!selectedPlan)return show("warning","Select a Data Plan","Choose a data plan before continuing.");
if(bal<selectedPlan.price)return show("failed","Insufficient Balance",`Your wallet balance is ${money(bal)}. You need ${money(selectedPlan.price)} to buy this data plan.`,"DONE",info(p));
show("processing","Processing Data","We're processing your data purchase. Please wait...","PLEASE WAIT",info(p));modalBtn.style.display="none";
setTimeout(()=>{const amount=selectedPlan.price,newBal=bal-amount,id="BTV-"+Date.now().toString().slice(-8);setBalance(newBal);saveTransaction({id,type:"data",title:"Data Purchase",service:"Data",network:selectedNetwork,phone:p,plan:selectedPlan.plan,amount,status:"Successful",direction:"debit",date:new Date().toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"})});show("success","Data Purchased","Your data bundle has been purchased successfully.","DONE",info(p,id,newBal));modalBtn.style.display="block"},1800)
};
document.querySelectorAll(".nav-item").forEach(i=>i.onclick=()=>location.href=i.dataset.page);
</script></body></html>
