<script>
(function(){
  var routes={"/login.html":"login.html","/register.html":"register.html","/dashboard.html":"dashboard.html","/airtime.html":"airtime.html","/data.html":"data.html","/electricity.html":"electricity.html","/cable.html":"cable.html","/wallet.html":"wallet.html","/transactions.html":"transactions.html","/profile.html":"profile.html","/notifications.html":"notifications.html","/support.html":"support.html","/contact.html":"contact.html","/privacy.html":"privacy.html","/terms.html":"terms.html","/security.html":"security.html","/history.html":"history.html","/forgot-password.html":"forgot-password.html","/reset-password.html":"reset-password.html","/exam-pin.html":"exam-pin.html","/betting.html":"betting.html"};
  var p=window.location.pathname || "/";
  if(p.length>1 && p.charAt(p.length-1)!="/") p+="/";
  var target=routes[p];
  if(target){
    window.location.replace("/"+target+window.location.search+window.location.hash);
  }else{
    document.body.innerHTML='<div style="font-family:system-ui;text-align:center;padding:48px"><h1>BOLTIV</h1><p>Page not found.</p><a href="/">Return home</a></div>';
  }
})();
</script>
