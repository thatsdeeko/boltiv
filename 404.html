<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>BOLTIV</title>
  <style>
    html,body{margin:0;padding:0;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
    #boltiv-router-error{padding:48px 24px;text-align:center}
  </style>
</head>
<body>
<div id="boltiv-router-error">
  <h1>BOLTIV</h1>
  <p>Unable to load this page. Please try again.</p>
</div>

<script>
(function () {
  "use strict";

  var routes = {"/login/":"login.html","/register/":"register.html","/dashboard/":"dashboard.html","/airtime/":"airtime.html","/data/":"data.html","/electricity/":"electricity.html","/cable/":"cable.html","/wallet/":"wallet.html","/transactions/":"transactions.html","/profile/":"profile.html","/notifications/":"notifications.html","/support/":"support.html","/contact/":"contact.html","/privacy/":"privacy.html","/terms/":"terms.html","/forgot-password/":"forgot-password.html","/reset-password/":"reset-password.html","/security/":"security.html","/history/":"history.html"};

  function normalisePath(path) {
    path = path || "/";
    path = path.split("?")[0].split("#")[0];
    if (path.length > 1 && path.charAt(path.length - 1) !== "/") path += "/";
    return path;
  }

  var path = normalisePath(window.location.pathname);
  var target = routes[path];

  if (!target) return;

  function resolveUrl(value, base) {
    try { return new URL(value, base).href; }
    catch (e) { return value; }
  }

  fetch("/" + target, { credentials: "same-origin", cache: "no-cache" })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.text();
    })
    .then(function (html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, "text/html");

      // Replace document metadata.
      document.title = doc.title || "BOLTIV";
      var oldMeta = document.head.querySelectorAll("meta[data-boltiv-router]");
      oldMeta.forEach(function (n) { n.remove(); });
      doc.head.querySelectorAll("meta").forEach(function (meta) {
        var clone = meta.cloneNode(true);
        clone.setAttribute("data-boltiv-router", "1");
        document.head.appendChild(clone);
      });

      // Replace body.
      document.body.innerHTML = doc.body ? doc.body.innerHTML : html;

      // Keep the clean URL in the address bar.
      window.history.replaceState({ boltivRoute: target }, "", path);

      // Fix relative assets because the fetched page was originally a flat .html file.
      document.querySelectorAll("[src]").forEach(function (el) {
        var src = el.getAttribute("src");
        if (src && !/^(?:[a-z]+:|\/\/|data:|blob:|#)/i.test(src)) {
          el.setAttribute("src", resolveUrl(src, window.location.origin + "/" + target));
        }
      });
      document.querySelectorAll("[href]").forEach(function (el) {
        var href = el.getAttribute("href");
        if (href && !/^(?:[a-z]+:|\/\/|data:|mailto:|tel:|javascript:|#)/i.test(href)) {
          // Preserve clean application routes; resolve ordinary assets relative to the flat page.
          var clean = normalisePath(href);
          if (routes[clean]) {
            el.setAttribute("href", clean);
          } else {
            el.setAttribute("href", resolveUrl(href, window.location.origin + "/" + target));
          }
        }
      });

      // Re-execute scripts from the fetched page.
      var scripts = Array.prototype.slice.call(document.querySelectorAll("script"));
      scripts.forEach(function (oldScript) {
        var s = document.createElement("script");
        Array.prototype.slice.call(oldScript.attributes).forEach(function (a) {
          s.setAttribute(a.name, a.value);
        });
        if (oldScript.src) {
          s.src = resolveUrl(oldScript.getAttribute("src"), window.location.origin + "/" + target);
        } else {
          s.textContent = oldScript.textContent;
        }
        oldScript.parentNode.replaceChild(s, oldScript);
      });
    })
    .catch(function () {
      // Keep the clean URL, but show a useful error rather than another 404 redirect.
      var box = document.getElementById("boltiv-router-error");
      if (box) box.innerHTML =
        "<h1>BOLTIV</h1><p>Unable to load this page. Please try again.</p>";
    });
})();
</script>
</body>
</html>
