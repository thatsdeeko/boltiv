<html lang="en"><head><base href="/"><meta content="index,follow,max-image-preview:large" name="robots"/><script src="boltiv-client.js?v=20260820-nostorage"></script><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1.0" name="viewport"/><meta content="#f7f7f5" name="theme-color"/><meta content="Renew your cable TV subscription with BOLTIV." name="description"/>
<title>BOLTIV — Cable TV</title><link href="style.css?v=20260821-servicecenter" rel="stylesheet"/><script src="transaction-pin.js?v=20260815-pinfix"></script><script>boltivRequireAuth();</script><style>
*{box-sizing:border-box}html,body{margin:0;background:#ffffff;color:#171717;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}button,input,select{font-family:inherit}button{cursor:pointer}.page{min-height:100vh;padding-bottom:90px}.container{width:min(100% - 30px,480px);margin:auto}.header{display:flex;align-items:center;gap:14px;padding:22px 0}.back{width:40px;height:40px;border:1px solid #e5e5e1;border-radius:13px;background:#ffffff;color:#D4AF37;font-size:22px}.title{font-size:20.9px;font-weight:1000}.subtitle{margin-top:4px;color:#666;font-size:10px}.card{padding:20px;border:1px solid #e5e5e1;border-radius:20px;background:#ffffff}.label{display:block;margin-bottom:8px;color:#777;font-size:10px;font-weight:900}.field{margin-bottom:17px}.providers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.provider{padding:14px;border:1px solid #e5e5e1;border-radius:13px;background:#fafaf8;color:#171717;text-align:left}.provider.active{border-color:#D4AF37;background:#fffdf4}.provider-name{font-size:11px;font-weight:1000}.provider-text{margin-top:4px;color:#666;font-size:7.7px}.select,.input{width:100%;height:48px;padding:0 14px;border:1px solid #e5e5e1;border-radius:12px;background:#ffffff;color:#171717;outline:0;font-size:12.1px}.select:focus,.input:focus{border-color:#D4AF37}.verify{width:100%;height:45px;border:1px solid #D4AF37;border-radius:12px;background:#fffdf4;color:#D4AF37;font-size:11px;font-weight:1000}.summary{display:none;margin-top:17px;padding:15px;border:1px solid #e5e5e1;border-radius:14px;background:#fafaf8}.summary-row{display:flex;justify-content:space-between;margin-bottom:8px;color:#777;font-size:10px}.summary-row:last-child{margin:0}.summary-row strong{color:#fff}.pay{width:100%;height:50px;margin-top:18px;border:0;border-radius:13px;background:#D4AF37;color:#f7f7f5;font-size:11px;font-weight:1000}.pay:disabled{background:#333;color:#777}.message{display:none;margin-top:12px;padding:12px;border-radius:11px;font-size:10px;text-align:center}.error{background:#fff1f1;color:#ff8d8d;border:1px solid #4a2020}.success{background:#122313;color:#8cff9a;border:1px solid #254d29}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;display:flex;justify-content:center;padding:8px 12px;background:rgba(255,255,255,.97);border-top:1px solid #222}.nav{width:25%;max-width:110px;border:0;background:transparent;color:#555;font-size:7.7px;font-weight:900}.nav.active{color:#D4AF37}.nav-icon{display:block;margin-bottom:4px;font-size:18.7px}
</style><link href="assets/boltiv-icon.webp" rel="icon" type="image/png"/>
<link href="https://boltiv.ng/cable" rel="canonical"/>
<style>/* Phase 3 accessibility polish */ :focus-visible{outline:3px solid #D4AF37;outline-offset:3px} @media (prefers-reduced-motion: reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}</style><link rel="stylesheet" href="../boltiv-theme.css">
</head><body><div class="page"><div class="container">
<header class="header"><button class="back" onclick="history.back()">‹</button><div><div class="title">Cable TV</div><div class="subtitle">Renew your TV subscription</div></div></header>
<section class="card">
<div class="field"><label class="label" id="cable-provider-label">CABLE PROVIDER</label><div aria-labelledby="cable-provider-label" class="providers" role="group"><button aria-label="DStv Digital Satellite TV" class="provider active" data-provider="DSTV"><div class="provider-name">DStv</div><div class="provider-text">Digital Satellite TV</div></button><button aria-label="GOtv Digital TV" class="provider" data-provider="GOTV"><div class="provider-name">GOtv</div><div class="provider-text">Digital TV</div></button></div></div>
<div class="field"><label class="label" id="smartcard-iuc-number-label">SMARTCARD / IUC NUMBER</label><input aria-label="Smartcard number" aria-labelledby="smartcard-iuc-number-label" class="input" id="smartcard" inputmode="numeric" placeholder="Enter smartcard number" type="tel"/></div>
<button class="verify" id="verify">VERIFY NUMBER</button>
<div class="field" style="margin-top:18px"><label class="label" for="plan">SUBSCRIPTION PLAN</label><select aria-label="Cable TV plan" class="select" id="plan"><option value="">Select a plan</option><option value="Compact">DStv Compact — ₦19,000</option><option value="Confam">DStv Confam — ₦11,000</option><option value="Yanga">DStv Yanga — ₦6,000</option><option value="Jolli">GOtv Jolli — ₦5,800</option><option value="Max">GOtv Max — ₦8,500</option></select></div>
<div class="summary" id="summary"><div class="summary-row"><span>Provider</span><strong id="sumProvider">-</strong></div><div class="summary-row"><span>Number</span><strong id="sumNumber">-</strong></div><div class="summary-row"><span>Plan</span><strong id="sumPlan">-</strong></div><div class="summary-row"><span>Amount</span><strong id="sumAmount">₦0.00</strong></div></div>
<button class="pay" disabled="" id="pay">PAY CABLE TV</button><div aria-live="polite" class="message" id="message" role="status"></div>
</section></div></div>
<nav class="bottom-nav"><button class="nav" onclick="location.href='/dashboard'"><span class="nav-icon">⌂</span>Home</button><button class="nav" onclick="location.href='/wallet'"><span class="nav-icon">₦</span>Wallet</button><button class="nav" onclick="location.href='/transactions'"><span class="nav-icon">↯</span>Activity</button><button class="nav" onclick="location.href='/profile'"><span class="nav-icon">◉</span>Profile</button></nav>
<script>
// Cable TV logic
const providers=document.querySelectorAll(".provider"),smartcard=document.getElementById("smartcard"),plan=document.getElementById("plan"),verify=document.getElementById("verify"),pay=document.getElementById("pay"),summary=document.getElementById("summary"),message=document.getElementById("message");let selectedProvider="DSTV",verified=false;
const plans={Compact:19000,Confam:11000,Yanga:6000,Jolli:5800,Max:8500},money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2}),getBalance=()=>Number(boltivMemoryStorage.getItem("boltivWalletBalance")||0),setBalance=v=>boltivMemoryStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(v)||0)));
function getTransactions(){try{let x=JSON.parse(boltivMemoryStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveTransaction(x){let t=getTransactions();t.unshift(x);boltivMemoryStorage.setItem("boltivTransactions",JSON.stringify(t))}
function showMessage(t,c){message.textContent=t;message.className="message "+c;message.style.display="block"}
providers.forEach(b=>b.onclick=()=>{providers.forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedProvider=b.dataset.provider;verified=false;summary.style.display="none";pay.disabled=true});
verify.onclick=async()=>{let n=smartcard.value.trim();if(!/^\\d{8,20}$/.test(n))return showMessage("Enter a valid smartcard or IUC number.","error");verify.disabled=true;showMessage("Verifying with VTUGATE API...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/cable/verify",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,smartcard:n})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Cable number could not be verified.");verified=true;updateSummary();checkPayment();const name=d.customer?.customer_name||d.customer?.name||d.customer?.customerName||"";showMessage(name?`Verified: ${name}`:"Number verified successfully.","success")}catch(e){verified=false;pay.disabled=true;showMessage(e.message||"Cable verification failed.","error")}finally{verify.disabled=false}};
plan.onchange=()=>{if(verified)updateSummary();checkPayment()};
function updateSummary(){let v=plans[plan.value]||0;document.getElementById("sumProvider").textContent=selectedProvider;document.getElementById("sumNumber").textContent=smartcard.value.trim();document.getElementById("sumPlan").textContent=plan.value||"-";document.getElementById("sumAmount").textContent=money(v);summary.style.display="block"}
function checkPayment(){pay.disabled=!(verified&&plans[plan.value])}
pay.onclick=async()=>{let value=plans[plan.value],number=smartcard.value.trim();if(!verified)return showMessage("Please verify your smartcard or IUC number first.","error");if(!value)return showMessage("Select a subscription plan.","error");pay.disabled=true;const transactionPin=await boltivGetTransactionPin();if(!transactionPin){pay.disabled=false;return;}showMessage("Processing your cable subscription...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/cable",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,smartcard:number,plan:plan.value,amount:value,service:"cable",providerPayload:{service:"cable",provider:selectedProvider,smartcard:number,plan:plan.value,amount:value},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin:transactionPin})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process cable payment.");showMessage(`${d.message||"Cable TV request received."} Reference: ${d.reference||"-"}`,d.status==="pending"?"success":"success");}catch(e){showMessage(e.message||"Cable payment failed.","error");}finally{pay.disabled=false}};
</script><button type="button" class="boltiv-theme-toggle" data-boltiv-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
<script src="../boltiv-theme.js"></script>
</body></html>
