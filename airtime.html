<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>BOLTIV — Buy Airtime</title><link rel="stylesheet" href="style.css"><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html")</script><style>
.airtime-page{min-height:100vh;padding-bottom:110px}.airtime-header{display:flex;align-items:center;gap:13px;padding:18px 0 24px}.back-button{width:40px;height:40px;border-radius:12px;border:1px solid #292929;background:#111;color:#d4af37;font-size:20px}.airtime-title{color:#d4af37;font-size:19px;font-weight:1000}.airtime-subtitle{color:#666;font-size:8px;margin-top:4px}.airtime-hero{padding:23px;border-radius:23px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 38%),linear-gradient(145deg,#181818,#090909);border:1px solid #292929;margin-bottom:20px}.airtime-hero-label{color:#d4af37;font-size:8px;font-weight:1000;letter-spacing:1px}.airtime-hero-title{color:#fff;font-size:21px;font-weight:1000;margin-top:7px}.airtime-hero-text{color:#777;font-size:9px;line-height:1.6;margin-top:6px}.airtime-card{padding:20px;border-radius:21px;background:#101010;border:1px solid #242424}.airtime-label{display:block;color:#777;font-size:8px;font-weight:900;letter-spacing:.6px;margin-bottom:8px}.airtime-input{width:100%;box-sizing:border-box;padding:15px;border-radius:13px;border:1px solid #292929;background:#080808;color:#fff;outline:none;font-family:inherit;font-size:12px;font-weight:800;margin-bottom:17px}.airtime-input::placeholder{color:#555}.airtime-input:focus{border-color:#d4af37}.network-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.network-button,.amount-button{border:1px solid #292929;background:#0b0b0b;color:#777;font-weight:1000}.network-button{padding:12px 5px;border-radius:12px;font-size:7px}.network-button.active,.amount-button.active{color:#d4af37;border-color:#d4af37;background:#17140b}.amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.amount-button{padding:13px 5px;border-radius:11px;color:#aaa;font-size:9px}.purchase-button{width:100%;padding:16px;border:1px solid #292929;border-radius:14px;background:#111;color:#d4af37;font-family:inherit;font-size:10px;font-weight:1000;letter-spacing:.8px}.boltiv-modal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.86);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.25s}.boltiv-modal.show{opacity:1;visibility:visible}.boltiv-modal-card{width:100%;max-width:390px;box-sizing:border-box;padding:28px 22px;border-radius:25px;text-align:center;background:linear-gradient(145deg,#181818,#080808);border:1px solid #292929;box-shadow:0 30px 90px rgba(0,0,0,.75)}.modal-icon{width:66px;height:66px;margin:0 auto 17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000}.warning .modal-icon,.processing .modal-icon{background:#17140b;border:1px solid #d4af37;color:#d4af37}.failed .modal-icon{background:#1d0e0e;border:1px solid #b94c4c;color:#e07878}.modal-status{font-size:8px;font-weight:1000;letter-spacing:1px;color:#d4af37;margin-bottom:8px}.modal-title{color:#fff;font-size:19px;font-weight:1000}.modal-message{color:#777;font-size:9px;line-height:1.6;margin-top:8px}.modal-details{margin-top:20px;padding:5px 14px;border-radius:15px;background:#0d0d0d;border:1px solid #202020}.modal-detail{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #1c1c1c;text-align:left}.modal-detail:last-child{border:0}.modal-detail span{color:#666;font-size:8px}.modal-detail strong{color:#fff;font-size:9px}.modal-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:#d4af37;color:#050505;font-family:inherit;font-size:9px;font-weight:1000}
</style></head><body><div class="page airtime-page"><div class="container">
<div class="airtime-header"><button class="back-button" onclick="history.back()">‹</button><div><div class="airtime-title">Buy Airtime</div><div class="airtime-subtitle">INSTANT AIRTIME RECHARGE</div></div></div>
<div class="airtime-hero"><div class="airtime-hero-label">BOLTIV AIRTIME</div><div class="airtime-hero-title">Stay Connected.</div><div class="airtime-hero-text">Recharge any supported network instantly from your BOLTIV wallet.</div></div>
<div class="airtime-card">
<label class="airtime-label">PHONE NUMBER</label><input class="airtime-input" id="phoneNumber" type="tel" inputmode="numeric" placeholder="08012345678" maxlength="11">
<label class="airtime-label">SELECT NETWORK</label><div class="network-grid"><button class="network-button" data-network="MTN">MTN</button><button class="network-button" data-network="AIRTEL">AIRTEL</button><button class="network-button" data-network="GLO">GLO</button><button class="network-button" data-network="9MOBILE">9MOBILE</button></div>
<label class="airtime-label">SELECT AMOUNT</label><div class="amount-grid"><button class="amount-button" data-amount="100">₦100</button><button class="amount-button" data-amount="200">₦200</button><button class="amount-button" data-amount="500">₦500</button><button class="amount-button" data-amount="1000">₦1,000</button><button class="amount-button" data-amount="2000">₦2,000</button><button class="amount-button" data-amount="5000">₦5,000</button></div>
<label class="airtime-label">OR ENTER AMOUNT</label><input class="airtime-input" id="customAmount" type="number" inputmode="numeric" min="50" placeholder="Enter amount">
<button class="purchase-button" id="purchaseButton">BUY AIRTIME</button></div></div></div>
<nav class="bottom-nav"><button class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">⌂</span>Home</button><button class="nav-item" onclick="location.href='wallet.html'"><span class="nav-icon">₦</span>Wallet</button><button class="nav-item" onclick="location.href='transactions.html'"><span class="nav-icon">↯</span>Activity</button><button class="nav-item" onclick="location.href='profile.html'"><span class="nav-icon">◉</span>Profile</button></nav>
<div class="boltiv-modal" id="boltivModal"><div class="boltiv-modal-card"><div class="modal-icon" id="modalIcon">!</div><div class="modal-status" id="modalStatus">NOTICE</div><div class="modal-title" id="modalTitle"></div><div class="modal-message" id="modalMessage"></div><div class="modal-details" id="modalDetails" style="display:none"></div><button class="modal-button" id="modalButton">GOT IT</button></div></div>
<script>
const API="https://boltiv-backend.onrender.com",modal=document.getElementById("boltivModal"),mi=document.getElementById("modalIcon"),ms=document.getElementById("modalStatus"),mt=document.getElementById("modalTitle"),mm=document.getElementById("modalMessage"),md=document.getElementById("modalDetails"),mb=document.getElementById("modalButton"),phone=document.getElementById("phoneNumber"),custom=document.getElementById("customAmount");let network="",amount=0;
function money(n){return"₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function show(type,title,msg,details=""){modal.className="boltiv-modal show "+type;mt.textContent=title;mm.textContent=msg;mi.textContent=type==="success"?"✓":type==="failed"?"×":"!";ms.textContent=type==="processing"?"PROCESSING":type==="failed"?"FAILED":type==="success"?"SUCCESSFUL":"NOTICE";md.innerHTML=details;md.style.display=details?"block":"none"}
function close(){modal.classList.remove("show");mb.style.display="block"}mb.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
document.querySelectorAll(".network-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".network-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");network=b.dataset.network});
document.querySelectorAll(".amount-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".amount-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");amount=Number(b.dataset.amount);custom.value=""});
custom.oninput=()=>{amount=Number(custom.value);document.querySelectorAll(".amount-button").forEach(x=>x.classList.remove("active"))};
