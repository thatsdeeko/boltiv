<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Receipt</title><link rel="stylesheet" href="style.css"><script src="boltiv-ui.js" defer></script><style>
.receipt{padding:28px 0 110px}.receipt-card{background:#fff;border:1px solid #e5e5e1;border-radius:24px;padding:24px;box-shadow:0 15px 40px rgba(0,0,0,.08)}.logo{text-align:center;color:#b8860b;font-size:34px;font-weight:1000;letter-spacing:4px}.logo img{width:58px;height:70px;object-fit:contain;display:block;margin:0 auto 5px}.logo span{display:block}.status{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto;padding:10px 13px;border-radius:20px;background:#fff9e6;color:#b8860b;text-align:center;font-weight:900;font-size:11px;letter-spacing:.4px}.status.success{background:#edf8f1;color:#218c52;border-color:#cfe6d5}.status.failed{background:#fff1f1;color:#c34c4c;border-color:#f0cccc}.status.processing,.status.pending{background:#fff9e6;color:#9b7315;border-color:#ead99b}.status-icon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:currentColor;color:#fff;font-size:12px}.row{display:flex;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid #eee}.row span{color:#777;font-size:12px}.row strong{text-align:right;font-size:13px;word-break:break-word}.receipt-reference{margin-top:16px;padding:13px;border:1px solid #ead99b;border-radius:14px;background:#fffdf4}.receipt-reference-label{font-size:8px;font-weight:900;letter-spacing:1px;color:#8a877f}.receipt-reference-value{margin-top:6px;font-size:11px;font-weight:900;word-break:break-all;color:#2c2b27}.copy-reference{width:100%;margin-top:9px;padding:10px 12px;border:1px solid #ead99b;border-radius:11px;background:#fff;color:#9b7315;font-size:10px;font-weight:900}.copy-reference.copied{background:#edf8f1;border-color:#cfe6d5;color:#218c52}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.actions button,.actions a{min-height:46px;display:flex;align-items:center;justify-content:center;flex:1;padding:12px;border:0;border-radius:12px;text-align:center;font-weight:900;text-decoration:none}.primary{background:#b8860b;color:#fff}.secondary{background:#fff9e6;color:#b8860b;border:1px solid #ead99b!important}
</style><link rel="icon" type="image/png" href="assets/boltiv-icon.png"></head><body><div class="page"><div class="container receipt"><div class="receipt-card"><div class="logo"><img src="assets/boltiv-logo.png" alt="BOLTIV logo"><span>BOLTIV</span></div><div id="status" class="status"><span class="status-icon">…</span><span>LOADING</span></div><div id="details"></div><div id="referenceBox"></div><div class="actions"><button class="primary" id="copyBtn" style="display:none">COPY REFERENCE</button><button class="secondary" onclick="window.print()">PRINT / SAVE</button><a class="secondary" href="transactions.html">BACK</a></div></div></div></div><script>
const API="https://boltiv-backend.onrender.com";const token=localStorage.getItem("boltivAuthToken")||"";const ref=new URLSearchParams(location.search).get("reference");const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});const esc=v=>String(v??"-").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const statusEl=document.getElementById("status"),details=document.getElementById("details"),referenceBox=document.getElementById("referenceBox"),copyBtn=document.getElementById("copyBtn");
function setStatus(value){const s=String(value||"Loading").toLowerCase();const cls=s.includes("success")?"success":s.includes("fail")?"failed":s.includes("process")?"processing":s.includes("pending")?"pending":"";const icon=cls==="success"?"✓":cls==="failed"?"×":cls?"⌛":"…";statusEl.className="status "+cls;statusEl.innerHTML=`<span class="status-icon">${icon}</span><span>${esc(String(value||"LOADING").toUpperCase())}</span>`}
async function copyReference(){const value=String(ref||"");if(!value)return;let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);ok=true}}catch(_){}if(!ok){const input=document.createElement("input");input.value=value;input.readOnly=true;input.style.position="fixed";input.style.left="-9999px";document.body.appendChild(input);input.select();try{ok=document.execCommand("copy")}catch(_){}input.remove()}if(ok){copyBtn.textContent="✓ COPIED";copyBtn.classList.add("copied");setTimeout(()=>{if(copyBtn.isConnected){copyBtn.textContent="COPY REFERENCE";copyBtn.classList.remove("copied")}},2200)}}
copyBtn.onclick=copyReference;
async function load(){if(!ref){setStatus("INVALID RECEIPT");return}try{const r=await fetch(API+"/api/transactions/detail?reference="+encodeURIComponent(ref),{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok||!d.success){setStatus("RECEIPT NOT FOUND");return}const t=d.transaction;setStatus(t.status||"Successful");let meta=t.metadata;try{if(typeof meta==="string")meta=JSON.parse(meta)}catch{meta={}}meta=meta&&typeof meta==="object"?meta:{};const phone=t.recipient||meta.phone||t.phone||"-";const network=meta.network||t.network||"-";const provider=meta.provider||t.provider||"-";const plan=meta.plan||meta.plan_name||t.plan||"-";details.innerHTML=`<div class="row"><span>Service</span><strong>${esc(t.service)}</strong></div><div class="row"><span>Amount</span><strong>${money(t.amount)}</strong></div>${phone!=="-"?`<div class="row"><span>Phone</span><strong>${esc(phone)}</strong></div>`:""}${network!=="-"?`<div class="row"><span>Network</span><strong>${esc(network)}</strong></div>`:""}${provider!=="-"?`<div class="row"><span>Provider</span><strong>${esc(provider)}</strong></div>`:""}${plan!=="-"?`<div class="row"><span>Plan</span><strong>${esc(plan)}</strong></div>`:""}<div class="row"><span>Date</span><strong>${new Date(t.date).toLocaleString("en-NG")}</strong></div>`;referenceBox.innerHTML=`<div class="receipt-reference"><div class="receipt-reference-label">TRANSACTION REFERENCE</div><div class="receipt-reference-value">${esc(t.reference||ref)}</div></div>`;copyBtn.style.display="flex"}catch(e){setStatus("RECEIPT UNAVAILABLE")}}
load();
</script></body></html>
