<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><meta name="description" content="BOLTIV Agent"><title>Agent Profile — BOLTIV Agent</title><script src="/boltiv-api-config.js?v=1"></script><script src="/boltiv-client.js?v=20260820-nostorage"></script><script src="/transaction-pin.js?v=20260820-pinfix"></script><link rel="icon" href="/assets/boltiv-icon.webp"><link rel="stylesheet" href="/agent.css?v=1"></head><body><main class="agent-shell"><div class="agent-container"><header class="agent-top"><div><div class="eyebrow">BOLTIV Agent</div><h1 class="title">Business Profile</h1><p class="sub">Your Agent account and security settings.</p></div><span class="agent-badge">ACTIVE</span></header><section class="profile-card"><div class="profile-row"><span>Agent name</span><strong id="name">—</strong></div><div class="profile-row"><span>Agent ID</span><strong id="agentId">—</strong></div><div class="profile-row"><span>Tier</span><strong id="tier">—</strong></div><div class="profile-row"><span>Registration date</span><strong id="date">—</strong></div><div class="profile-row"><span>Funding account</span><strong id="funding">—</strong></div></section><div class="section-head"><h2>Account</h2></div><section class="profile-card"><a class="profile-row" style="text-decoration:none;color:inherit" href="/profile"><span>Personal information</span><strong>›</strong></a><a class="profile-row" style="text-decoration:none;color:inherit" href="/profile"><span>Security & PIN</span><strong>›</strong></a><a class="profile-row" style="text-decoration:none;color:inherit" href="/notifications"><span>Notifications</span><strong>›</strong></a><a class="profile-row" style="text-decoration:none;color:inherit" href="/support"><span>Support</span><strong>›</strong></a><a class="profile-row" style="text-decoration:none;color:#b94c4c" href="#" id="logout"><span>Log out</span><strong>›</strong></a></section><div id="agentMessage" class="agent-message"></div></div></main><nav class="agent-nav"><a data-page="home" class="" href="/agent-home"><span class="nav-icon">⌂</span>Home</a><a data-page="sell" class="sell-nav " href="/agent-sell"><span class="nav-icon">＋</span>Sell</a><a data-page="wallet" class="" href="/agent-wallet"><span class="nav-icon">₦</span>Wallet</a><a data-page="activity" class="" href="/agent-activity"><span class="nav-icon">↯</span>Activity</a><a data-page="profile" class="active" href="/agent-profile"><span class="nav-icon">◉</span>Profile</a></nav><script src="/agent-app.js?v=1"></script><script>(async()=>{const d=await requireAgent();if(!d)return;const s=await agentFetch('/api/agent/status');document.getElementById('name').textContent=d.user.name||'—';document.getElementById('agentId').textContent=s.agent?.agent_id||'—';document.getElementById('tier').textContent=(s.agent?.tier||'standard').toUpperCase();document.getElementById('date').textContent=s.agent?.activated_at?new Date(s.agent.activated_at).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'—';document.getElementById('funding').textContent=s.staticAccount?s.staticAccount.accountNumber+' · '+(s.staticAccount.bankName||''): 'Not linked';document.getElementById('logout').onclick=async e=>{e.preventDefault();try{await fetch(AGENT_API+'/api/auth/logout',{method:'POST',credentials:'include',headers:agentHeaders()})}finally{location.href='/login'}};})().catch(e=>showAgentMessage(e.message));</script></body></html>
