<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLTIV — Receipt</title><link rel="stylesheet" href="style.css"><style>.receipt{padding:28px 0 110px}.receipt-card{background:#fff;border:1px solid #e5e5e1;border-radius:24px;padding:24px;box-shadow:0 15px 40px rgba(0,0,0,.08)}.logo{text-align:center;color:#b8860b;font-size:34px;font-weight:1000;letter-spacing:4px}.logo img{width:58px;height:70px;object-fit:contain;display:block;margin:0 auto 5px}.logo span{display:block}.status{margin:18px auto;padding:9px 12px;border-radius:20px;background:#fff9e6;color:#b8860b;text-align:center;font-weight:900;font-size:12px}.row{display:flex;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid #eee}.row span{color:#777;font-size:12px}.row strong{text-align:right;font-size:13px;word-break:break-word}.actions{display:flex;gap:10px;margin-top:20px}.actions button,.actions a{flex:1;padding:14px;border:0;border-radius:12px;text-align:center;font-weight:900;text-decoration:none}.primary{background:#b8860b;color:#fff}.secondary{background:#fff9e6;color:#b8860b;border:1px solid #ead99b!important}</style><link rel="icon" type="image/png" href="assets/boltiv-icon.png">
</head><body><div class="page"><div class="container receipt"><div class="receipt-card"><div class="logo"><img src="assets/boltiv-logo.png" alt="BOLTIV logo"><span>BOLTIV</span></div><div id="status" class="status">LOADING</div><div id="details"></div><div class="actions"><button class="primary" onclick="window.print()">PRINT / SAVE</button><a class="secondary" href="transactions.html">BACK</a></div></div></div></div><script>const API="https://boltiv-backend.onrender.com";const token=localStorage.getItem("boltivAuthToken")||"";const ref=new URLSearchParams(location.search).get("reference");const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){if(!ref){status.textContent="INVALID RECEIPT";return}const r=await fetch(API+"/api/transactions/detail?reference="+encodeURIComponent(ref),{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok||!d.success){status.textContent="RECEIPT NOT FOUND";return}const t=d.transaction;status.textContent=String(t.status||"").toUpperCase();details.innerHTML=`<div class="row"><span>Service</span><strong>${t.service||"-"}</strong></div><div class="row"><span>Amount</span><strong>${money(t.amount)}</strong></div><div class="row"><span>Reference</span><strong>${t.reference||"-"}</strong></div><div class="row"><span>Provider Reference</span><strong>${t.provider_reference||"-"}</strong></div><div class="row"><span>Recipient</span><strong>${t.recipient||"-"}</strong></div><div class="row"><span>Date</span><strong>${new Date(t.date).toLocaleString("en-NG")}</strong></div>`}load();</script></body></html>
