<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>BOLTIV — Profile</title>

<link rel="stylesheet" href="style.css">

<script>
if(localStorage.getItem("boltivLoggedIn")!=="true"){
location.replace("login.html");
}
</script>

<style>
*{box-sizing:border-box}

.profile-page{
min-height:100vh;
padding-bottom:110px;
}

.profile-top{
display:flex;
align-items:center;
padding:18px 0 25px;
}

.profile-title{
font-size:20px;
font-weight:1000;
color:#fff;
}

.profile-title span{
color:#d4af37;
}

.profile-sub{
margin-top:4px;
font-size:8px;
color:#666;
letter-spacing:.5px;
}

.identity-card{
padding:24px 20px;
border-radius:24px;
background:
radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 35%),
linear-gradient(145deg,#181818,#090909);
border:1px solid #292929;
box-shadow:0 18px 50px rgba(0,0,0,.35);
}

.identity{
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:68px;
height:68px;
flex-shrink:0;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(145deg,#d4af37,#8c701c);
color:#050505;
font-size:24px;
font-weight:1000;
}

.identity-name{
font-size:17px;
font-weight:1000;
color:#fff;
word-break:break-word;
}

.identity-email{
margin-top:5px;
color:#777;
font-size:9px;
word-break:break-word;
}

.status{
display:inline-flex;
align-items:center;
gap:5px;
margin-top:9px;
padding:5px 8px;
border-radius:20px;
background:#111c12;
color:#6fd47a;
font-size:7px;
font-weight:900;
}

.status-dot{
width:5px;
height:5px;
border-radius:50%;
background:#6fd47a;
}

.section{
margin-top:25px;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px;
}

.section-head h3{
margin:0;
color:#fff;
font-size:11px;
font-weight:1000;
}

.edit-btn{
border:1px solid #d4af37;
background:rgba(212,175,55,.08);
color:#d4af37;
padding:8px 11px;
border-radius:9px;
font-size:7px;
font-weight:1000;
}

.details-card{
padding:5px 18px 18px;
border-radius:20px;
background:#101010;
border:1px solid #242424;
}

.detail{
padding:17px 0;
border-bottom:1px solid #202020;
}

.detail:last-child{
border-bottom:0;
}

.detail-label{
margin-bottom:7px;
color:#666;
font-size:7px;
font-weight:900;
letter-spacing:.7px;
}

.detail-input{
width:100%;
padding:0;
border:0;
outline:0;
background:transparent;
color:#eee;
font-size:12px;
font-weight:800;
line-height:20px;
}

.detail-input:disabled{
opacity:1;
-webkit-text-fill-color:#eee;
}

.detail-input.editing{
padding:9px 10px;
border-radius:9px;
background:#080808;
border:1px solid #332b16;
color:#d4af37;
-webkit-text-fill-color:#d4af37;
}

.save-btn{
display:none;
width:100%;
margin-top:14px;
padding:15px;
border:0;
border-radius:14px;
background:linear-gradient(135deg,#d4af37,#a78320);
color:#050505;
font-size:9px;
font-weight:1000;
}

.save-btn.show{
display:block;
}

.actions{
display:grid;
gap:9px;
}

.action{
width:100%;
padding:15px;
display:flex;
align-items:center;
gap:12px;
border-radius:15px;
background:#101010;
border:1px solid #242424;
color:#fff;
text-align:left;
cursor:pointer;
}

.action:active{
transform:scale(.98);
border-color:#d4af37;
}

.action-icon{
width:38px;
height:38px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:#17140b;
border:1px solid #403513;
color:#d4af37;
font-size:13px;
}

.action-text{
flex:1;
}

.action-title{
font-size:9px;
font-weight:900;
}

.action-sub{
margin-top:3px;
color:#666;
font-size:7px;
line-height:1.4;
}

.action-arrow{
color:#555;
font-size:15px;
}

.logout{
color:#e07777;
}

.logout .action-icon{
color:#e07777;
background:#1b0e0e;
border-color:#422020;
}

.message{
display:none;
margin-top:12px;
padding:12px;
border-radius:11px;
font-size:8px;
line-height:1.5;
text-align:center;
}

.message.show{
display:block;
}

.message.error{
background:#2a1111;
color:#ff8d8d;
border:1px solid #4a2020;
}

.message.success{
background:#122313;
color:#8cff9a;
border:1px solid #254d29;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.82);
backdrop-filter:blur(8px);
opacity:0;
visibility:hidden;
transition:.25s;
}

.modal.show{
opacity:1;
visibility:visible;
}

.modal-box{
width:100%;
max-width:370px;
padding:26px 22px;
border-radius:24px;
background:linear-gradient(145deg,#181818,#080808);
border:1px solid #d4af37;
text-align:center;
transform:translateY(20px) scale(.95);
transition:.25s;
}

.modal.show .modal-box{
transform:translateY(0) scale(1);
}

.modal-icon{
width:58px;
height:58px;
margin:0 auto 15px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#17140b;
border:1px solid #d4af37;
color:#d4af37;
font-size:22px;
}

.modal-title{
color:#fff;
font-size:17px;
font-weight:1000;
}

.modal-text{
margin-top:7px;
color:#777;
font-size:9px;
line-height:1.6;
}

.modal-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:18px;
}

.modal-btn{
width:100%;
padding:13px;
border-radius:12px;
font-size:9px;
font-weight:1000;
cursor:pointer;
}

.modal-btn.primary{
border:0;
background:#d4af37;
color:#050505;
}

.modal-btn.secondary{
border:1px solid #292929;
background:#111;
color:#aaa;
}

/* LOGOUT MODAL */

.logout-modal .modal-box{
border-color:#422020;
}

.logout-modal .modal-icon{
background:#1b0e0e;
border-color:#422020;
color:#e07777;
}
</style>
</head>

<body>

<div class="page profile-page">

<div class="container">

<!-- HEADER -->

<div class="profile-top">
<div>
<div class="profile-title">
My <span>Profile</span>
</div>

<div class="profile-sub">
MANAGE YOUR BOLTIV ACCOUNT
</div>
</div>
</div>


<!-- IDENTITY -->

<div class="identity-card">

<div class="identity">

<div class="avatar" id="avatar">
U
</div>

<div>

<div class="identity-name" id="identityName">
User
</div>

<div class="identity-email" id="identityEmail">
No email added
</div>

<div class="status">
<span class="status-dot"></span>
ACCOUNT ACTIVE
</div>

</div>

</div>

</div>


<!-- PERSONAL INFORMATION -->

<div class="section">

<div class="section-head">

<h3>
Personal Information
</h3>

<button
class="edit-btn"
id="editBtn"
type="button">
EDIT DETAILS
</button>

</div>


<div class="details-card">

<div class="detail">

<div class="detail-label">
FULL NAME
</div>

<input
id="nameInput"
class="detail-input"
type="text"
disabled
placeholder="Enter your full name"
autocomplete="name">

</div>


<div class="detail">

<div class="detail-label">
PHONE NUMBER
</div>

<input
id="phoneInput"
class="detail-input"
type="tel"
disabled
placeholder="Enter phone number"
autocomplete="tel">

</div>


<div class="detail">

<div class="detail-label">
EMAIL ADDRESS
</div>

<input
id="emailInput"
class="detail-input"
type="email"
disabled
placeholder="Enter email address"
autocomplete="email">

</div>


<div
id="profileMessage"
class="message">
</div>


<button
id="saveBtn"
class="save-btn"
type="button">
SAVE CHANGES
</button>

</div>

</div>


<!-- SECURITY -->

<div class="section">

<div class="section-head">
<h3>Security</h3>
</div>

<div class="actions">

<button
class="action"
id="securityBtn"
type="button">

<div class="action-icon">
⌾
</div>

<div class="action-text">

<div class="action-title">
Security Settings
</div>

<div class="action-sub">
Manage your Transaction PIN and account security
</div>

</div>

<div class="action-arrow">
›
</div>

</button>

</div>

</div>


<!-- ACCOUNT -->

<div class="section">

<div class="section-head">
<h3>Account</h3>
</div>

<div class="actions">


<!-- SUPPORT -->

<button
class="action"
id="supportBtn"
type="button">

<div class="action-icon">
?
</div>

<div class="action-text">

<div class="action-title">
Support
</div>

<div class="action-sub">
Get help with your account and transactions
</div>

</div>

<div class="action-arrow">
›
</div>

</button>


<!-- LOGOUT -->

<button
class="action logout"
id="logoutBtn"
type="button">

<div class="action-icon">
↪
</div>

<div class="action-text">

<div class="action-title">
Log Out
</div>

<div class="action-sub">
Sign out of your BOLTIV account
</div>

</div>

<div class="action-arrow">
›
</div>

</button>

</div>

</div>


</div>
</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

<button
class="nav-item"
data-page="index.html"
type="button">

<span class="nav-icon">⌂</span>
<span>Home</span>

</button>


<button
class="nav-item"
data-page="wallet.html"
type="button">

<span class="nav-icon">₦</span>
<span>Wallet</span>

</button>


<button
class="nav-item"
data-page="transactions.html"
type="button">

<span class="nav-icon">↯</span>
<span>Activity</span>

</button>


<button
class="nav-item active"
data-page="profile.html"
type="button">

<span class="nav-icon">◉</span>
<span>Profile</span>

</button>

</nav>


<!-- PROFILE UPDATED MODAL -->

<div
class="modal"
id="successModal">

<div class="modal-box">

<div class="modal-icon">
✓
</div>

<div class="modal-title">
Profile Updated
</div>

<div class="modal-text">
Your personal information has been successfully updated.
</div>

<button
class="modal-btn primary"
id="successDone"
type="button">
DONE
</button>

</div>

</div>


<!-- LOGOUT MODAL -->

<div
class="modal logout-modal"
id="logoutModal">

<div class="modal-box">

<div class="modal-icon">
↪
</div>

<div class="modal-title">
Log Out?
</div>

<div class="modal-text">
Are you sure you want to sign out of your BOLTIV account?
</div>

<div class="modal-actions">

<button
class="modal-btn secondary"
id="cancelLogout"
type="button">
CANCEL
</button>

<button
class="modal-btn primary"
id="confirmLogout"
type="button">
LOG OUT
</button>

</div>

</div>

</div>


<script>

/* =========================
   USER STORAGE
========================= */

function getUser(){

try{

const user=JSON.parse(
localStorage.getItem("boltivUser")||"{}"
);

return user&&typeof user==="object"
?user
:{};

}catch(error){

return{};

}

}


function saveUser(user){

localStorage.setItem(
"boltivUser",
JSON.stringify(user)
);

}


/* =========================
   ELEMENTS
========================= */

const nameInput=document.getElementById("nameInput");
const phoneInput=document.getElementById("phoneInput");
const emailInput=document.getElementById("emailInput");

const editBtn=document.getElementById("editBtn");
const saveBtn=document.getElementById("saveBtn");

const avatar=document.getElementById("avatar");
const identityName=document.getElementById("identityName");
const identityEmail=document.getElementById("identityEmail");

const message=document.getElementById("profileMessage");

const successModal=document.getElementById("successModal");
const logoutModal=document.getElementById("logoutModal");


let editing=false;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

message.textContent=text;

message.className=
"message show "+type;

setTimeout(()=>{

message.className="message";

},4000);

}


/* =========================
   PROFILE LOAD
========================= */

function loadProfile(){

const user=getUser();

const name=String(
user.name||
user.fullName||
user.firstName||
"User"
).trim()||"User";

const phone=String(
user.phone||
user.phoneNumber||
""
).trim();

const email=String(
user.email||
""
).trim();


nameInput.value=name;
phoneInput.value=phone;
emailInput.value=email;


identityName.textContent=name;

identityEmail.textContent=
email||"No email added";


/* AVATAR INITIALS */

const parts=name
.split(/\s+/)
.filter(Boolean);

if(parts.length>1){

avatar.textContent=
(
parts[0][0]+
parts[parts.length-1][0]
).toUpperCase();

}else{

avatar.textContent=
name[0].toUpperCase();

}

}


/* =========================
   EDIT MODE
========================= */

function enableEdit(){

editing=true;

[
nameInput,
phoneInput,
emailInput
].forEach(input=>{

input.disabled=false;
input.classList.add("editing");

});

editBtn.textContent="CANCEL EDIT";

saveBtn.classList.add("show");

nameInput.focus();

}


function disableEdit(){

editing=false;

[
nameInput,
phoneInput,
emailInput
].forEach(input=>{

input.disabled=true;
input.classList.remove("editing");

});

editBtn.textContent="EDIT DETAILS";

saveBtn.classList.remove("show");

loadProfile();

}


/* =========================
   EDIT BUTTON
========================= */

editBtn.onclick=()=>{

if(editing){

disableEdit();

showMessage(
"Changes discarded.",
"error"
);

}else{

enableEdit();

}

};


/* =========================
   SAVE PROFILE
========================= */

saveBtn.onclick=()=>{

const name=nameInput.value.trim();
const phone=phoneInput.value.trim();
const email=emailInput.value.trim();


/* NAME VALIDATION */

if(name.length<2){

showMessage(
"Please enter your full name.",
"error"
);

nameInput.focus();

return;

}


/* PHONE VALIDATION */

if(phone){

const cleanPhone=phone.replace(/\D/g,"");

if(cleanPhone.length<10){

showMessage(
"Please enter a valid phone number.",
"error"
);

phoneInput.focus();

return;

}

}


/* EMAIL VALIDATION */

if(
email &&
!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
){

showMessage(
"Please enter a valid email address.",
"error"
);

emailInput.focus();

return;

}


/* SAVE */

const oldUser=getUser();

const updatedUser={
...oldUser,
name:name,
fullName:name,
phone:phone,
phoneNumber:phone,
email:email
};

saveUser(updatedUser);

loadProfile();

disableEdit();

successModal.classList.add("show");

};


/* =========================
   SUCCESS MODAL
========================= */

document
.getElementById("successDone")
.onclick=()=>{

successModal.classList.remove("show");

};


/* =========================
   SECURITY
========================= */

document
.getElementById("securityBtn")
.onclick=()=>{

location.href="security.html";

};


/* =========================
   SUPPORT
========================= */

document
.getElementById("supportBtn")
.onclick=()=>{

location.href="support.html";

};


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.onclick=()=>{

logoutModal.classList.add("show");

};


document
.getElementById("cancelLogout")
.onclick=()=>{

logoutModal.classList.remove("show");

};


document
.getElementById("confirmLogout")
.onclick=()=>{

localStorage.removeItem("boltivLoggedIn");

logoutModal.classList.remove("show");

location.replace("login.html");

};


/* =========================
   MODAL BACKDROP
========================= */

successModal.onclick=(event)=>{

if(event.target===successModal){

successModal.classList.remove("show");

}

};


logoutModal.onclick=(event)=>{

if(event.target===logoutModal){

logoutModal.classList.remove("show");

}

};


/* =========================
   ESC KEY
========================= */

document.addEventListener(
"keydown",
event=>{

if(event.key!=="Escape")return;

successModal.classList.remove("show");
logoutModal.classList.remove("show");

if(editing){

disableEdit();

}

}
);


/* =========================
   BOTTOM NAVIGATION
========================= */

document
.querySelectorAll(".nav-item")
.forEach(item=>{

item.onclick=()=>{

location.href=item.dataset.page;

};

});


/* =========================
   INITIAL LOAD
========================= */

loadProfile();


/* REFRESH WHEN RETURNING */

window.addEventListener(
"pageshow",
loadProfile
);

</script>

</body>
</html>
