<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><meta name="description" content="BOLTIV Agent"><title>Agent Activity — BOLTIV Agent</title><script src="/boltiv-api-config.js?v=1"></script><script src="/boltiv-client.js?v=20260820-nostorage"></script><script src="/transaction-pin.js?v=20260820-pinfix"></script><link rel="icon" href="/assets/boltiv-icon.webp"><link rel="stylesheet" href="/agent.css?v=1"></head><body><main class="agent-shell"><div class="agent-container"><header class="agent-top"><div><div class="eyebrow">BOLTIV Agent</div><h1 class="title">Activity</h1></div><a class="link" href="#" id="statementLink">Statement</a></header><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="successful">Successful</button><button class="tab" data-filter="pending">Pending</button><button class="tab" data-filter="failed">Failed</button><button class="tab" data-filter="refunded">Refunded</button></div><section class="card" id="list"><div class="loading">Loading activity…</div></section><div class="section-head"><h2>Earnings</h2><a class="link" href="/agent-earnings">View earnings →</a></div><section class="summary-grid"><div class="summary-box"><div class="label">Today</div><strong id="today">₦0.00</strong></div><div class="summary-box"><div class="label">This Week</div><strong id="week">₦0.00</strong></div></section></div></main><nav class="agent-nav"><a data-page="home" class="" href="/agent-home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"></path><path d="M9.5 20.5v-6h5v6"></path></svg></span>Home</a><a data-page="sell" class="sell-nav " href="/agent-sell"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Sell</a><a data-page="wallet" class="" href="/agent-wallet"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M17 5v14M5 8h14M5 16h14M7 5l10 14M17 5 7 19"></path></svg></span>Wallet</a><a data-page="activity" class="active" href="/agent-activity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg></span>Activity</a><a data-page="profile" class="" href="/agent-profile"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path></svg></span>Profile</a></nav><script src="/agent-app.js?v=1"></script><script>(async()=>{await requireAgent();document.getElementById('statementLink').onclick=async e=>{e.preventDefault();try{const r=await fetch(AGENT_API+'/api/agent/transactions/export',{credentials:'include',headers:agentHeaders()});if(!r.ok)throw new Error('Unable to download statement.');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='boltiv-agent-statement.csv';a.click();URL.revokeObjectURL(u);}catch(e){showAgentMessage(e.message)}};const t=await agentFetch('/api/agent/transactions?limit=200');const d=await agentFetch('/api/agent/dashboard');const rows=t.transactions||[];const now=new Date();const start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-6);const weekProfit=rows.filter(x=>String(x.status).toLowerCase()==='successful'&&new Date(x.date)>=start).reduce((sum,x)=>sum+Number(x.profit||0),0);document.getElementById('today').textContent=money(d.today.profit);document.getElementById('week').textContent=money(weekProfit);const render=f=>{const filtered=f==='all'?rows:rows.filter(x=>String(x.status).toLowerCase()===f);document.getElementById('list').innerHTML=filtered.length?filtered.map(r=>`<div class="activity-row"><div class="activity-main"><strong>${esc(r.service)}</strong><small>${esc(r.recipient||r.reference)} · ${new Date(r.date).toLocaleDateString('en-NG',{day:'2-digit',month:'short'})}</small></div><div class="activity-right"><strong>${money(r.customerSellingPrice||r.agentPrice)}</strong><small class="profit">Profit ${money(r.profit)}</small><small class="status ${esc(r.status)}">${esc(r.status)}</small></div></div>`).join(''):'<div class="empty">No transactions in this filter.</div>'};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render('all');})().catch(e=>showAgentMessage(e.message));</script></body></html>
