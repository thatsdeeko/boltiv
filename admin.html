<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>BOLTIV — Admin Control Center</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--gold:#b8860b;
--gold2:#9b7315;
--gold-light:#fff9e6;

--bg:#f7f7f5;
--card:#ffffff;
--text:#171717;
--muted:#777;
--line:#e8e8e8;

--success:#18753b;
--success-bg:#edf9f1;

--danger:#b42318;
--danger-bg:#fff1f0;

--warning:#856404;
--warning-bg:#fff9e6;

--sidebar:245px;
}

body{
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
font-size:14px;
min-height:100vh;
}

button,
input,
select{
font:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}


/* =========================
   LOGIN
========================= */

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-card{
width:100%;
max-width:400px;
padding:30px;
background:#fff;
border:1px solid var(--line);
border-radius:22px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.logo{
text-align:center;
color:var(--gold2);
font-size:35px;
font-weight:1000;
letter-spacing:5px;
}

.login-title{
text-align:center;
margin-top:10px;
font-size:18px;
font-weight:1000;
}

.login-sub{
text-align:center;
margin:7px 0 27px;
color:#888;
font-size:11px;
letter-spacing:1px;
}

label{
display:block;
margin-bottom:7px;
color:#555;
font-size:11px;
font-weight:900;
letter-spacing:.5px;
}

input,
select{
width:100%;
height:46px;
padding:0 13px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
background:#fff;
color:#171717;
}

input:focus,
select:focus{
border-color:var(--gold);
box-shadow:0 0 0 3px rgba(184,134,11,.10);
}

.login-card input{
margin-bottom:16px;
}

.login-btn{
width:100%;
height:49px;
border:0;
border-radius:11px;
background:var(--gold);
color:#171717;
font-weight:1000;
}

.login-btn:hover{
background:#c19420;
}

.login-btn:disabled{
opacity:.55;
}

.message{
display:none;
margin-top:14px;
padding:12px;
border-radius:10px;
text-align:center;
font-size:11px;
line-height:1.5;
}

.message.show{
display:block;
}

.message.error{
color:var(--danger);
background:var(--danger-bg);
border:1px solid #f1c7c2;
}

.message.success{
color:var(--warning);
background:var(--warning-bg);
border:1px solid #ead58a;
}


/* =========================
   APP
========================= */

.app{
min-height:100vh;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:var(--sidebar);
background:#fff;
border-right:1px solid var(--line);
z-index:100;
display:flex;
flex-direction:column;
}

.sidebar-brand{
height:72px;
padding:0 22px;
display:flex;
align-items:center;
border-bottom:1px solid var(--line);
}

.sidebar-logo{
color:var(--gold2);
font-size:24px;
font-weight:1000;
letter-spacing:3px;
}

.sidebar-sub{
font-size:8px;
color:#999;
margin-top:3px;
font-weight:800;
letter-spacing:.7px;
}

.sidebar-nav{
padding:14px 10px;
overflow-y:auto;
flex:1;
}

.nav-label{
padding:12px 10px 7px;
font-size:8px;
font-weight:1000;
color:#999;
letter-spacing:1px;
}

.nav-item{
width:100%;
display:flex;
align-items:center;
gap:11px;
padding:11px 12px;
margin-bottom:3px;
border:0;
border-radius:9px;
background:transparent;
color:#555;
text-align:left;
font-size:11px;
font-weight:800;
}

.nav-item:hover{
background:#faf7ec;
color:var(--gold2);
}

.nav-item.active{
background:var(--gold-light);
color:var(--gold2);
}

.nav-icon{
width:19px;
text-align:center;
font-size:15px;
}

.sidebar-bottom{
padding:12px;
border-top:1px solid var(--line);
}

.admin-mini{
padding:10px;
background:#fafafa;
border-radius:10px;
}

.admin-mini-name{
font-size:10px;
font-weight:900;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.admin-mini-role{
font-size:8px;
color:#999;
margin-top:3px;
}

.sidebar-logout{
width:100%;
margin-top:8px;
padding:9px;
border:1px solid #ead58a;
border-radius:8px;
background:var(--gold-light);
color:#8a6b10;
font-size:9px;
font-weight:1000;
}


/* =========================
   MAIN
========================= */

.main{
margin-left:var(--sidebar);
min-height:100vh;
}


/* =========================
   TOPBAR
========================= */

.topbar{
height:72px;
padding:0 25px;
display:flex;
align-items:center;
justify-content:space-between;
background:#fff;
border-bottom:1px solid var(--line);
position:sticky;
top:0;
z-index:50;
}

.topbar-left{
display:flex;
align-items:center;
gap:12px;
}

.mobile-menu{
display:none;
border:1px solid #ddd;
background:#fff;
border-radius:8px;
width:36px;
height:36px;
}

.page-title{
font-size:18px;
font-weight:1000;
}

.page-subtitle{
font-size:9px;
color:#999;
margin-top:3px;
}

.topbar-right{
display:flex;
align-items:center;
gap:10px;
}

.notification-btn{
width:36px;
height:36px;
border:1px solid #ddd;
border-radius:9px;
background:#fff;
position:relative;
}

.notification-dot{
position:absolute;
right:6px;
top:5px;
width:6px;
height:6px;
border-radius:50%;
background:#c33;
}

.admin-avatar{
width:35px;
height:35px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:var(--gold-light);
color:var(--gold2);
font-size:11px;
font-weight:1000;
}


/* =========================
   CONTENT
========================= */

.content{
padding:25px;
max-width:1400px;
margin:auto;
}

.page{
display:none;
}

.page.active{
display:block;
}


/* =========================
   PAGE HEADER
========================= */

.page-header{
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:15px;
margin-bottom:22px;
}

.page-header h1{
font-size:25px;
font-weight:1000;
}

.page-header p{
margin-top:5px;
font-size:10px;
color:#888;
}

.header-actions{
display:flex;
gap:8px;
}

.btn{
border:1px solid #ddd;
background:#fff;
border-radius:8px;
padding:9px 13px;
font-size:9px;
font-weight:900;
}

.btn:hover{
border-color:var(--gold);
color:var(--gold2);
}

.btn-primary{
background:var(--gold);
border-color:var(--gold);
color:#171717;
}

.btn-danger{
background:var(--danger-bg);
border-color:#f1c7c2;
color:var(--danger);
}


/* =========================
   STAT CARDS
========================= */

.stats{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:13px;
margin-bottom:20px;
}

.stat{
background:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:17px;
box-shadow:0 4px 18px rgba(0,0,0,.025);
}

.stat-top{
display:flex;
align-items:center;
justify-content:space-between;
}

.stat-label{
font-size:9px;
font-weight:900;
color:#777;
letter-spacing:.5px;
}

.stat-icon{
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
border-radius:8px;
background:var(--gold-light);
font-size:14px;
}

.stat-value{
margin-top:10px;
font-size:22px;
font-weight:1000;
color:var(--gold2);
}

.stat-change{
margin-top:7px;
font-size:8px;
font-weight:800;
}

.stat-change.up{
color:var(--success);
}

.stat-change.down{
color:var(--danger);
}


/* =========================
   CARDS
========================= */

.grid-2{
display:grid;
grid-template-columns:1.5fr 1fr;
gap:15px;
}

.grid-3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.card{
background:#fff;
border:1px solid var(--line);
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 18px rgba(0,0,0,.025);
}

.card-head{
padding:15px 17px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
}

.card-head h2{
font-size:12px;
font-weight:1000;
}

.card-body{
padding:17px;
}


/* =========================
   CHART PLACEHOLDER
========================= */

.chart{
height:270px;
display:flex;
align-items:flex-end;
gap:9px;
padding:20px 10px 10px;
}

.bar{
flex:1;
background:linear-gradient(to top,#b8860b,#d5b64c);
border-radius:5px 5px 0 0;
min-height:20px;
}

.chart-labels{
display:flex;
gap:9px;
padding:0 10px 15px;
}

.chart-labels span{
flex:1;
text-align:center;
font-size:7px;
color:#999;
}


/* =========================
   TABLES
========================= */

.table-tools{
padding:12px 15px;
display:flex;
gap:8px;
border-bottom:1px solid var(--line);
}

.table-tools input{
max-width:300px;
height:36px;
margin:0;
font-size:10px;
}

.table-wrap{
width:100%;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:700px;
}

th,
td{
padding:12px;
text-align:left;
border-bottom:1px solid #eee;
white-space:nowrap;
font-size:9px;
}

th{
background:#fafafa;
color:#888;
font-size:7px;
letter-spacing:.7px;
}

td{
color:#333;
}

tr:last-child td{
border-bottom:0;
}

.amount{
font-weight:1000;
color:var(--gold2);
}

.status{
display:inline-block;
padding:5px 8px;
border-radius:6px;
font-size:7px;
font-weight:1000;
text-transform:uppercase;
}

.status.successful,
.status.completed,
.status.active{
color:var(--success);
background:var(--success-bg);
}

.status.failed,
.status.suspended,
.status.banned{
color:var(--danger);
background:var(--danger-bg);
}

.status.pending,
.status.processing{
color:var(--warning);
background:var(--warning-bg);
}


/* =========================
   ATTENTION
========================= */

.attention-list{
display:flex;
flex-direction:column;
gap:9px;
}

.attention{
padding:11px;
border:1px solid var(--line);
border-radius:9px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.attention-left{
display:flex;
align-items:center;
gap:9px;
}

.attention-icon{
width:28px;
height:28px;
border-radius:7px;
display:flex;
align-items:center;
justify-content:center;
background:var(--danger-bg);
color:var(--danger);
}

.attention-title{
font-size:9px;
font-weight:900;
}

.attention-sub{
font-size:7px;
color:#999;
margin-top:3px;
}

.attention-count{
font-size:12px;
font-weight:1000;
color:var(--gold2);
}


/* =========================
   QUICK ACTIONS
========================= */

.quick-actions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.quick-action{
padding:13px;
border:1px solid var(--line);
border-radius:9px;
background:#fff;
text-align:left;
}

.quick-action:hover{
border-color:#d7bd69;
background:#fffdf5;
}

.quick-action-icon{
font-size:18px;
}

.quick-action-title{
margin-top:7px;
font-size:9px;
font-weight:1000;
}

.quick-action-sub{
margin-top:3px;
font-size:7px;
color:#999;
}


/* =========================
   USER CARDS
========================= */

.user-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.user-card{
padding:15px;
border:1px solid var(--line);
border-radius:12px;
background:#fff;
}

.user-top{
display:flex;
align-items:center;
gap:10px;
}

.user-avatar{
width:37px;
height:37px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:var(--gold-light);
color:var(--gold2);
font-size:10px;
font-weight:1000;
}

.user-name{
font-size:10px;
font-weight:1000;
}

.user-email{
font-size:8px;
color:#999;
margin-top:3px;
}

.user-info{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px;
}

.user-info div{
padding:8px;
background:#fafafa;
border-radius:7px;
}

.user-info span{
display:block;
font-size:7px;
color:#999;
}

.user-info strong{
display:block;
font-size:9px;
margin-top:3px;
}


/* =========================
   SETTINGS
========================= */

.settings-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.setting-row{
padding:14px 0;
border-bottom:1px solid #eee;
}

.setting-row:last-child{
border-bottom:0;
}

.setting-label{
font-size:10px;
font-weight:900;
}

.setting-description{
font-size:8px;
color:#999;
margin-top:4px;
}

.toggle{
width:40px;
height:22px;
border:0;
border-radius:20px;
background:#ddd;
position:relative;
}

.toggle.on{
background:var(--gold);
}

.toggle:after{
content:"";
position:absolute;
top:3px;
left:3px;
width:16px;
height:16px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.toggle.on:after{
left:21px;
}


/* =========================
   SYSTEM STATUS
========================= */

.system-list{
display:flex;
flex-direction:column;
gap:10px;
}

.system-row{
display:flex;
align-items:center;
justify-content:space-between;
padding:13px;
border:1px solid var(--line);
border-radius:9px;
}

.system-name{
font-size:9px;
font-weight:900;
}

.system-status{
display:flex;
align-items:center;
gap:6px;
font-size:8px;
font-weight:900;
}

.online-dot{
width:7px;
height:7px;
border-radius:50%;
background:#2d9b58;
}


/* =========================
   OVERLAY
========================= */

.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
z-index:90;
}

.overlay.show{
display:block;
}


/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.grid-2{
grid-template-columns:1fr;
}

.user-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

:root{
--sidebar:245px;
}

.sidebar{
transform:translateX(-100%);
transition:.25s;
}

.sidebar.open{
transform:translateX(0);
}

.main{
margin-left:0;
}

.mobile-menu{
display:block;
}

.topbar{
padding:0 15px;
}

.content{
padding:15px;
}

.page-header{
align-items:flex-start;
flex-direction:column;
}

.stats{
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.stat{
padding:13px;
}

.stat-value{
font-size:18px;
}

.user-grid{
grid-template-columns:1fr;
}

.settings-grid{
grid-template-columns:1fr;
}

.topbar-right .notification-btn{
display:none;
}

}

@media(max-width:400px){

.stats{
grid-template-columns:1fr 1fr;
}

.stat-label{
font-size:7px;
}

.stat-value{
font-size:16px;
}

.content{
padding:11px;
}

}
</style>
</head>
