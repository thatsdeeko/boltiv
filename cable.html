<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Cable TV</title><link rel="stylesheet" href="style.css"><script src="transaction-pin.js?v=20260815-pinfix"></script><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");</script><style>
*{box-sizing:border-box}html,body{margin:0;background:#ffffff;color:#171717;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}button,input,select{font-family:inherit}button{cursor:pointer}.page{min-height:100vh;padding-bottom:90px}.container{width:min(100% - 30px,480px);margin:auto}.header{display:flex;align-items:center;gap:14px;padding:22px 0}.back{width:40px;height:40px;border:1px solid #e5e5e1;border-radius:13px;background:#ffffff;color:#b8860b;font-size:22px}.title{font-size:20.9px;font-weight:1000}.subtitle{margin-top:4px;color:#666;font-size:10px}.card{padding:20px;border:1px solid #e5e5e1;border-radius:20px;background:#ffffff}.label{display:block;margin-bottom:8px;color:#777;font-size:10px;font-weight:900}.field{margin-bottom:17px}.providers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.provider{padding:14px;border:1px solid #e5e5e1;border-radius:13px;background:#fafaf8;color:#171717;text-align:left}.provider.active{border-color:#b8860b;background:#fffdf4}.provider-name{font-size:11px;font-weight:1000}.provider-text{margin-top:4px;color:#666;font-size:7.7px}.select,.input{width:100%;height:48px;padding:0 14px;border:1px solid #e5e5e1;border-radius:12px;background:#ffffff;color:#171717;outline:0;font-size:12.1px}.select:focus,.input:focus{border-color:#b8860b}.verify{width:100%;height:45px;border:1px solid #b8860b;border-radius:12px;background:#fffdf4;color:#b8860b;font-size:11px;font-weight:1000}.summary{display:none;margin-top:17px;padding:15px;border:1px solid #e5e5e1;border-radius:14px;background:#fafaf8}.summary-row{display:flex;justify-content:space-between;margin-bottom:8px;color:#777;font-size:10px}.summary-row:last-child{margin:0}.summary-row strong{color:#fff}.pay{width:100%;height:50px;margin-top:18px;border:0;border-radius:13px;background:#b8860b;color:#f7f7f5;font-size:11px;font-weight:1000}.pay:disabled{background:#333;color:#777}.message{display:none;margin-top:12px;padding:12px;border-radius:11px;font-size:10px;text-align:center}.error{background:#fff1f1;color:#ff8d8d;border:1px solid #4a2020}.success{background:#122313;color:#8cff9a;border:1px solid #254d29}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;display:flex;justify-content:center;padding:8px 12px;background:rgba(255,255,255,.97);border-top:1px solid #222}.nav{width:25%;max-width:110px;border:0;background:transparent;color:#555;font-size:7.7px;font-weight:900}.nav.active{color:#b8860b}.nav-icon{display:block;margin-bottom:4px;font-size:18.7px}
</style><link rel="icon" type="image/png" href="assets/boltiv-icon.png">
</head><body><div class="page"><div class="container">
<header class="header"><button class="back" onclick="history.back()">‹</button><div><div class="title">Cable TV</div><div class="subtitle">Renew your TV subscription</div></div></header>
<section class="card">
<div class="field"><label class="label">CABLE PROVIDER</label><div class="providers"><button class="provider active" data-provider="DSTV"><div class="provider-name">DStv</div><div class="provider-text">Digital Satellite TV</div></button><button class="provider" data-provider="GOTV"><div class="provider-name">GOtv</div><div class="provider-text">Digital TV</div></button></div></div>
<div class="field"><label class="label">SMARTCARD / IUC NUMBER</label><input id="smartcard" class="input" type="tel" inputmode="numeric" placeholder="Enter smartcard number"></div>
<button id="verify" class="verify">VERIFY NUMBER</button>
<div class="field" style="margin-top:18px"><label class="label">SUBSCRIPTION PLAN</label><select id="plan" class="select"><option value="">Select a plan</option><option value="Compact">DStv Compact — ₦19,000</option><option value="Confam">DStv Confam — ₦11,000</option><option value="Yanga">DStv Yanga — ₦6,000</option><option value="Jolli">GOtv Jolli — ₦5,800</option><option value="Max">GOtv Max — ₦8,500</option></select></div>
<div id="summary" class="summary"><div class="summary-row"><span>Provider</span><strong id="sumProvider">-</strong></div><div class="summary-row"><span>Number</span><strong id="sumNumber">-</strong></div><div class="summary-row"><span>Plan</span><strong id="sumPlan">-</strong></div><div class="summary-row"><span>Amount</span><strong id="sumAmount">₦0.00</strong></div></div>
<button id="pay" class="pay" disabled>PAY CABLE TV</button><div id="message" class="message"></div>
</section></div></div>
<nav class="bottom-nav"><button class="nav" onclick="location.href='index.html'"><span class="nav-icon">⌂</span>Home</button><button class="nav" onclick="location.href='wallet.html'"><span class="nav-icon">₦</span>Wallet</button><button class="nav" onclick="location.href='transactions.html'"><span class="nav-icon">↯</span>Activity</button><button class="nav" onclick="location.href='profile.html'"><span class="nav-icon">◉</span>Profile</button></nav>
<script>
// Cable TV logic
const providers=document.querySelectorAll(".provider"),smartcard=document.getElementById("smartcard"),plan=document.getElementById("plan"),verify=document.getElementById("verify"),pay=document.getElementById("pay"),summary=document.getElementById("summary"),message=document.getElementById("message");let selectedProvider="DSTV",verified=false;
const plans={Compact:19000,Confam:11000,Yanga:6000,Jolli:5800,Max:8500},money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2}),getBalance=()=>Number(localStorage.getItem("boltivWalletBalance")||0),setBalance=v=>localStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(v)||0)));
function getTransactions(){try{let x=JSON.parse(localStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveTransaction(x){let t=getTransactions();t.unshift(x);localStorage.setItem("boltivTransactions",JSON.stringify(t))}
function showMessage(t,c){message.textContent=t;message.className="message "+c;message.style.display="block"}
providers.forEach(b=>b.onclick=()=>{providers.forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedProvider=b.dataset.provider;verified=false;summary.style.display="none";pay.disabled=true});
verify.onclick=()=>{let n=smartcard.value.trim();if(n.length<8)return showMessage("Enter a valid smartcard or IUC number.","error");verified=true;updateSummary();checkPayment();showMessage("Number verified successfully.","success")};
plan.onchange=()=>{if(verified)updateSummary();checkPayment()};
function updateSummary(){let v=plans[plan.value]||0;document.getElementById("sumProvider").textContent=selectedProvider;document.getElementById("sumNumber").textContent=smartcard.value.trim();document.getElementById("sumPlan").textContent=plan.value||"-";document.getElementById("sumAmount").textContent=money(v);summary.style.display="block"}
function checkPayment(){pay.disabled=!(verified&&plans[plan.value])}
pay.onclick=async()=>{let value=plans[plan.value],number=smartcard.value.trim();if(!verified)return showMessage("Please verify your smartcard or IUC number first.","error");if(!value)return showMessage("Select a subscription plan.","error");pay.disabled=true;const transactionPin=await boltivGetTransactionPin();if(!transactionPin){pay.disabled=false;return;}showMessage("Processing your cable subscription...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/cable",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,smartcard:number,plan:plan.value,amount:value,service:"cable",providerPayload:{service:"cable",provider:selectedProvider,smartcard:number,plan:plan.value,amount:value},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin:transactionPin})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process cable payment.");showMessage(`${d.message||"Cable TV request received."} Reference: ${d.reference||"-"}`,d.status==="pending"?"success":"success");}catch(e){showMessage(e.message||"Cable payment failed.","error");}finally{pay.disabled=false}};
</script></body></html>
