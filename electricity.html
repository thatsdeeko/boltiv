<body>
<div class="page"><div class="container">
<header class="header"><button class="back" onclick="history.back()">‹</button><div><div class="title">Electricity</div><div class="subtitle">Pay your electricity bill</div></div></header>
<section class="card">
<div class="field"><label class="label" id="electricity-provider-label">ELECTRICITY PROVIDER</label><div aria-labelledby="electricity-provider-label" class="providers" role="group">
<button aria-label="IKEDC Ikeja Electric" class="provider active" data-provider="IKEDC"><div class="provider-name">IKEDC</div><div class="provider-text">Ikeja Electric</div></button>
<button aria-label="EKEDC Eko Electric" class="provider" data-provider="EKEDC"><div class="provider-name">EKEDC</div><div class="provider-text">Eko Electric</div></button>
<button aria-label="AEDC Abuja Electric" class="provider" data-provider="AEDC"><div class="provider-name">AEDC</div><div class="provider-text">Abuja Electric</div></button>
<button aria-label="KEDCO Kano Electric" class="provider" data-provider="KEDCO"><div class="provider-name">KEDCO</div><div class="provider-text">Kano Electric</div></button>
</div></div>
<div class="field"><label class="label" id="meter-type-label">METER TYPE</label><select aria-label="Meter type" aria-labelledby="meter-type-label" class="select" id="meterType"><option value="Prepaid">Prepaid</option><option value="Postpaid">Postpaid</option></select></div>
<div class="field"><label class="label" id="meter-number-label">METER NUMBER</label><input aria-label="Meter number" aria-labelledby="meter-number-label" class="input" id="meter" inputmode="numeric" placeholder="Enter meter number" type="tel"/></div>
<button class="verify" id="verify">VERIFY METER</button>
<div class="field" style="margin-top:18px"><label class="label" for="amount">AMOUNT</label><div class="amount-box"><span class="currency">₦</span><input aria-label="Amount" class="amount" id="amount" inputmode="decimal" min="100" placeholder="Enter amount" type="number"/></div></div>
<div class="summary" id="summary"><div class="summary-row"><span>Provider</span><strong id="sumProvider">-</strong></div><div class="summary-row"><span>Meter</span><strong id="sumMeter">-</strong></div><div class="summary-row"><span>Type</span><strong id="sumType">-</strong></div><div class="summary-row"><span>Amount</span><strong id="sumAmount">₦0.00</strong></div></div>
<button class="pay" disabled="" id="pay">PAY ELECTRICITY</button><div aria-live="polite" class="message" id="message" role="status"></div>
</section>
</div></div>
<nav class="bottom-nav">
<button class="nav" onclick="location.href='/dashboard'"><span class="nav-icon">⌂</span><span>Home</span></button>
<button class="nav" onclick="location.href='/wallet'"><span class="nav-icon">₦</span><span>Wallet</span></button>
<button class="nav" onclick="location.href='/transactions'"><span class="nav-icon">↯</span><span>Activity</span></button>
<button class="nav" onclick="location.href='/profile'"><span class="nav-icon">◉</span><span>Profile</span></button>
</nav>
<script>
const $=id=>document.getElementById(id),providers=document.querySelectorAll(".provider");
let selectedProvider="IKEDC",verified=false;
const plans={};
function money(v){return"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function balance(){return Number(boltivMemoryStorage.getItem("boltivWalletBalance")||0)}
function setBalance(v){boltivMemoryStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(v)||0)))}
function transactions(){try{let x=JSON.parse(boltivMemoryStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function save(t){let x=transactions();x.unshift(t);boltivMemoryStorage.setItem("boltivTransactions",JSON.stringify(x))}
function msg(t,c){$("message").textContent=t;$("message").className="message "+c;$("message").style.display="block"}
function check(){let v=Number($("amount").value);$("pay").disabled=!(verified&&v>=100);if(verified&&v>=100)$("sumAmount").textContent=money(v)}
providers.forEach(b=>b.onclick=()=>{providers.forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedProvider=b.dataset.provider;verified=false;$("summary").style.display="none";$("pay").disabled=true});
$("verify").onclick=async()=>{let n=$("meter").value.trim(),meterType=$("meterType").value;if(n.length<8)return msg("Enter a valid meter number.","error");$("verify").disabled=true;verified=false;$("pay").disabled=true;msg("Verifying meter with VTUGATE API...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/electricity/verify",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,meterNumber:n,meterType})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to verify electricity meter.");verified=true;$("sumProvider").textContent=selectedProvider;$("sumMeter").textContent=n;$("sumType").textContent=meterType;$("summary").style.display="block";check();msg(d.message||"Meter verified successfully.","success")}catch(e){verified=false;$("summary").style.display="none";msg(e.message||"Electricity meter verification failed.","error")}finally{$("verify").disabled=false}};
$("meter").addEventListener("input",()=>{verified=false;$("pay").disabled=true;$("summary").style.display="none"});$("meterType").addEventListener("change",()=>{verified=false;$("pay").disabled=true;$("summary").style.display="none"});$("amount").addEventListener("input",check);
$("pay").onclick=async()=>{let v=Number($("amount").value),n=$("meter").value.trim();if(!verified)return msg("Please verify your meter first.","error");if(v<100)return msg("Minimum electricity payment is ₦100.","error");$("pay").disabled=true;const transactionPin=await boltivGetTransactionPin();if(!transactionPin){$("pay").disabled=false;return;}msg("Processing your electricity payment...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/electricity",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,meterNumber:n,meterType:$("meterType").value,amount:v,service:"electricity",providerPayload:{service:"electricity",provider:selectedProvider,meterNumber:n,meterType:$("meterType").value,amount:v},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin:transactionPin})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process electricity payment.");msg(`${d.message||"Electricity request received."} Reference: ${d.reference||"-"}`,"success");}catch(e){msg(e.message||"Electricity payment failed.","error");}finally{$("pay").disabled=false}};
</script>
</body>
