</head><body><div class="page exam-page"><div class="container"><div class="head"><button class="back" onclick="history.back()">‹</button><div><div class="title">Exam PINs</div><div class="sub">WAEC • NECO • NABTEB</div></div></div><div class="hero"><b>BOLTIV EDUCATION</b><h1>Get your Exam PIN.</h1><p>Buy available examination PINs instantly from your BOLTIV wallet.</p></div><div class="card"><label class="label" id="select-exam-label">SELECT EXAM</label><select aria-label="Exam type" aria-labelledby="available-products-label" class="select" id="exam"><option value="">Loading products...</option></select><label class="label" for="quantity">QUANTITY</label><select aria-label="Quantity" class="qty" id="quantity"><option value="1">1 PIN</option><option value="2">2 PINS</option><option value="5">5 PINS</option></select><label class="label" id="available-products-label">AVAILABLE PRODUCTS</label><div class="products" id="products"><div class="loading">Loading exam PINs...</div></div><button class="btn" disabled="" id="buy">BUY EXAM PIN</button><div aria-live="polite" class="result" id="result" role="status"></div></div></div></div><script>const API="https://boltiv-backend.onrender.com";const productsEl=document.getElementById("products"),examEl=document.getElementById("exam"),qtyEl=document.getElementById("quantity"),buy=document.getElementById("buy"),result=document.getElementById("result");let products=[],selected=null;async function request(path,opts={}){const token=boltivMemoryStorage.getItem("boltivAuthToken")||boltivMemoryStorage.getItem("boltivToken")||boltivMemoryStorage.getItem("token")||"";const headers={"Content-Type":"application/json",...(opts.headers||{})};if(token)headers.Authorization="Bearer "+token;const r=await fetch(API+path,{...opts,headers});let d={};try{d=await r.json()}catch{};return d}function money(v){return "₦"+Number(v).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}function render(){const exam=examEl.value;const list=products.filter(p=>!exam||String(p.exam_name||p.name).toUpperCase().includes(exam));productsEl.innerHTML=list.length?list.map(p=>`<button type="button" class="product ${selected&&selected.product_id===p.product_id?'active':''}" onclick="choose(${p.product_id})"><strong>${p.name}</strong><span>${p.exam_name||''}</span><span class="price">${money(p.customer_price)} each</span></button>`).join(''):'<div class="loading">No available exam PINs for this selection.</div>';buy.disabled=!selected}function choose(id){selected=products.find(p=>p.product_id===id)||null;render()}async function load(){const r=await request('/api/vtu/exam-pin/products');if(!r.success){productsEl.innerHTML='<div class="loading">'+(r.message||'Unable to load exam PINs.')+'</div>';return}products=r.products||[];const names=[...new Set(products.map(p=>p.exam_name||p.name).filter(Boolean))];examEl.innerHTML='<option value="">All exams</option>'+names.map(n=>`<option value="${n}">${n}</option>`).join('');examEl.onchange=()=>{selected=null;render()};render()}buy.onclick=async()=>{if(!selected)return;const qty=Number(qtyEl.value);const total=Number(selected.customer_price)*qty;if(!confirm('Buy '+qty+' PIN(s) for '+money(total)+'?'))return;const pin=prompt('Enter your 4-digit Transaction PIN:');if(!pin)return;if(!/^\d{4}$/.test(pin))return alert('Transaction PIN must be 4 digits.');buy.disabled=true;const idem='BOLTIV-EXAM-'+Date.now()+'-'+Math.random().toString(16).slice(2);const r=await request('/api/vtu/exam-pin',{method:'POST',headers:{'X-Idempotency-Key':idem},body:JSON.stringify({service:'exam_pin',product_id:selected.product_id,product_code:selected.product_code,quantity:qty,amount:total,transactionPin:pin,idempotencyKey:idem})});buy.disabled=false;if(!r.success){alert(r.message||'Exam PIN purchase failed.');return}result.style.display='block';const delivery=r.delivery||r.providerData?.delivery||{};const pins=delivery.pins||r.pins||[];result.innerHTML='<strong>PIN PURCHASE SUCCESSFUL</strong><div style="margin-top:8px">'+(pins.length?pins.map(x=>`<div class="pin">${x}</div>`).join(''):'Your PIN purchase was successful. Check Transactions for the provider reference.')+'</div>'};load();</script></body></html>
