<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>BOLTIV — Reset Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<div class="container">

<div class="auth-page">

<div class="auth-logo">BOLTIV</div>
<div class="auth-tagline">FAST. SIMPLE. POWERFUL.</div>

<div class="auth-card">
<h1>Reset Password</h1>
<p class="auth-subtitle">Enter your email to reset your password</p>

<div class="form-group">
<label class="label">Email</label>
<input class="input" id="emailInput" type="email" placeholder="you@example.com">
</div>

<button class="btn btn-primary auth-btn" id="resetButton">
Reset Password
</button>

<div class="auth-links">
<a href="login.html">Back to Login</a>
<a href="register.html">Create Account</a>
</div>
</div>

</div>
</div>
</div>

<script>
document.getElementById("resetButton").onclick=()=>{
const email=document.getElementById("emailInput").value.trim();

if(!/^\S+@\S+\.\S+$/.test(email)){
alert("Enter a valid email address.");
return;
}

const saved=localStorage.getItem("boltivUser");

if(!saved){
alert("No BOLTIV account was found.");
return;
}

let user;

try{
user=JSON.parse(saved);
}catch(e){
alert("Unable to read account information.");
return;
}

if(user.email.toLowerCase()!==email.toLowerCase()){
alert("No account was found with this email.");
return;
}

alert(
"Password reset requested.\n\n"+
"In the live BOLTIV app, a secure reset link would be sent to your email."
);

location.href="login.html";
};
</script>

</body>
</html>
