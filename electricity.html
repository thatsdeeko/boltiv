<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>BOLTIV — Electricity</title>
<link rel="stylesheet" href="style.css">
<script>
if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select{font-family:inherit}
button{cursor:pointer}
.page{min-height:100vh;padding-bottom:90px}
.container{width:min(100% - 30px,480px);margin:auto}
.header{display:flex;align-items:center;gap:14px;padding:22px 0}
.back{width:40px;height:40px;border:1px solid #292929;border-radius:13px;background:#111;color:#d4af37;font-size:20px}
.title{font-size:19px;font-weight:1000}
.subtitle{margin-top:4px;color:#666;font-size:8px}
.card{padding:20px;border:1px solid #292929;border-radius:20px;background:#101010}
.label{display:block;margin-bottom:8px;color:#777;font-size:8px;font-weight:900}
.input,.select{width:100%;height:48px;padding:0 14px;border:1px solid #292929;border-radius:12px;background:#080808;color:#fff;outline:none;font-size:11px}
.input:focus,.select:focus{border-color:#d4af37}
.field{margin-bottom:17px}
.providers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.provider{padding:13px;border:1px solid #292929;border-radius:13px;background:#0b0b0b;color:#fff;text-align:left}
.provider.active{border-color:#d4af37;background:#17140b}
.provider-name{font-size:9px;font-weight:1000}
.provider-text{margin-top:4px;color:#666;font-size:7px}
.verify{width:100%;height:45px;margin-top:3px;border:1px solid #d4af37;border-radius:12px;background:#17140b;color:#d4af37;font-size:9px;font-weight:1000}
.amount-box{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border:1px solid #292929;border-radius:12px;background:#080808}
.currency{color:#d4af37;font-size:13px;font-weight:1000}
.amount{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:13px}
.summary{display:none;margin-top:17px;padding:15px;border:1px solid #292929;border-radius:14px;background:#0b0b0b}
.summary-row{display:flex;justify-content:space-between;margin-bottom:8px;color:#777;font-size:8px}
.summary-row:last-child{margin-bottom:0}
.summary-row strong{color:#fff}
.pay{width:100%;height:50px;margin-top:18px;border:0;border-radius:13px;background:#d4af37;color:#050505;font-size:10px;font-weight:1000}
.pay:disabled{background:#333;color:#777}
.message{display:none;margin-top:12px;padding:12px;border-radius:11px;font-size:8px;text-align:center}
.error{background:#2a1111;color:#ff8d8d;border:1px solid #4a2020}
.success{background:#122313;color:#8cff9a;border:1px solid #254d29}
.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;display:flex;justify-content:center;padding:8px 12px;background:rgba(7,7,7,.97);border-top:1px solid #222}
.nav{width:25%;max-width:110px;border:0;background:transparent;color:#555;font-size:7px;font-weight:900}
.nav.active{color:#d4af37}
.nav-icon{display:block;margin-bottom:4px;font-size:17px}
</style>
</head>
<body>
<div class="page">
<div class="container">
<header class="header">
<button class="back" onclick="history.back()">‹</button>
<div>
<div class="title">Electricity</div>
<div class="subtitle">Pay your electricity bill</div>
</div>
</header>

<section class="card">
<div class="field">
<label class="label">ELECTRICITY PROVIDER</label>
<div class="providers">
<button class="provider active" data-provider="IKEDC"><div class="provider-name">IKEDC</div><div class="provider-text">Ikeja Electric</div></button>
<button class="provider" data-provider="EKEDC"><div class="provider-name">EKEDC</div><div class="provider-text">Eko Electric</div></button>
<button class="provider" data-provider="AEDC"><div class="provider-name">AEDC</div><div class="provider-text">Abuja Electric</div></button>
<button class="provider" data-provider="KEDCO"><div class="provider-name">KEDCO</div><div class="provider-text">Kano Electric</div></button>
</div>
</div>

<div class="field">
<label class="label" for="meterType">METER TYPE</label>
<select id="meterType" class="select">
<option value="Prepaid">Prepaid</option>
<option value="Postpaid">Postpaid</option>
</select>
</div>

<div class="field">
<label class="label" for="meter">METER NUMBER</label>
<input id="meter" class="input" type="tel" inputmode="numeric" placeholder="Enter meter number">
</div>

<button id="verify" class="verify">VERIFY METER</button>

<div class="field" style="margin-top:18px">
<label class="label" for="amount">AMOUNT</label>
<div class="amount-box">
<span class="currency">₦</span>
<input id="amount" class="amount" type="number" inputmode="decimal" min="100" placeholder="Enter amount">
</div>
</div>

<div id="summary" class="summary">
<div class="summary-row"><span>Provider</span><strong id="sumProvider">-</strong></div>
<div class="summary-row"><span>Meter</span><strong id="sumMeter">-</strong></div>
<div class="summary-row"><span>Type</span><strong id="sumType">-</strong></div>
<div class="summary-row"><span>Amount</span><strong id="sumAmount">₦0.00</strong></div>
</div>

<button id="pay" class="pay" disabled>PAY ELECTRICITY</button>
<div id="message" class="message"></div>
</section>
</div>
</div>

<nav class="bottom-nav">
<button class="nav" onclick="location.href='index.html'"><span class="nav-icon">⌂</span>Home</button>
<button class="nav" onclick="location.href='wallet.html'"><span class="nav-icon">₦</span>Wallet</button>
<button class="nav" onclick="location.href='transactions.html'"><span class="nav-icon">↯</span>Activity</button>
<button class="nav active" onclick="location.href='profile.html'"><span class="nav-icon">◉</span>Profile</button>
</nav>

<script>
const providers=document.querySelectorAll(".provider");
const meter=document.getElementById("meter");
const meterType=document.getElementById("meterType");
const amount=document.getElementById("amount");
const verify=document.getElementById("verify");
const pay=document.getElementById("pay");
const summary=document.getElementById("summary");
const message=document.getElementById("message");

let selectedProvider="IKEDC";
let verified=false;

function money(value){
return"₦"+Number(value||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function getBalance(){
return Number(localStorage.getItem("boltivWalletBalance")||0);
}

function setBalance(value){
localStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(value)||0)));
}

function getTransactions(){
try{
const data=JSON.parse(localStorage.getItem("boltivTransactions")||"[]");
return Array.isArray(data)?data:[];
}catch(e){return[]}
}

function saveTransaction(transaction){
const transactions=getTransactions();
transactions.unshift(transaction);
localStorage.setItem("boltivTransactions",JSON.stringify(transactions));
}

function showMessage(text,type){
message.textContent=text;
message.className="message "+type;
message.style.display="block";
}

providers.forEach(btn=>{
btn.onclick=()=>{
providers.forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
selectedProvider=btn.dataset.provider;
verified=false;
summary.style.display="none";
pay.disabled=true;
};
});

verify.onclick=()=>{
const meterNumber=meter.value.trim();

if(meterNumber.length<8){
showMessage("Enter a valid meter number.","error");
return;
}

verified=true;

document.getElementById("sumProvider").textContent=selectedProvider;
document.getElementById("sumMeter").textContent=meterNumber;
document.getElementById("sumType").textContent=meterType.value;

summary.style.display="block";
checkPayment();
showMessage("Meter verified successfully.","success");
};

function checkPayment(){
const value=Number(amount.value);
pay.disabled=!(verified&&value>=100);

if(verified&&value>=100){
document.getElementById("sumAmount").textContent=money(value);
}
}

amount.addEventListener("input",checkPayment);

pay.onclick=()=>{
const value=Number(amount.value);
const meterNumber=meter.value.trim();

if(!verified){
showMessage("Please verify your meter first.","error");
return;
}

if(value<100){
showMessage("Minimum electricity payment is ₦100.","error");
return;
}

const balance=getBalance();

if(balance<value){
showMessage(`Insufficient wallet balance. Available: ${money(balance)}.`,"error");
return;
}

const newBalance=balance-value;
setBalance(newBalance);

const now=new Date();
const transactionId="BTV-"+Date.now().toString().slice(-8);

saveTransaction({
id:transactionId,
type:"electricity",
service:"Electricity",
title:"Electricity Payment",
provider:selectedProvider,
meterNumber:meterNumber,
meterType:meterType.value,
amount:value,
status:"Successful",
direction:"debit",
date:now.toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"}),
createdAt:now.toISOString()
});

showMessage(`Electricity payment successful. ${money(value)} deducted from your wallet.`,"success");
pay.disabled=true;
amount.value="";
document.getElementById("sumAmount").textContent="₦0.00";
};
</script>
</body>
</html>
