<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>BOLTIV — Cable TV</title>
<link rel="stylesheet" href="style.css">
<script>
if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,select{font-family:inherit}
button{cursor:pointer}
.page{min-height:100vh;padding-bottom:90px}
.container{width:min(100% - 30px,480px);margin:auto}
.header{display:flex;align-items:center;gap:14px;padding:22px 0}
.back{width:40px;height:40px;border:1px solid #292929;border-radius:13px;background:#111;color:#d4af37;font-size:20px}
.title{font-size:19px;font-weight:1000}
.subtitle{margin-top:4px;color:#666;font-size:8px}
.card{padding:20px;border:1px solid #292929;border-radius:20px;background:#101010}
.label{display:block;margin-bottom:8px;color:#777;font-size:8px;font-weight:900}
.field{margin-bottom:17px}
.providers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.provider{padding:14px;border:1px solid #292929;border-radius:13px;background:#0b0b0b;color:#fff;text-align:left}
.provider.active{border-color:#d4af37;background:#17140b}
.provider-name{font-size:9px;font-weight:1000}
.provider-text{margin-top:4px;color:#666;font-size:7px}
.select,.input{width:100%;height:48px;padding:0 14px;border:1px solid #292929;border-radius:12px;background:#080808;color:#fff;outline:0;font-size:11px}
.select:focus,.input:focus{border-color:#d4af37}
.verify{width:100%;height:45px;border:1px solid #d4af37;border-radius:12px;background:#17140b;color:#d4af37;font-size:9px;font-weight:1000}
.summary{display:none;margin-top:17px;padding:15px;border:1px solid #292929;border-radius:14px;background:#0b0b0b}
.summary-row{display:flex;justify-content:space-between;margin-bottom:8px;color:#777;font-size:8px}
.summary-row:last-child{margin:0}
.summary-row strong{color:#fff}
.pay{width:100%;height:50px;margin-top:18px;border:0;border-radius:13px;background:#d4af37;color:#050505;font-size:10px;font-weight:1000}
.pay:disabled{background:#333;color:#777}
.message{display:none;margin-top:12px;padding:12px;border-radius:11px;font-size:8px;text-align:center}
.error{background:#2a1111;color:#ff8d8d;border:1px solid #4a2020}
.success{background:#122313;color:#8cff9a;border:1px solid #254d29}
.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;display:flex;justify-content:center;padding:8px 12px;background:rgba(7,7,7,.97);border-top:1px solid #222}
.nav{width:25%;max-width:110px;border:0;background:transparent;color:#555;font-size:7px;font-weight:900}
.nav.active{color:#d4af37}
.nav-icon{display:block;margin-bottom:4px;font-size:17px}
</style>
</head>
<body>
<div class="page">
<div class="container">

<header class="header">
<button class="back" onclick="history.back()">‹</button>
<div>
<div class="title">Cable TV</div>
<div class="subtitle">Renew your TV subscription</div>
</div>
</header>

<section class="card">

<div class="field">
<label class="label">CABLE PROVIDER</label>
<div class="providers">
<button class="provider active" data-provider="DSTV">
<div class="provider-name">DStv</div>
<div class="provider-text">Digital Satellite TV</div>
</button>
<button class="provider" data-provider="GOTV">
<div class="provider-name">GOtv</div>
<div class="provider-text">Digital TV</div>
</button>
</div>
</div>

<div class="field">
<label class="label" for="smartcard">SMARTCARD / IUC NUMBER</label>
<input id="smartcard" class="input" type="tel" inputmode="numeric" placeholder="Enter smartcard number">
</div>

<button id="verify" class="verify">VERIFY NUMBER</button>

<div class="field" style="margin-top:18px">
<label class="label" for="plan">SUBSCRIPTION PLAN</label>
<select id="plan" class="select">
<option value="">Select a plan</option>
<option value="Compact">DStv Compact — ₦19,000</option>
<option value="Confam">DStv Confam — ₦11,000</option>
<option value="Yanga">DStv Yanga — ₦6,000</option>
<option value="Jolli">GOtv Jolli — ₦5,800</option>
<option value="Max">GOtv Max — ₦8,500</option>
</select>
</div>

<div id="summary" class="summary">
<div class="summary-row"><span>Provider</span><strong id="sumProvider">-</strong></div>
<div class="summary-row"><span>Number</span><strong id="sumNumber">-</strong></div>
<div class="summary-row"><span>Plan</span><strong id="sumPlan">-</strong></div>
<div class="summary-row"><span>Amount</span><strong id="sumAmount">₦0.00</strong></div>
</div>

<button id="pay" class="pay" disabled>PAY CABLE TV</button>
<div id="message" class="message"></div>

</section>
</div>
</div>

<nav class="bottom-nav">
<button class="nav" onclick="location.href='index.html'"><span class="nav-icon">⌂</span>Home</button>
<button class="nav" onclick="location.href='wallet.html'"><span class="nav-icon">₦</span>Wallet</button>
<button class="nav" onclick="location.href='transactions.html'"><span class="nav-icon">↯</span>Activity</button>
<button class="nav" onclick="location.href='profile.html'"><span class="nav-icon">◉</span>Profile</button>
</nav>

<script>
const providers=document.querySelectorAll(".provider");
const smartcard=document.getElementById("smartcard");
const plan=document.getElementById("plan");
const verify=document.getElementById("verify");
const pay=document.getElementById("pay");
const summary=document.getElementById("summary");
const message=document.getElementById("message");

let selectedProvider="DSTV";
let verified=false;

const plans={
Compact:19000,
Confam:11000,
Yanga:6000,
Jolli:5800,
Max:8500
};

function money(value){
return"₦"+Number(value||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function getBalance(){
return Number(localStorage.getItem("boltivWalletBalance")||0);
}

function setBalance(value){
localStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(value)||0)));
}

function getTransactions(){
try{
const data=JSON.parse(localStorage.getItem("boltivTransactions")||"[]");
return Array.isArray(data)?data:[];
}catch(e){
return[];
}
}

function saveTransaction(transaction){
const transactions=getTransactions();
transactions.unshift(transaction);
localStorage.setItem("boltivTransactions",JSON.stringify(transactions));
}

providers.forEach(btn=>{
btn.onclick=()=>{
providers.forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
selectedProvider=btn.dataset.provider;
verified=false;
summary.style.display="none";
pay.disabled=true;
};
});

verify.onclick=()=>{
const number=smartcard.value.trim();

if(number.length<8){
showMessage("Enter a valid smartcard or IUC number.","error");
return;
}

verified=true;
updateSummary();
checkPayment();
showMessage("Number verified successfully.","success");
};

plan.onchange=()=>{
if(verified)updateSummary();
checkPayment();
};

function updateSummary(){
const value=plans[plan.value]||0;

document.getElementById("sumProvider").textContent=selectedProvider;
document.getElementById("sumNumber").textContent=smartcard.value.trim();
document.getElementById("sumPlan").textContent=plan.value||"-";
document.getElementById("sumAmount").textContent=money(value);

summary.style.display="block";
}

function checkPayment(){
pay.disabled=!(verified&&plans[plan.value]);
}

pay.onclick=()=>{
const value=plans[plan.value];
const number=smartcard.value.trim();

if(!verified){
showMessage("Please verify your smartcard or IUC number first.","error");
return;
}

if(!value){
showMessage("Select a subscription plan.","error");
return;
}

const balance=getBalance();

if(balance<value){
showMessage(`Insufficient wallet balance. Available: ${money(balance)}.`,"error");
return;
}

setBalance(balance-value);

const now=new Date();
const transactionId="BTV-"+Date.now().toString().slice(-8);

saveTransaction({
id:transactionId,
type:"cable",
service:"Cable TV",
title:"Cable TV Subscription",
provider:selectedProvider,
smartcard:number,
plan:plan.value,
amount:value,
status:"Successful",
direction:"debit",
date:now.toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"}),
createdAt:now.toISOString()
});

showMessage(`Cable TV payment successful. ${money(value)} deducted from your wallet.`,"success");
pay.disabled=true;
};

function showMessage(text,type){
message.textContent=text;
message.className="message "+type;
message.style.display="block";
}
</script>

</body>
</html>
