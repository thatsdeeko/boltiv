<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>BOLTIV</title>
  <style>
    html,body{margin:0;padding:0;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
    #boltiv-router-error{padding:48px 24px;text-align:center}
  </style>
</head>
<body>
<div id="boltiv-router-error">
  <h1>BOLTIV</h1>
  <p>Page not found.</p>
</div>

<script>
(function () {
  "use strict";

  var routes = {
    "/login/":"login.html",
    "/register/":"register.html",
    "/dashboard/":"dashboard.html",
    "/airtime/":"airtime.html",
    "/data/":"data.html",
    "/electricity/":"electricity.html",
    "/cable/":"cable.html",
    "/wallet/":"wallet.html",
    "/transactions/":"transactions.html",
    "/profile/":"profile.html",
    "/notifications/":"notifications.html",
    "/support/":"support.html",
    "/contact/":"contact.html",
    "/privacy/":"privacy.html",
    "/terms/":"terms.html",
    "/forgot-password/":"forgot-password.html",
    "/reset-password/":"reset-password.html",
    "/security/":"security.html",
    "/history/":"history.html"
  };

  function normalisePath(path) {
    path = path || "/";
    path = path.split("?")[0].split("#")[0];
    if (path.length > 1 && path.charAt(path.length - 1) !== "/") path += "/";
    return path;
  }

  function isExternal(value) {
    return /^(?:[a-z]+:|\/\/|data:|blob:|mailto:|tel:|javascript:|#)/i.test(value || "");
  }

  function resolveUrl(value, base) {
    try { return new URL(value, base).href; }
    catch (e) { return value; }
  }

  var path = normalisePath(window.location.pathname);
  var target = routes[path];

  if (!target) return;

  var targetBase = window.location.origin + "/" + target;

  fetch("/" + target, {
    credentials: "same-origin",
    cache: "no-cache"
  })
  .then(function (response) {
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.text();
  })
  .then(function (html) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, "text/html");

    /*
     * IMPORTANT:
     * The clean-URL router must carry over the target page's HEAD.
     * Previously only body/meta were copied, so /login/ and /register/
     * lost style.css, inline <style> blocks and head scripts.
     */

    var newHeadNodes = Array.prototype.slice.call(doc.head.children);
    var headStylesAndMetadata = [];
    var headScripts = [];

    newHeadNodes.forEach(function (node) {
      var clone = node.cloneNode(true);

      if (clone.hasAttribute("href") && !isExternal(clone.getAttribute("href"))) {
        clone.setAttribute(
          "href",
          resolveUrl(clone.getAttribute("href"), targetBase)
        );
      }

      if (clone.hasAttribute("src") && !isExternal(clone.getAttribute("src"))) {
        clone.setAttribute(
          "src",
          resolveUrl(clone.getAttribute("src"), targetBase)
        );
      }

      if (clone.tagName.toLowerCase() === "script") {
        headScripts.push(clone);
      } else {
        headStylesAndMetadata.push(clone);
      }
    });

    document.head.innerHTML = "";
    headStylesAndMetadata.forEach(function (node) {
      document.head.appendChild(node);
    });

    document.title = doc.title || "BOLTIV";

    document.body.innerHTML = doc.body ? doc.body.innerHTML : html;

    window.history.replaceState({ boltivRoute: target }, "", path);

    /*
     * Resolve assets/links against the original flat HTML file.
     */
    document.querySelectorAll("[src]").forEach(function (el) {
      var src = el.getAttribute("src");
      if (src && !isExternal(src)) {
        el.setAttribute("src", resolveUrl(src, targetBase));
      }
    });

    document.querySelectorAll("[href]").forEach(function (el) {
      var href = el.getAttribute("href");
      if (!href || isExternal(href)) return;

      var clean = normalisePath(href);
      if (routes[clean]) {
        el.setAttribute("href", clean);
      } else {
        el.setAttribute("href", resolveUrl(href, targetBase));
      }
    });

    /*
     * Run head scripts after the target body exists.
     */
    headScripts.forEach(function (oldScript) {
      var s = document.createElement("script");

      Array.prototype.slice.call(oldScript.attributes).forEach(function (a) {
        s.setAttribute(a.name, a.value);
      });

      if (oldScript.src) {
        s.src = oldScript.src;
      } else {
        s.textContent = oldScript.textContent;
      }

      document.head.appendChild(s);
    });

    /*
     * Re-execute body scripts because innerHTML does not execute them.
     */
    var scripts = Array.prototype.slice.call(document.body.querySelectorAll("script"));
    scripts.forEach(function (oldScript) {
      var s = document.createElement("script");

      Array.prototype.slice.call(oldScript.attributes).forEach(function (a) {
        s.setAttribute(a.name, a.value);
      });

      if (oldScript.src) {
        s.src = resolveUrl(oldScript.getAttribute("src"), targetBase);
      } else {
        s.textContent = oldScript.textContent;
      }

      oldScript.parentNode.replaceChild(s, oldScript);
    });
  })
  .catch(function () {
    var box = document.getElementById("boltiv-router-error");
    if (box) {
      box.innerHTML =
        "<h1>BOLTIV</h1><p>Unable to load this page. Please try again.</p>";
    }
  });
})();
</script>
</body>
</html>
