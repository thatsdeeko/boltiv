services:
  - type: web
    runtime: static
    name: boltiv-frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /login/
        destination: /login.html
      - type: rewrite
        source: /register/
        destination: /register.html
      - type: rewrite
        source: /dashboard/
        destination: /dashboard.html
      - type: rewrite
        source: /airtime/
        destination: /airtime.html
      - type: rewrite
        source: /data/
        destination: /data.html
      - type: rewrite
        source: /electricity/
        destination: /electricity.html
      - type: rewrite
        source: /cable/
        destination: /cable.html
      - type: rewrite
        source: /wallet/
        destination: /wallet.html
      - type: rewrite
        source: /transactions/
        destination: /transactions.html
      - type: rewrite
        source: /profile/
        destination: /profile.html
      - type: rewrite
        source: /notifications/
        destination: /notifications.html
      - type: rewrite
        source: /support/
        destination: /support.html
      - type: rewrite
        source: /contact/
        destination: /contact.html
      - type: rewrite
        source: /privacy/
        destination: /privacy.html
      - type: rewrite
        source: /terms/
        destination: /terms.html
