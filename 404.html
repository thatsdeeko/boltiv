<!doctype html>
<html lang="en"><head><script src="boltiv-client.js?v=20260820-nostorage"></script><meta charset="utf-8"><meta name="robots" content="noindex"><title>BOLTIV</title></head>
<body><script>
(async()=>{
  const path=location.pathname.replace(/^\/+|\/+$/g,'');
  const routes={
    '':'/',
    'login':'/login/','register':'/register/','wallet':'/wallet/','transactions':'/transactions/',
    'airtime':'/airtime/','data':'/data/','cable':'/cable/','electricity':'/electricity/','profile':'/profile/',
    'history':'/history/','notifications':'/notifications/','receipt':'/receipt/','contact':'/contact/',
    'privacy':'/privacy/','terms':'/terms/','security':'/security/','support':'/support/',
    'forgot-password':'/forgot-password/','reset-password':'/reset-password/','admin':'/admin/'
  };
  const file=routes[path] || null;
  if(!file){document.body.textContent='Page not found'; return;}
  try{
    const r=await fetch('/'+file,{cache:'no-store'});
    if(!r.ok) throw new Error('Page unavailable');
    let html=await r.text();
    html=html.replace(/<head([^>]*)>/i,'<head$1><base href="/">');
    document.open(); document.write(html); document.close();
  }catch(e){document.body.textContent='Unable to load this page. Please try again.';}
})();
</script></body></html>
