<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>BOLTIV</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boltiv-router-error{padding:48px 24px;text-align:center}
</style>
</head>
<body>
<div id="boltiv-router-error"><h1>BOLTIV</h1><p>Loading page…</p></div>
<script>
(function(){
"use strict";
var routes={"/login/":"login.html","/register/":"register.html","/dashboard/":"dashboard.html","/airtime/":"airtime.html","/data/":"data.html","/electricity/":"electricity.html","/cable/":"cable.html","/wallet/":"wallet.html","/transactions/":"transactions.html","/profile/":"profile.html","/notifications/":"notifications.html","/support/":"support.html","/contact/":"contact.html","/privacy/":"privacy.html","/terms/":"terms.html","/forgot-password/":"forgot-password.html","/reset-password/":"reset-password.html","/security/":"security.html","/history/":"history.html","/receipt/":"receipt.html","/recharge-pin/":"recharge-pin.html","/sms/":"sms.html","/betting/":"betting.html","/exam-pin/":"exam-pin.html"};
var path=window.location.pathname;
if(path.length>1 && path.charAt(path.length-1)!=="/") path+="/";
var target=routes[path];
if(target){
  window.location.replace("/"+target);
} else {
  var box=document.getElementById("boltiv-router-error");
  if(box) box.innerHTML="<h1>BOLTIV</h1><p>Page not found.</p>";
}
})();
</script>
</body>
</html>
