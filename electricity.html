<body>
<div class="page"><div class="container">
<header class="data-header"><button class="back-button" onclick="history.back()">‹</button><div><div class="data-title">Electricity</div><div class="data-subtitle">PAY YOUR ELECTRICITY BILL</div></div></header>
<div class="data-hero"><div class="data-hero-label">BOLTIV ELECTRICITY</div><div class="data-hero-title">Stay Powered.</div><div class="data-hero-text">Pay your prepaid or postpaid electricity bill instantly from your BOLTIV wallet.</div></div>
<section class="card">

<button aria-label="IBEDC Ibadan Electric" class="provider" data-provider="IBEDC"><div class="provider-name">IBEDC</div><div class="provider-text">Ibadan Electric</div></button>
<button aria-label="EEDC Enugu Electric" class="provider" data-provider="EEDC"><div class="provider-name">EEDC</div><div class="provider-text">Enugu Electric</div></button>
<button aria-label="JED Jos Electric" class="provider" data-provider="JED"><div class="provider-name">JED</div><div class="provider-text">Jos Electric</div></button>

<button aria-label="BEDC Benin Electric" class="provider" data-provider="BEDC"><div class="provider-name">BEDC</div><div class="provider-text">Benin Electric</div></button>
<button aria-label="YEDC Yola Electric" class="provider" data-provider="YEDC"><div class="provider-name">YEDC</div><div class="provider-text">Yola Electric</div></button>
</div></div>
<div class="field"><label class="label" id="meter-type-label">METER TYPE</label><select aria-label="Meter type" aria-labelledby="meter-type-label" class="select" id="meterType"><option value="Prepaid">Prepaid</option><option value="Postpaid">Postpaid</option></select></div>
<div class="field"><label class="label" id="meter-number-label">METER NUMBER</label><input aria-label="Meter number" aria-labelledby="meter-number-label" class="input" id="meter" inputmode="numeric" placeholder="Enter meter number" type="tel"/></div>

<div class="summary" id="summary"><div class="summary-row"><span>Customer</span><strong id="sumCustomer">-</strong></div><div class="summary-row"><span>Provider</span><strong id="sumProvider">-</strong></div><div class="summary-row"><span>Meter</span><strong id="sumMeter">-</strong></div><div class="summary-row"><span>Type</span><strong id="sumType">-</strong></div><div class="summary-row"><span>Amount</span><strong id="sumAmount">₦0.00</strong></div></div>

</div></div>

<div class="boltiv-modal" id="boltivModal"><div class="boltiv-modal-card"><div class="receipt-brand"><img alt="BOLTIV logo" src="assets/boltiv-logo.webp"/></div><div class="modal-icon" id="modalIcon">!</div><div aria-live="polite" class="modal-status" id="modalStatus" role="status">NOTICE</div><div class="modal-title" id="modalTitle"></div><div aria-live="polite" class="modal-message" id="modalMessage" role="status"></div><div class="modal-details" id="modalDetails" style="display:none"></div><button class="modal-button" id="modalButton">GOT IT</button></div></div>
<script>
const $=id=>document.getElementById(id),providers=document.querySelectorAll(".provider");
let selectedProvider="IKEDC",verified=false;
const plans={};
function money(v){return"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function balance(){return Number(boltivMemoryStorage.getItem("boltivWalletBalance")||0)}
function setBalance(v){boltivMemoryStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(v)||0)))}
function transactions(){try{let x=JSON.parse(boltivMemoryStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function save(t){let x=transactions();x.unshift(t);boltivMemoryStorage.setItem("boltivTransactions",JSON.stringify(x))}
function msg(t,c){$("message").textContent=t;$("message").className="message "+c;$("message").style.display="block"}
const modal=$("boltivModal"),mi=$("modalIcon"),ms=$("modalStatus"),mt=$("modalTitle"),mm=$("modalMessage"),md=$("modalDetails"),mb=$("modalButton");
function showModal(type,title,message,details=""){modal.className="boltiv-modal show "+type;mt.textContent=title;mm.textContent=message;mi.textContent=type==="success"?"✓":type==="failed"?"×":"!";ms.textContent=type==="processing"?"PROCESSING":type==="failed"?"FAILED":type==="success"?"SUCCESSFUL":"NOTICE";md.innerHTML=details;md.style.display=details?"block":"none"}
function closeModal(){modal.classList.remove("show");mb.style.display="block"}
mb.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};
function check(){let v=Number($("amount").value);$("pay").disabled=!(verified&&v>=100);if(verified&&v>=100)$("sumAmount").textContent=money(v)}
providers.forEach(b=>b.onclick=()=>{providers.forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedProvider=b.dataset.provider;verified=false;$("summary").style.display="none";$("pay").disabled=true;$("message").style.display="none"});
$("verify").onclick=async()=>{let n=$("meter").value.trim(),meterType=$("meterType").value;if(n.length<8)return msg("Enter a valid meter number.","error");$("verify").disabled=true;verified=false;$("pay").disabled=true;msg("Verifying meter with your electricity provider...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/electricity/verify",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,meterNumber:n,meterType})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to verify electricity meter.");verified=true;const customerName=d.customerName||d.data?.data?.meter_name||"";$("sumCustomer").textContent=customerName||"-";$("sumProvider").textContent=selectedProvider;$("sumMeter").textContent=n;$("sumType").textContent=meterType;$("summary").style.display="block";check();msg(customerName?`Verified: ${customerName}`:(d.message||"Meter verified successfully."),"success")}catch(e){verified=false;$("summary").style.display="none";msg(e.message||"Electricity meter verification failed.","error")}finally{$("verify").disabled=false}};
$("meter").addEventListener("input",()=>{verified=false;$("pay").disabled=true;$("summary").style.display="none"});$("meterType").addEventListener("change",()=>{verified=false;$("pay").disabled=true;$("summary").style.display="none"});$("amount").addEventListener("input",check);
function payDetails(v,n,d){const t=d&&(d.token||d.delivery?.token||d.providerData?.data?.token||d.providerData?.token);const u=d&&(d.providerData?.data?.units||d.units||"");return`<div class="modal-detail"><span>Service</span><strong>Electricity</strong></div><div class="modal-detail"><span>Provider</span><strong>${selectedProvider}</strong></div><div class="modal-detail"><span>Meter</span><strong>${n}</strong></div><div class="modal-detail"><span>Type</span><strong>${$("meterType").value}</strong></div><div class="modal-detail"><span>Amount</span><strong>${money(v)}</strong></div>`+(t?`<div class="modal-detail"><span>Token</span><strong>${t}</strong></div>`:"")+(u?`<div class="modal-detail"><span>Units</span><strong>${u}</strong></div>`:"")}
$("pay").onclick=async()=>{let v=Number($("amount").value),n=$("meter").value.trim();if(!verified)return msg("Please verify your meter first.","error");if(v<100)return msg("Minimum electricity payment is ₦100.","error");$("pay").disabled=true;const transactionPin=await boltivGetTransactionPin();if(!transactionPin){$("pay").disabled=false;return;}showModal("processing","Processing Payment","Connecting to BOLTIV...");mb.style.display="none";try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/electricity",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,meterNumber:n,meterType:$("meterType").value,amount:v,service:"electricity",providerPayload:{service:"electricity",provider:selectedProvider,meterNumber:n,meterType:$("meterType").value,amount:v},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin:transactionPin})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process electricity payment.");showModal("success","Payment Successful",d.message||"Your electricity payment was successful.",payDetails(v,n,d)+(d.reference?`<div class="modal-detail"><span>Reference</span><strong>${d.reference}</strong></div>`:""));mb.style.display="block";}catch(e){showModal("failed","Payment Failed",e.message||"Electricity payment failed.",payDetails(v,n));mb.style.display="block";}finally{$("pay").disabled=false}};
</script>
