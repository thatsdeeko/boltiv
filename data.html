ze:14.3px;font-weight:1000;margin-bottom:5px}.plan-validity{color:#777;font-size:10px;margin-bottom:8px}.plan-price{color:#171717;font-size:11px;font-weight:1000}.plan-loading{grid-column:1/-1;padding:18px;border-radius:15px;border:1px dashed #d9d9d4;color:#777;text-align:center;font-size:10px;line-height:1.5;background:#fafaf8}.purchase-button{width:100%;padding:16px;border:1px solid #e5e5e1;border-radius:14px;background:#ffffff;color:#D4AF37;font-family:inherit;font-size:11px;font-weight:1000;letter-spacing:.8px}.boltiv-modal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,20,20,.45);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.25s}.boltiv-modal.show{opacity:1;visibility:visible}.receipt-brand{display:flex;justify-content:center;margin:-4px auto 10px}.receipt-brand img{width:68px;height:72px;object-fit:contain}.boltiv-modal-card{width:100%;max-width:390px;box-sizing:border-box;padding:28px 22px;border-radius:25px;text-align:center;background:linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;box-shadow:0 30px 90px rgba(0,0,0,.75);transform:translateY(25px) scale(.94);transition:.3s}.boltiv-modal.show .boltiv-modal-card{transform:translateY(0) scale(1)}.modal-icon{width:66px;height:66px;margin:0 auto 17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30.8px;font-weight:1000}.boltiv-modal.warning .modal-icon,.boltiv-modal.processing .modal-icon{background:#fffdf4;border:1px solid #D4AF37;color:#D4AF37}.boltiv-modal.success .modal-icon{background:#101c12;border:1px solid #56b866;color:#70d47b}.boltiv-modal.failed .modal-icon{background:#fff0f0;border:1px solid #b94c4c;color:#e07878}.modal-spinner{width:24px;height:24px;border-radius:50%;border:3px solid #332b16;border-top-color:#D4AF37;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.modal-status{color:#D4AF37;font-size:10px;font-weight:1000;letter-spacing:1px;margin-bottom:8px}.modal-title{color:#171717;font-size:20.9px;font-weight:1000}.modal-message{color:#777;font-size:11px;line-height:1.6;margin-top:8px}.modal-details{margin-top:20px;padding:5px 14px;border-radius:15px;background:#fafaf8;border:1px solid #e5e5e1}.modal-detail{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e9e9e5;text-align:left}.modal-detail:last-child{border-bottom:0}.modal-detail span{color:#666;font-size:10px}.modal-detail strong{color:#171717;font-size:11px;font-weight:900;text-align:right;word-break:break-word}.modal-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#f5d76e,#D4AF37,#D4AF37);color:#f7f7f5;font-family:inherit;font-size:11px;font-weight:1000}
</style><link href="assets/boltiv-icon.webp" rel="icon" type="image/png"/>

<div class="page data-page"><div class="container">
<div class="data-header"><button class="back-button" onclick="history.back()">‹</button><div><div class="data-title">Buy Data</div><div class="data-subtitle">INSTANT DATA RECHARGE</div></div></div>
<div class="data-hero"><div class="data-hero-label">BOLTIV DATA</div><div class="data-hero-title">Stay Connected.</div><div class="data-hero-text">Choose a data plan and recharge instantly from your BOLTIV wallet.</div></div>
<div class="data-card">
<label class="data-label" for="phoneNumber">PHONE NUMBER</label><input aria-label="Phone number" aria-labelledby="select-data-plan-label" class="data-input" id="phoneNumber" inputmode="numeric" maxlength="11" placeholder="08012345678" type="tel"/>
<label class="data-label" id="select-network-label">SELECT NETWORK</label><div aria-labelledby="select-network-label" class="network-grid" role="group"><button aria-label="MTN" class="network-button" data-network="MTN" type="button">MTN</button><button aria-label="AIRTEL" class="network-button" data-network="AIRTEL" type="button">AIRTEL</button><button aria-label="GLO" class="network-button" data-network="GLO" type="button">GLO</button><button aria-label="9MOBILE" class="network-button" data-network="9MOBILE" type="button">9MOBILE</button></div>
<label class="data-label" id="select-data-plan-label">SELECT DATA PLAN</label><div class="plan-grid" id="planGrid"><div class="plan-loading" id="planLoading">Select a network to load available plans.</div></div><div class="data-subtitle" id="planHint" style="margin:-10px 0 18px"></div><button class="purchase-button" id="purchaseButton" type="button">BUY DATA</button>
</div></div></div>
<nav class="bottom-nav"><button class="nav-item" data-page="/dashboard"><span class="nav-icon">⌂</span><span>Home</span></button><button class="nav-item" data-page="/wallet"><span class="nav-icon">₦</span><span>Wallet</span></button><button class="nav-item" data-page="/transactions"><span class="nav-icon">↯</span><span>Activity</span></button><button class="nav-item" data-page="/profile"><span class="nav-icon">◉</span><span>Profile</span></button></nav>
<div class="boltiv-modal" id="boltivModal"><div class="boltiv-modal-card"><div class="receipt-brand"><img alt="BOLTIV logo" src="assets/boltiv-logo.webp"/></div><div class="modal-icon" id="modalIcon">!</div><div aria-live="polite" class="modal-status" id="modalStatus" role="status">NOTICE</div><div class="modal-title" id="modalTitle">Complete Your Purchase</div><div aria-live="polite" class="modal-message" id="modalMessage" role="status">Please complete the required information.</div><div class="modal-details" id="modalDetails" style="display:none"></div><button class="modal-button" id="modalButton" type="button">GOT IT</button></div></div>
<script>
// Dynamic VTUGATE data catalog + purchase logic.
// VTUGATE credentials never reach this page; all provider calls stay behind the BOLTIV backend.
const API="https://boltiv-backend.onrender.com";
let selectedNetwork="",selectedPlan=null;
const $=id=>document.getElementById(id),phone=$("phoneNumber"),modal=$("boltivModal"),icon=$("modalIcon"),status=$("modalStatus"),title=$("modalTitle"),msg=$("modalMessage"),details=$("modalDetails"),modalBtn=$("modalButton"),planGrid=$("planGrid"),planLoading=$("planLoading"),planHint=$("planHint");
const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
function show(type,t,m,b="GOT IT",d=""){modal.className="boltiv-modal show "+type;title.textContent=t;msg.textContent=m;modalBtn.textContent=b;status.textContent=type==="success"?"SUCCESSFUL":type==="failed"?"FAILED":type==="processing"?"PROCESSING":"NOTICE";icon.innerHTML=type==="success"?"✓":type==="failed"?"×":type==="processing"?'<div class="modal-spinner"></div>':"!";details.innerHTML=d;details.style.display=d?"block":"none"}
function close(){modal.classList.remove("show");modalBtn.style.display="block"}
modalBtn.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
function esc(v){return String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function formatValidity(value, days){
  const raw=String(value??"").trim();
  if(raw && !/^undefined|null|n\/a$/i.test(raw)){
    // VTUGATE/catalog adapters may return numeric validity (for example 30) instead of
    // the text form (30days). Treat a bare positive number as days.
    if(/^\d+(?:\.\d+)?$/.test(raw)){
      const n=Number(raw);
      if(n>0)return n+" "+(n===1?"Day":"Days");
    }
    const normalized=raw.replace(/(\d+(?:\.\d+)?)\s*(day|days)\b/ig,(m,n)=>n+" "+(Number(n)===1?"Day":"Days"));
    return normalized.replace(/(\d+(?:\.\d+)?)\s*(hour|hours)\b/ig,(m,n)=>n+" "+(Number(n)===1?"Hour":"Hours"));
  }
  const d=Number(days);
  return d>0 ? d+" "+(d===1?"Day":"Days") : "Validity not available";
}
function planLabel(plan){
  // Keep the exact plan name returned by BOLTIV/our live catalog.
  // This is also what the backend persists on the transaction receipt.
  return String(plan?.name||plan?.code||"").trim();
}
function isOneDayPlan(plan){
  const values=[plan?.validity_days,plan?.validity,plan?.validity_period,plan?.duration];
  return values.some(v=>{
    const raw=String(v??"").trim().toLowerCase();
    if(!raw)return false;
    if(/^1(?:\.0+)?$/.test(raw))return true;
    return /^(?:1\s*(?:day|days)|24\s*(?:hour|hours))$/.test(raw);
  });
}
function renderPlans(plans){
  selectedPlan=null;
  planGrid.innerHTML="";
  const filtered=Array.isArray(plans)?plans.filter(plan=>!isOneDayPlan(plan)):[];
  if(!filtered.length){planGrid.innerHTML='<div class="plan-loading">No data plans longer than 1 day are currently available for this network.</div>';return;}
  filtered.forEach(plan=>{
    const b=document.createElement("button");
    b.type="button";b.className="plan-button";
    const label=planLabel(plan), validity=formatValidity(plan.validity??plan.validity_period??plan.duration,plan.validity_days);
    b.innerHTML='<div class="plan-size">'+esc(label)+'</div><div class="plan-validity">'+esc(validity)+'</div><div class="plan-price">'+money(plan.customer_price)+'</div>';
    b.onclick=()=>{document.querySelectorAll(".plan-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedPlan=plan;};
    planGrid.appendChild(b);
  });
}
async function loadPlans(network){
  selectedPlan=null;
  planGrid.innerHTML='<div class="plan-loading">Loading '+esc(network)+' data plans…</div>';
  planHint.textContent="";
  try{
    const r=await fetch(API+"/api/vtu/data/plans",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({network})});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.message||"Unable to load data plans.");
    renderPlans(d.plans);
    planHint.textContent=d.plans?.length?d.plans.length+" live plans available":"";
  }catch(e){
    planGrid.innerHTML='<div class="plan-loading">'+esc(e.message||"Unable to load VTUGATE data plans.")+'</div>';
  }
}
function info(p,id="",bal=""){let h='<div class="modal-detail"><span>Service</span><strong>Data</strong></div><div class="modal-detail"><span>Network</span><strong>'+esc(selectedNetwork)+'</strong></div><div class="modal-detail"><span>Phone</span><strong>'+esc(p)+'</strong></div><div class="modal-detail"><span>Data Plan</span><strong>'+esc(planLabel(selectedPlan))+'</strong></div><div class="modal-detail"><span>Amount</span><strong>'+money(selectedPlan.customer_price)+'</strong></div>';if(id)h+='<div class="modal-detail"><span>Reference</span><strong>'+esc(id)+'</strong></div>';if(bal!=="")h+='<div class="modal-detail"><span>Wallet Balance</span><strong>'+money(bal)+'</strong></div>';return h}
document.querySelectorAll(".network-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".network-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedNetwork=b.dataset.network;loadPlans(selectedNetwork)});
$("purchaseButton").onclick=async()=>{
  const p=phone.value.trim();
  if(!p)return show("warning","Phone Number Required","Enter the 11-digit phone number you want to recharge.");
  if(p.length!==11||!/^[0-9]{11}$/.test(p))return show("warning","Check Your Number","Please enter a valid 11-digit Nigerian phone number.");
  if(!selectedNetwork)return show("warning","Select Your Network","Choose your network.");
  if(!selectedPlan)return show("warning","Select a Data Plan","Choose a data plan.");
  const transactionPin=await boltivGetTransactionPin();
  if(!transactionPin){modalBtn.style.display="block";return;}
  show("processing","Processing Data","Your request is being sent securely.","PLEASE WAIT",info(p));modalBtn.style.display="none";
  try{
    const r=await fetch(API+"/api/vtu/data",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({phone:p,network:selectedNetwork,plan_code:selectedPlan.code||selectedPlan.plan_code||selectedPlan.bundle_id,plan_id:selectedPlan.plan_id||selectedPlan.bundle_id||selectedPlan.code,bundle_id:selectedPlan.bundle_id||selectedPlan.plan_id||selectedPlan.code,service_id:selectedPlan.service_id,plan_name:planLabel(selectedPlan),amount:Number(selectedPlan.customer_price),service:"data",providerPayload:{service:"data",phone:p,network:selectedNetwork,plan_code:selectedPlan.code||selectedPlan.plan_code||selectedPlan.bundle_id,plan_id:selectedPlan.plan_id||selectedPlan.bundle_id||selectedPlan.code,bundle_id:selectedPlan.bundle_id||selectedPlan.plan_id||selectedPlan.code,service_id:selectedPlan.service_id,plan_name:planLabel(selectedPlan),amount:Number(selectedPlan.customer_price)},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin})});
    const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process data purchase.");
    show(d.status==="pending"?"processing":"success",d.status==="pending"?"Processing":"Data Purchased",d.message||"Your data request has been received.","DONE",info(p,d.reference,d.balance));
  }catch(e){show("failed","Data Purchase Failed",e.message||"Unable to process your data purchase.","DONE",info(p));}
  finally{modalBtn.style.display="block"}
};
document.querySelectorAll(".nav-item").forEach(i=>i.onclick=()=>location.href=i.dataset.page);
</script></body></html>
