<!DOCTYPE html>
<html lang="en">
<head>
<script src="/boltiv-theme.js?v=20261004-dark"></script>
<link href="/boltiv-theme.css?v=20261004-dark" rel="stylesheet"/>
<script src="/boltiv-api-config.js?v=1"></script>
<base href="/">
<meta charset="utf-8"/>
<title>BOLTIV Link — Your business website in minutes | BOLTIV</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#C9A227"/>
<meta name="description" content="Get a professional website for your business at yourname.boltiv.ng. No coding. ₦5,000 for 30 days, paid from your BOLTIV wallet."/>
<meta name="robots" content="noindex"/>
<link href="assets/boltiv-icon.webp" rel="icon" type="image/webp"/>
<link href="style.css?v=20261004-dark" rel="stylesheet"/>
<style>
:root{--g:#C9A227;--gd:#8d6907;--ln:#eadfb9;--sf:#fffdf7;--tx:#171717;--mu:#68645b;--cd:#fff}
html[data-theme=dark]{--ln:#2e2a1d;--sf:#0f0e0a;--tx:#f3efe2;--mu:#a9a28c;--cd:#181610}
*{box-sizing:border-box}body{margin:0;background:var(--sf);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.w{width:min(1100px,94%);margin:auto}header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;position:sticky;top:0;background:var(--sf);z-index:5;border-bottom:1px solid var(--ln)}
.top b{font-size:18px;letter-spacing:.04em}.chip{font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:#e8f7ec;color:#17803d}.chip.w2{background:#fff3d6;color:#8d6907}.chip.x{background:#fde8e8;color:#b42318}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:14px 0}h1{font-size:clamp(28px,7vw,46px);line-height:1.1;margin:8px 0}h2{font-size:18px;margin:0 0 10px}p{color:var(--mu);margin:6px 0}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx);font:inherit}textarea{min-height:88px;resize:vertical}input[type=color]{padding:3px;min-height:46px}input[type=range]{padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:99px;background:var(--g);color:#111;font:inherit;font-weight:800;cursor:pointer}.btn.o{background:transparent;border:2px solid var(--g);color:var(--tx)}.btn.s{min-height:38px;padding:0 14px;font-size:13px}.btn:disabled{opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ok{color:#17803d;font-weight:700}.no{color:#b42318;font-weight:700}.sm{font-size:13px}.stat b{display:block;font-size:26px}.it{border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.ly{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ly button{min-height:44px;border:2px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx);font:inherit;font-weight:700}.ly button.on{border-color:var(--g)}
.ed{display:block}.pv{display:none}.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}.bar a{flex:1;text-align:center;font-size:12px;font-weight:700;padding:8px 2px;border-radius:12px;color:var(--mu);cursor:pointer}.bar a.on{color:var(--tx);background:rgba(201,162,39,.2)}
.frame{border:10px solid #111;border-radius:34px;overflow:hidden;background:#fff;height:min(74vh,720px);width:100%;max-width:390px;margin:auto}.frame iframe{width:100%;height:100%;border:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:var(--cd);width:min(520px,100%);border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:12px 18px;border-radius:99px;z-index:30;font-size:14px}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--ln);background:#eee}.spark{display:flex;align-items:flex-end;gap:2px;height:70px}.spark i{flex:1;background:var(--g);border-radius:3px 3px 0 0;min-height:2px}
@media(min-width:900px){.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}.pv{display:block;position:sticky;top:76px}body.t-preview .ed{display:block}.bar{position:static;border:0;background:none;padding:0;gap:6px;margin:10px 0}.bar a{flex:0 0 auto;padding:10px 16px}body{padding-bottom:30px}.mobonly{display:none}}
@media(max-width:899px){body.t-preview .ed{display:none}body.t-preview .pv{display:block}}
</style>
</head>
<body>
<header class="top w"><b>BOLTIV <span style="color:var(--g)">Link</span></b><span id="chip"></span></header>
<div class="w" id="app"><div class="card">Loading…</div></div>
<nav class="bar" id="bar" hidden></nav>
<div id="layer"></div>
<script>
(function(){'use strict';
const API=window.BOLTIV_API_BASE,ms=window.boltivMemoryStorage||window.localStorage,$=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₦'+Number(v||0).toLocaleString('en-NG');
const FONTS=['Inter','Poppins','Playfair Display','Montserrat','Lora','DM Sans','Space Grotesk','Nunito'];
const LAYOUTS=[['classic','Classic'],['bold','Bold'],['minimal','Minimal'],['shop','Shop']];
let S={me:null,tab:'design',pricing:{price:5000,days:100,domain:'boltiv.ng'},auth:true,stats:null},saveT,prevT,dirty=false,seq=0;
async function api(path,o){o=o||{};const h={Accept:'application/json'};const tok=ms.getItem&&ms.getItem('boltivAuthToken');if(tok)h.Authorization='Bearer '+tok;let body;
 if(o.body!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.body)}
 let r;try{r=await fetch(API+path,{method:o.method||(body?'POST':'GET'),headers:h,body,cache:'no-store',credentials:'include'})}catch(e){throw new Error('No connection. Check your internet and try again.')}
 const d=await r.json().catch(()=>({success:false,message:'Unexpected response.'}));
 if(r.status===401){const e=new Error('auth');e.auth=true;throw e}
 if(!r.ok||d.success===false){const e=new Error(d.message||'Request failed.');e.data=d;throw e}return d}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function sheet(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet">'+h+'</div>';m.addEventListener('click',e=>{if(e.target===m)m.remove()});$('#layer').innerHTML='';$('#layer').appendChild(m);return m}
const closeSheet=()=>{$('#layer').innerHTML=''};
const D=()=>S.me.draft;
async function load(){
 try{S.me=await api('/api/link/me');S.pricing=S.me.pricing}catch(e){if(e.auth){S.auth=false;try{S.pricing=await api('/api/link/pricing')}catch(_){}}else{$('#app').innerHTML='<div class="card">'+esc(e.message)+'</div>';return}}
 render()}
function render(){
 const m=S.me,site=m&&m.site;$('#bar').hidden=!site;
 if(!site){$('#chip').innerHTML='';return renderPitch()}
 const st=site.state,cls=st==='active'?(site.daysLeft<=7?'w2':''):'x';
 $('#chip').innerHTML='<span class="chip '+cls+'">'+(st==='active'?site.daysLeft+' days left':st==='expired'?'Offline · renew':'Suspended')+'</span>';
 const tabs=[['design','Design'],['content','Content'],['preview','Preview'],['stats','Stats'],['plan','Plan']];
 $('#bar').innerHTML=tabs.map(t=>'<a data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</a>').join('');
 document.body.className='t-'+S.tab;
 const panel={design:pDesign,content:pContent,preview:()=>'',stats:pStats,plan:pPlan}[S.tab]();
 const wide=S.tab==='design'||S.tab==='content'||S.tab==='preview';
 $('#app').innerHTML=(st==='expired'?'<div class="card" style="border-color:#b42318"><b>Your website is offline.</b><p>All your data is safe. Renew to bring it back online instantly.</p><button class="btn" data-a="renew">Renew for '+money(S.pricing.price)+'</button></div>':'')+
  (wide?'<div class="split"><div class="ed">'+(S.tab==='preview'?'<div class="card mobonly"><b>Live preview</b><p>This is exactly how visitors see your site.</p></div>':'')+panel+'</div><div class="pv"><div class="frame"><iframe id="pf" title="Preview" sandbox></iframe></div></div></div>':panel);
 if(wide)refreshPreview(true);if(S.tab==='stats')loadStats();
}
/* ---------- pitch + registration ---------- */
function renderPitch(){
 $('#app').innerHTML='<div class="card" style="text-align:center"><h1>Your business website,<br>live in minutes</h1><p>No coding. No developer. Just <b>yourname.'+esc(S.pricing.domain)+'</b> — beautiful on every phone.</p>'+
 '<div style="max-width:440px;margin:18px auto;text-align:left"><label>Pick your website name</label><div class="row" style="flex-wrap:nowrap"><input id="un" placeholder="deekostore" autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="30" style="flex:1"><span class="sm" style="flex:0 0 auto">.'+esc(S.pricing.domain)+'</span></div><div id="uc" class="sm" style="min-height:22px;margin-top:6px"></div>'+
 '<button class="btn" id="go" style="width:100%;margin-top:8px" disabled>Create my website · '+money(S.pricing.price)+'</button><p class="sm" style="text-align:center">'+S.pricing.days+' days of access. Your name is reserved for you permanently. Paid from your BOLTIV wallet.</p></div></div>'+
 '<p style="text-align:center"><a href="/boltiv-link" style="color:var(--gd);font-weight:700">Learn how BOLTIV Link works</a></p><div class="g4"><div class="card"><b>Customise everything</b><p>Colours, fonts, layouts, logo, backgrounds.</p></div><div class="card"><b>Sell with WhatsApp</b><p>Product catalogue with one-tap ordering.</p></div><div class="card"><b>See your visitors</b><p>Views, visitors and clicks, every day.</p></div><div class="card"><b>Fast and light</b><p>Loads quickly even on weak networks.</p></div></div>';
 const un=$('#un'),uc=$('#uc'),go=$('#go');let t,last='';
 un.addEventListener('input',()=>{un.value=un.value.toLowerCase().replace(/[^a-z0-9-]/g,'');go.disabled=true;clearTimeout(t);const v=un.value;if(v.length<3){uc.textContent=v?'Use at least 3 characters.':'';uc.className='sm';return}uc.textContent='Checking…';uc.className='sm';
  t=setTimeout(async()=>{try{const r=await api('/api/link/check?u='+encodeURIComponent(v));if(un.value!==v)return;last=v;uc.className='sm '+(r.available?'ok':'no');uc.textContent=r.available?'✓ '+v+'.'+S.pricing.domain+' is available':r.reason;go.disabled=!r.available}catch(e){uc.textContent=e.message}},350)});
 go.addEventListener('click',()=>{if(!S.auth){ms.setItem&&ms.setItem('boltivLinkPending',un.value);location.href='/login';return}payWizard('new',un.value)});
 const qn=new URLSearchParams(location.search).get('name');if(qn&&!(ms.getItem&&ms.getItem('boltivLinkPending')))ms.setItem&&ms.setItem('boltivLinkPending',qn.toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,30));const pend=ms.getItem&&ms.getItem('boltivLinkPending');if(pend){un.value=pend;if(S.auth)ms.removeItem&&ms.removeItem('boltivLinkPending');un.dispatchEvent(new Event('input'))}
}
function payWizard(kind,username){
 const idem=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
 const m=sheet('<h2>'+(kind==='new'?'Create '+esc(username)+'.'+esc(S.pricing.domain):'Renew your website')+'</h2><p>You will pay <b>'+money(S.pricing.price)+'</b> for <b>'+S.pricing.days+' days</b> from your wallet (balance '+money(S.me?S.me.walletBalance:0)+').</p>'+
  (kind==='new'?'<label>Business name</label><input id="bn" maxlength="60" placeholder="Deeko Store">':'')+'<label>Transaction PIN</label><input id="pn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><div id="pe" class="no sm" style="min-height:20px"></div><div class="row"><button class="btn o" id="c">Cancel</button><button class="btn" id="p">Pay '+money(S.pricing.price)+'</button></div>');
 m.querySelector('#c').onclick=closeSheet;
 m.querySelector('#p').onclick=async e=>{const b=e.target,pe=m.querySelector('#pe');b.disabled=true;b.textContent='Processing…';pe.textContent='';
  try{await api('/api/link/'+(kind==='new'?'register':'renew'),{body:{username,businessName:kind==='new'?m.querySelector('#bn').value:undefined,transactionPin:m.querySelector('#pn').value,idempotencyKey:idem,expectedAmount:S.pricing.price}});closeSheet();toast(kind==='new'?'Website created!':'Website renewed!');S.tab='design';await load()}
  catch(er){if(er.auth){location.href='/login';return}pe.innerHTML=esc(er.message)+(er.data&&er.data.code==='insufficient_balance'?' <a href="/wallet" style="color:var(--gd)">Fund wallet</a>':'');b.disabled=false;b.textContent='Pay '+money(S.pricing.price)}}}
/* ---------- editor ---------- */
const set=(path,v)=>{const p=path.split('.');let o=D();for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;changed()};
function changed(){dirty=true;$('#chip').dataset.s='saving';clearTimeout(saveT);saveT=setTimeout(save,900);refreshPreview()}
async function save(){try{const r=await api('/api/link/site',{method:'PATCH',body:{config:D()}});dirty=false;S.me.site.hasUnpublished=true;const b=$('#pub');if(b)b.disabled=false}catch(e){if(!e.auth)toast(e.message)}}
function refreshPreview(now){clearTimeout(prevT);prevT=setTimeout(async()=>{const f=$('#pf');if(!f)return;const my=++seq;try{const r=await api('/api/link/preview',{body:{config:D()}});if(my===seq&&$('#pf'))$('#pf').srcdoc=r.html}catch(e){}},now?0:350)}
const inp=(label,path,o)=>{o=o||{};const v=path.split('.').reduce((a,k)=>a&&a[k],D());return '<label>'+label+'</label>'+(o.area?'<textarea data-p="'+path+'" maxlength="'+(o.max||300)+'">'+esc(v)+'</textarea>':'<input data-p="'+path+'" type="'+(o.type||'text')+'" value="'+esc(v)+'" maxlength="'+(o.max||120)+'" placeholder="'+esc(o.ph||'')+'"'+(o.inputmode?' inputmode="'+o.inputmode+'"':'')+'>')};
const imgField=(label,path)=>{const id=path.split('.').reduce((a,k)=>a&&a[k],D());return '<label>'+label+'</label><div class="row" style="flex-wrap:nowrap">'+(id?'<img class="thumb" src="'+esc(S.me.imgBase+id)+'" alt="" style="flex:0 0 64px">':'')+'<button class="btn o s" data-up="'+path+'" style="flex:0 0 auto">'+(id?'Change':'Upload')+'</button>'+(id?'<button class="btn o s" data-clear="'+path+'" style="flex:0 0 auto">Remove</button>':'')+'</div>'};
function pDesign(){const t=D().theme;
 return '<div class="card"><h2>Layout</h2><div class="ly">'+LAYOUTS.map(l=>'<button data-lay="'+l[0]+'" class="'+(t.layout===l[0]?'on':'')+'">'+l[1]+'</button>').join('')+'</div></div>'+
 '<div class="card"><h2>Colours & font</h2><div class="g2"><div><label>Main colour</label><input type="color" data-p="theme.primary" value="'+t.primary+'"></div><div><label>Accent</label><input type="color" data-p="theme.accent" value="'+t.accent+'"></div><div><label>Background</label><input type="color" data-p="theme.bg" value="'+t.bg+'"></div><div><label>Text</label><input type="color" data-p="theme.text" value="'+t.text+'"></div></div>'+
 '<label>Font</label><select data-p="theme.font">'+FONTS.map(f=>'<option'+(t.font===f?' selected':'')+'>'+f+'</option>').join('')+'</select><label>Corner roundness</label><input type="range" min="0" max="32" data-p="theme.radius" data-n="1" value="'+t.radius+'"></div>'+
 '<div class="card"><h2>Branding & background</h2>'+imgField('Logo','brand.logo')+imgField('Cover photo','brand.hero')+'<label>Page background</label><select data-p="theme.bgType"><option value="color"'+(t.bgType==='color'?' selected':'')+'>Solid colour</option><option value="gradient"'+(t.bgType==='gradient'?' selected':'')+'>Gradient</option><option value="image"'+(t.bgType==='image'?' selected':'')+'>Image</option></select>'+
 (t.bgType==='gradient'?'<label>Gradient end colour</label><input type="color" data-p="theme.bgGradientTo" value="'+t.bgGradientTo+'">':'')+(t.bgType==='image'?imgField('Background image','theme.bgImage')+'<label>Darken image</label><input type="range" min="0" max="80" data-p="theme.overlay" data-n="1" value="'+t.overlay+'">':'')+'</div>'+pubCard()}
function pubCard(){const s=S.me.site;return '<div class="card"><h2>Publish</h2><p>'+(s.publishedAt?'Live at <a href="'+esc(s.url)+'" target="_blank" rel="noopener" style="color:var(--gd);font-weight:700">'+esc(s.url.replace('https://',''))+'</a>':'Not published yet.')+'</p><button class="btn" id="pub" data-a="publish" '+(s.state!=='active'?'disabled':'')+'>'+(s.publishedAt?'Publish changes':'Publish my website')+'</button><button class="btn o" data-a="share" style="margin-left:8px">Share link</button></div>'}
function listEd(key,label,hasStock){const a=D()[key];return '<div class="card"><h2>'+label+' ('+a.length+')</h2>'+a.map((p,i)=>'<div class="it"><div class="row" style="flex-wrap:nowrap">'+(p.image?'<img class="thumb" src="'+esc(S.me.imgBase+p.image)+'" alt="" style="flex:0 0 64px">':'')+'<div style="min-width:0"><b>'+esc(p.name)+'</b><div class="sm">'+(p.price?money(p.price):'No price')+(hasStock&&p.available===false?' · Out of stock':'')+'</div></div><button class="btn o s" data-edit="'+key+':'+i+'" style="flex:0 0 auto">Edit</button></div></div>').join('')+'<button class="btn s" data-edit="'+key+':new">+ Add '+(hasStock?'product':'service')+'</button></div>'}
function pContent(){return '<div class="card"><h2>Business info</h2>'+inp('Business name','brand.name',{max:60})+inp('Tagline','brand.tagline',{max:120,ph:'What you do, in one line'})+inp('About your business','brand.about',{area:1,max:1200})+'</div>'+listEd('products','Products',1)+listEd('services','Services',0)+
 '<div class="card"><h2>Gallery</h2><div class="row">'+D().gallery.map((id,i)=>'<div style="flex:0 0 76px;text-align:center"><img class="thumb" src="'+esc(S.me.imgBase+id)+'" alt=""><a class="sm" data-gdel="'+i+'" style="color:#b42318;cursor:pointer">Remove</a></div>').join('')+'</div><button class="btn s" data-up="gallery+" style="margin-top:8px">+ Add photo</button></div>'+
 '<div class="card"><h2>Contact</h2>'+inp('WhatsApp number','contact.whatsapp',{type:'tel',inputmode:'tel',ph:'0803 123 4567'})+inp('Phone (for calls)','contact.phone',{type:'tel',inputmode:'tel'})+inp('Email','contact.email',{type:'email'})+inp('Address','contact.address',{max:200})+inp('Opening hours','contact.hours',{ph:'Mon–Sat, 9am–6pm'})+inp('Instagram username','contact.instagram',{ph:'deekostore'})+inp('Facebook username','contact.facebook')+inp('TikTok username','contact.tiktok')+inp('X username','contact.x')+'</div>'+
 '<div class="card"><h2>Search listing (optional)</h2>'+inp('Page title','seo.title',{max:70})+inp('Description','seo.description',{area:1,max:160})+'</div>'+pubCard()}
function itemSheet(key,idx){const isP=key==='products',it=idx==='new'?{name:'',price:0,desc:'',image:'',available:true}:Object.assign({},D()[key][idx]);
 const m=sheet('<h2>'+(idx==='new'?'Add':'Edit')+' '+(isP?'product':'service')+'</h2><label>Name</label><input id="in" maxlength="80" value="'+esc(it.name)+'"><label>Price (₦, optional)</label><input id="ip" inputmode="decimal" value="'+(it.price||'')+'"><label>Description</label><textarea id="id" maxlength="240">'+esc(it.desc)+'</textarea><div class="row" style="flex-wrap:nowrap;margin-top:8px">'+(it.image?'<img class="thumb" id="iim" src="'+esc(S.me.imgBase+it.image)+'" alt="" style="flex:0 0 64px">':'')+'<button class="btn o s" id="iu" style="flex:0 0 auto">'+(it.image?'Change photo':'Add photo')+'</button></div>'+(isP?'<label><input type="checkbox" id="ia" style="width:auto;min-height:0" '+(it.available!==false?'checked':'')+'> In stock</label>':'')+'<div id="ie" class="no sm"></div><div class="row" style="margin-top:12px">'+(idx!=='new'?'<button class="btn o" id="ir">Remove</button>':'')+'<button class="btn" id="is">Save</button></div>');
 m.querySelector('#iu').onclick=async()=>{try{it.image=await pickImage(900);toast('Photo added');m.querySelector('#iu').textContent='Change photo'}catch(e){if(e.message)toast(e.message)}};
 m.querySelector('#is').onclick=()=>{const n=m.querySelector('#in').value.trim();if(!n){m.querySelector('#ie').textContent='Enter a name.';return}it.name=n;it.price=Number(String(m.querySelector('#ip').value).replace(/[^\d.]/g,''))||0;it.desc=m.querySelector('#id').value;if(isP)it.available=m.querySelector('#ia').checked;
  const a=D()[key];if(idx==='new')a.push(it);else a[idx]=it;closeSheet();changed();render()};
 const r=m.querySelector('#ir');if(r)r.onclick=()=>{D()[key].splice(idx,1);closeSheet();changed();render()}}
/* image upload: resize + compress in the browser so pages stay light */
function pickImage(max,small){return new Promise((res,rej)=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const file=f.files[0];if(!file)return rej(new Error(''));const im=new Image(),u=URL.createObjectURL(file);
 im.onload=async()=>{try{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  let q=.82,d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);while(d.length>700000&&q>.4){q-=.12;d=c.toDataURL(d.startsWith('data:image/webp')?'image/webp':'image/jpeg',q)}
  const r=await api('/api/link/image',{body:{dataUrl:d}});res(r.id)}catch(e){rej(e)}};im.onerror=()=>rej(new Error('Could not read that image.'));im.src=u};f.click()})}
/* ---------- stats / plan ---------- */
async function loadStats(){const el=$('#app');try{const r=await api('/api/link/analytics?days=30');S.stats=r}catch(e){}paintStats()}
function pStats(){return '<div class="card">Loading…</div>'}
function paintStats(){if(S.tab!=='stats')return;const r=S.stats;if(!r)return;const mx=Math.max(1,...r.daily.map(d=>d.views));
 $('#app').innerHTML='<div class="card"><h2>Last 30 days</h2><div class="g4"><div class="stat"><b>'+r.views+'</b><span class="sm">Page views</span></div><div class="stat"><b>'+r.visitors+'</b><span class="sm">Visitors</span></div><div class="stat"><b>'+r.whatsappClicks+'</b><span class="sm">WhatsApp taps</span></div><div class="stat"><b>'+r.orderClicks+'</b><span class="sm">Order taps</span></div><div class="stat"><b>'+r.callClicks+'</b><span class="sm">Calls</span></div></div></div>'+
 '<div class="card"><h2>Daily views</h2><div class="spark">'+(r.daily.length?r.daily.map(d=>'<i title="'+esc(String(d.day).slice(0,10))+': '+d.views+'" style="height:'+Math.max(3,d.views/mx*100)+'%"></i>').join(''):'<span class="sm">No visits yet. Share your link to get started.</span>')+'</div></div>'+
 '<div class="card"><h2>Where visitors come from</h2>'+(r.referrers.length?r.referrers.map(x=>'<div class="row sm"><span>'+esc(x.host)+'</span><b style="text-align:right">'+x.n+'</b></div>').join(''):'<p class="sm">Direct visits (WhatsApp, links you share) are not listed.</p>')+'</div>'}
function pPlan(){const s=S.me.site,d=new Date(s.expiresAt).toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'});
 return '<div class="card"><h2>Your website</h2><p><b>'+esc(s.url.replace('https://',''))+'</b></p><p>Status: <b>'+(s.state==='active'?'Active':s.state==='expired'?'Offline (renew to restore)':'Suspended')+'</b></p><p>'+(s.state==='expired'?'Expired on ':'Active until ')+'<b>'+d+'</b></p><p class="sm">Your website name is permanently reserved for you. Websites and names cannot be deleted, and your content is kept safe even if your plan expires.</p>'+
 '<button class="btn" data-a="renew" '+(s.state==='suspended'?'disabled':'')+'>Add '+S.pricing.days+' days · '+money(S.pricing.price)+'</button><p class="sm">Renewing adds days on top of the time you have left. Nothing is lost.</p></div>'+
 '<div class="card"><p class="sm">Wallet balance: <b>'+money(S.me.walletBalance)+'</b> · <a href="/wallet" style="color:var(--gd)">Fund wallet</a></p></div>'}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;render();scrollTo(0,0);return}
 const l=e.target.closest('[data-lay]');if(l){D().theme.layout=l.dataset.lay;changed();render();return}
 const ed=e.target.closest('[data-edit]');if(ed){const p=ed.dataset.edit.split(':');itemSheet(p[0],p[1]==='new'?'new':Number(p[1]));return}
 const gd=e.target.closest('[data-gdel]');if(gd){D().gallery.splice(Number(gd.dataset.gdel),1);changed();render();return}
 const cl=e.target.closest('[data-clear]');if(cl){set(cl.dataset.clear,'');render();return}
 const up=e.target.closest('[data-up]');if(up){const p=up.dataset.up;up.disabled=true;try{const id=await pickImage(p.startsWith('brand.logo')?400:1400);if(p==='gallery+'){D().gallery.push(id);changed()}else set(p,id);render()}catch(er){if(er.message)toast(er.message);up.disabled=false}return}
 const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
 if(act==='renew')payWizard('renew');
 if(act==='publish'){a.disabled=true;a.textContent='Publishing…';clearTimeout(saveT);try{if(dirty)await save();const r=await api('/api/link/publish',{method:'POST',body:{}});toast(r.message);await load()}catch(er){toast(er.message);a.disabled=false}}
 if(act==='share'){const u=S.me.site.url;try{if(navigator.share)await navigator.share({title:D().brand.name,url:u});else{await navigator.clipboard.writeText(u);toast('Link copied')}}catch(_){}}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-p]');if(!el)return;const v=el.dataset.n?Number(el.value):el.value;set(el.dataset.p,v)});
document.addEventListener('change',e=>{const el=e.target.closest('select[data-p]');if(el&&/bgType/.test(el.dataset.p))render()});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
load()})();
</script>
