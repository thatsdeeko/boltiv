<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">

<title>BOLTIV — Forgot Password</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#ffffff;
    color:#171717;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:#c49a25;
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
}

.tagline{
    margin-top:6px;
    text-align:center;
    color:#777;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
}

.card{
    margin-top:28px;
    padding:30px;
    background:#ffffff;
    border:1px solid #e7e7e7;
    border-radius:20px;
    box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.card h1{
    color:#171717;
    font-size:26px;
    font-weight:900;
}

.subtitle{
    margin-top:8px;
    margin-bottom:26px;
    color:#666;
    font-size:14px;
    line-height:1.6;
}

.label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-size:12px;
    font-weight:800;
}

.input{
    width:100%;
    height:52px;
    padding:0 15px;
    border:1px solid #d9d9d9;
    border-radius:11px;
    outline:none;
    background:#fafafa;
    color:#171717;
    font-size:15px;
}

.input:focus{
    border-color:#c49a25;
    background:#fff;
    box-shadow:0 0 0 3px rgba(196,154,37,.10);
}

.button{
    width:100%;
    height:52px;
    margin-top:20px;
    border:0;
    border-radius:11px;
    background:#d4af37;
    color:#171717;
    font-size:14px;
    font-weight:900;
}

.button:hover{
    background:#c49a25;
}

.button:disabled{
    cursor:not-allowed;
    opacity:.6;
}

.status{
    display:none;
    margin-bottom:18px;
    padding:13px;
    border-radius:11px;
    font-size:13px;
    line-height:1.5;
}

.status.show{
    display:block;
}

.status.error{
    color:#a12626;
    background:#fff2f2;
    border:1px solid #f0caca;
}

.status.success{
    color:#806414;
    background:#fffaf0;
    border:1px solid #eadba8;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#555;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
}

.back:hover{
    color:#c49a25;
}

.footer{
    margin-top:22px;
    text-align:center;
    color:#999;
    font-size:11px;
}

@media(max-width:480px){

    .page{
        padding:18px;
    }

    .card{
        padding:23px;
    }

    .logo{
        font-size:29px;
    }

    .card h1{
        font-size:23px;
    }

}

</style>
</head>

<body>

<div class="page">

<div class="container">

<div class="logo">
BOLTIV
</div>

<div class="tagline">
FAST. SIMPLE. POWERFUL.
</div>


<div class="card">

<h1>
Forgot Password?
</h1>

<p class="subtitle">
Enter the email address connected to your BOLTIV account and we'll send you a password reset link.
</p>


<div
id="status"
class="status">
</div>


<label
class="label"
for="email">

EMAIL ADDRESS

</label>


<input
id="email"
class="input"
type="email"
autocomplete="email"
placeholder="you@example.com">


<button
id="button"
class="button"
type="button">

SEND RESET LINK

</button>


<a
href="login.html"
class="back">

← Back to Login

</a>

</div>


<div class="footer">
© BOLTIV
</div>

</div>

</div>


<script>

const API_BASE =
"https://boltiv-backend.onrender.com";


const emailInput =
document.getElementById("email");

const button =
document.getElementById("button");

const statusBox =
document.getElementById("status");


function showStatus(
message,
type="error"
){

statusBox.textContent =
message;

statusBox.className =
"status show " + type;

}


function clearStatus(){

statusBox.textContent = "";

statusBox.className =
"status";

}


async function requestReset(){

clearStatus();

const email =
emailInput.value
.trim()
.toLowerCase();


if(!email){

showStatus(
"Enter your email address."
);

emailInput.focus();

return;

}


if(!/^\S+@\S+\.\S+$/.test(email)){

showStatus(
"Enter a valid email address."
);

emailInput.focus();

return;

}


button.disabled = true;

button.textContent =
"SENDING...";


try{

const response =
await fetch(
API_BASE +
"/api/auth/forgot-password",
{
method:"POST",

headers:{
"Content-Type":
"application/json",
"Accept":
"application/json"
},

body:JSON.stringify({
email:email
})
}
);


let data;

try{

data =
await response.json();

}catch{

throw new Error(
"Invalid server response."
);

}


if(
!response.ok ||
!data.success
){

throw new Error(
data.message ||
"Unable to process your request."
);

}


/*
The backend intentionally returns
a generic message so account existence
is not revealed.
*/

showStatus(
data.message ||
"If an account exists for that email, a password reset link has been sent.",
"success"
);

emailInput.value = "";


}catch(error){

console.error(
"BOLTIV PASSWORD RESET REQUEST ERROR:",
error
);

showStatus(
error.message ||
"Unable to connect to BOLTIV."
);

}finally{

button.disabled = false;

button.textContent =
"SEND RESET LINK";

}

}


button.onclick =
requestReset;


emailInput.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){
requestReset();
}

});

</script>

</body>
</html>
