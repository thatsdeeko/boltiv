</head><body><div class="page svc-page"><div class="container"><div class="svc-header"><button class="back" onclick="history.back()">‹</button><div><div class="svc-title">Smile Data</div><div class="svc-subtitle">SMILE DATA</div></div></div><div class="hero"><div class="hero-label">BOLTIV SMILE DATA</div><div class="hero-title">Stay connected with Smile.</div><div class="hero-text">Choose a Smile plan and continue.</div></div><div class="card"><label>PHONE NUMBER</label><input id="recipient" inputmode="numeric" maxlength="11" placeholder="08012345678"><label>PLAN ID</label><input id="plan" type="number" min="1" placeholder="SME plan ID"><label>AMOUNT</label><input id="amount" type="number" min="1" placeholder="Plan amount"><div class="notice">This service uses the BOLTIV wallet. Your transaction is processed by the backend service layer.</div><button class="buy" id="buy">CONTINUE</button><div class="result" id="result"></div></div></div></div><nav class="bottom-nav"><button class="nav-item" data-page="/dashboard"><span class="nav-icon">⌂</span><span>Home</span></button><button class="nav-item" data-page="/wallet"><span class="nav-icon">₦</span><span>Wallet</span></button><button class="nav-item" data-page="/transactions"><span class="nav-icon">↯</span><span>Activity</span></button><button class="nav-item" data-page="/profile"><span class="nav-icon">◉</span><span>Profile</span></button></nav><script>const API="https://boltiv-backend.onrender.com";const $=id=>document.getElementById(id);const result=$("result");$("buy").onclick=async()=>{const amount=Number($("amount").value||0);if(!Number.isFinite(amount)||amount<=0){result.className="result show fail";result.textContent="Enter a valid amount.";return}const transactionPin=await boltivGetTransactionPin();if(!transactionPin)return;result.className="result show";result.textContent="Processing…";try{const token=boltivMemoryStorage.getItem("boltivAuthToken")||"";const payload={service:"smile_data",amount,recipient:($("recipient")?.value||""),providerPayload:{service:"smile_data",phone:$("recipient").value,plan_id:Number($("plan").value||0)},idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now()),transactionPin};const r=await fetch(API+"/api/vtu/purchase",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Transaction failed.");result.className="result show success";result.innerHTML="<strong>Transaction submitted.</strong><br>Reference: "+(d.reference||"—")+"<br>Status: "+(d.status||"processing");}catch(e){result.className="result show fail";result.textContent=e.message||"Unable to complete the transaction.";}};</script></body></html>
