<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><meta name="description" content="BOLTIV Agent"><title>Agent Earnings — BOLTIV Agent</title><script src="/boltiv-api-config.js?v=1"></script><script src="/boltiv-client.js?v=20260820-nostorage"></script><script src="/transaction-pin.js?v=20260820-pinfix"></script><link rel="icon" href="/assets/boltiv-icon.webp"><link rel="stylesheet" href="/agent.css?v=1"></head><body><main class="agent-shell"><div class="agent-container"><header class="agent-top"><div><div class="eyebrow">BOLTIV Agent</div><h1 class="title">Your Earnings</h1><p class="sub">Track the profit generated from your BOLTIV sales.</p></div><span class="agent-badge">LIVE</span></header><div class="metrics"><div class="metric profit"><div class="label">Today</div><strong id="today">₦0.00</strong></div><div class="metric profit"><div class="label">This Week</div><strong id="week">₦0.00</strong></div><div class="metric profit"><div class="label">This Month</div><strong id="month">₦0.00</strong></div></div><section class="card"><div class="section-head" style="margin-top:0"><h2>Sales & profit overview</h2><span class="eyebrow">7 days</span></div><div class="chart" id="chart"></div></section><div class="section-head"><h2>Total Profit</h2></div><section class="hero" style="margin-top:0"><div class="label">All-time earnings</div><div class="hero-balance profit" id="total">₦0.00</div><div class="sub" id="sales">From ₦0.00 in Agent sales</div></section><div id="agentMessage" class="agent-message"></div></div></main><nav class="agent-nav"><a data-page="home" class="" href="/agent-home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"></path><path d="M9.5 20.5v-6h5v6"></path></svg></span>Home</a><a data-page="sell" class="sell-nav " href="/agent-sell"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Sell</a><a data-page="wallet" class="" href="/agent-wallet"><span class="nav-icon nav-icon-text" aria-hidden="true">₦</span>Wallet</a><a data-page="activity" class="active" href="/agent-activity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg></span>Activity</a><a data-page="profile" class="" href="/agent-profile"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path></svg></span>Profile</a></nav><script src="/agent-app.js?v=1"></script><script>(async()=>{await requireAgent();const d=await agentFetch('/api/agent/dashboard');const t=await agentFetch('/api/agent/transactions?limit=200');const rows=t.transactions||[];const now=new Date();const todayStart=new Date(now);todayStart.setHours(0,0,0,0);const weekStart=new Date(todayStart);weekStart.setDate(weekStart.getDate()-6);const monthStart=new Date(now.getFullYear(),now.getMonth(),1);const successful=rows.filter(x=>String(x.status).toLowerCase()==='successful');const sumProfit=from=>successful.filter(x=>new Date(x.date)>=from).reduce((sum,x)=>sum+Number(x.profit||0),0);const weekProfit=sumProfit(weekStart);const monthProfit=sumProfit(monthStart);document.getElementById('today').textContent=money(d.today.profit);document.getElementById('week').textContent=money(weekProfit);document.getElementById('month').textContent=money(monthProfit);document.getElementById('total').textContent=money(d.total.profit);document.getElementById('sales').textContent='From '+money(d.total.sales)+' in Agent sales';const days=Array.from({length:7},(_,i)=>{const day=new Date(weekStart);day.setDate(weekStart.getDate()+i);return day});const daily=days.map(day=>{const next=new Date(day);next.setDate(day.getDate()+1);return{day,profit:successful.filter(x=>{const dt=new Date(x.date);return dt>=day&&dt<next}).reduce((sum,x)=>sum+Number(x.profit||0),0)}});const max=Math.max(...daily.map(x=>x.profit),1);document.getElementById('chart').innerHTML=daily.map(x=>`<div class="bar-col" title="${money(x.profit)} profit"><div class="bar" style="height:${Math.max(3,Math.round(x.profit/max*100))}%"></div><div class="bar-label">${x.day.toLocaleDateString('en-NG',{weekday:'short'}).slice(0,3)}</div></div>`).join('');})().catch(e=>showAgentMessage(e.message));</script></body></html>
