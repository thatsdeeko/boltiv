<!DOCTYPE html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><script src="boltiv-client.js?v=20260820-nostorage"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Recharge PIN</title><link rel="stylesheet" href="style.css?v=20260817-services"><script src="transaction-pin.js?v=20260815-pinfix"></script><script>boltivRequireAuth();</script><style>
.svc-page{min-height:100vh;padding-bottom:110px}.svc-header{display:flex;align-items:center;gap:13px;padding:18px 0 24px}.back{width:40px;height:40px;border-radius:12px;border:1px solid #e5e5e1;background:#fff;color:#b8860b;font-size:22px}.svc-title{color:#b8860b;font-size:21px;font-weight:1000}.svc-subtitle{color:#666;font-size:10px;margin-top:4px}.hero{padding:23px;border-radius:23px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 38%),linear-gradient(145deg,#fffdf4,#fff);border:1px solid #e5e5e1;margin-bottom:20px}.hero-label{color:#b8860b;font-size:10px;font-weight:1000;letter-spacing:1px}.hero-title{color:#171717;font-size:23px;font-weight:1000;margin-top:7px}.hero-text{color:#777;font-size:11px;line-height:1.6;margin-top:6px}.card{padding:20px;border-radius:21px;background:#fff;border:1px solid #e5e5e1}label{display:block;color:#777;font-size:10px;font-weight:900;letter-spacing:.6px;margin:0 0 8px}input,select,textarea{width:100%;box-sizing:border-box;padding:14px 15px;border-radius:13px;border:1px solid #e5e5e1;background:#fff;color:#171717;outline:none;font-family:inherit;font-size:13px;font-weight:700;margin-bottom:17px}textarea{min-height:125px;resize:vertical;line-height:1.5}input:focus,select:focus,textarea:focus{border-color:#b8860b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.estimate{padding:15px;border-radius:14px;background:#fffdf4;border:1px solid #ead99b;margin:-2px 0 18px;color:#777;font-size:10px;line-height:1.6}.estimate strong{display:block;color:#b8860b;font-size:20px;margin-top:3px}.buy{width:100%;padding:16px;border:0;border-radius:14px;background:#b8860b;color:#fff;font-size:11px;font-weight:1000;letter-spacing:.8px}.result{display:none;margin-top:16px;padding:16px;border-radius:15px;border:1px solid #ead99b;background:#fffdf4;color:#555;font-size:10px;line-height:1.7;word-break:break-word}.result.show{display:block}.result.success{border-color:#8ecf9a;background:#f3fff4}.result.fail{border-color:#e6b4b4;background:#fff5f5}.result h3{margin:0 0 8px;color:#171717;font-size:15px}.pin-list{margin-top:10px;padding:12px;border-radius:12px;background:#fff;border:1px solid #e5e5e1}.pin-row{padding:8px 0;border-bottom:1px solid #eee}.pin-row:last-child{border-bottom:0}.muted{color:#777}@media(min-width:900px){.svc-page .container{width:min(100% - 64px,560px)}}
</style><link rel="icon" type="image/png" href="assets/boltiv-icon.png"></head><body><div class="page svc-page"><div class="container"><div class="svc-header"><button class="back" onclick="history.back()">‹</button><div><div class="svc-title">Recharge PIN</div><div class="svc-subtitle">MTN • GLO • AIRTEL • 9MOBILE</div></div></div><div class="hero"><div class="hero-label">BOLTIV RECHARGE PIN</div><div class="hero-title">Generate airtime PINs.</div><div class="hero-text">Buy digital recharge PINs through Bigisub for MTN, Glo, Airtel or 9mobile. Select a denomination and quantity.</div></div><div class="card"><div class="grid2"><div><label>NETWORK</label><select id="network"><option value="mtn">MTN</option><option value="glo">Glo</option><option value="airtel">Airtel</option><option value="9mobile">9mobile</option></select></div><div><label>DENOMINATION</label><select id="value"><option value="100">₦100</option><option value="200">₦200</option><option value="500">₦500</option><option value="1000">₦1,000</option></select></div></div><label>QUANTITY</label><input id="quantity" type="number" min="1" max="100" value="1"><div class="estimate">Estimated total before provider discount/markup.<strong id="total">₦100.00</strong></div><button class="buy" id="buy">BUY RECHARGE PINS</button><div class="result" id="result"></div></div></div></div><nav class="bottom-nav"><button class="nav-item" data-page="/"><span class="nav-icon">⌂</span><span>Home</span></button><button class="nav-item" data-page="/wallet/"><span class="nav-icon">₦</span><span>Wallet</span></button><button class="nav-item" data-page="/transactions/"><span class="nav-icon">↯</span><span>Activity</span></button><button class="nav-item" data-page="/profile/"><span class="nav-icon">◉</span><span>Profile</span></button></nav><script>const API="https://boltiv-backend.onrender.com";const $=id=>document.getElementById(id),money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2}),total=()=>Number($("value").value)*Math.max(1,Number($("quantity").value||1));const update=()=>$("total").textContent=money(total());$("value").onchange=update;$("quantity").oninput=update;const result=$("result");$("buy").onclick=async()=>{const network=$("network").value,value=Number($("value").value),quantity=Math.max(1,Number($("quantity").value||1)),amount=value*quantity;if(quantity>100){result.className="result show fail";result.textContent="Maximum quantity is 100 PINs per purchase.";return}const transactionPin=await boltivGetTransactionPin();if(!transactionPin)return;result.className="result show";result.textContent="Generating your recharge PINs…";try{const r=await fetch(API+"/api/vtu/purchase",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({service:"recharge_pin",providerPayload:{service:"recharge_pin",network,service_id:network,value,quantity,amount},amount,recipient:network,idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now()),transactionPin})});const d=await r.json();if(!r.ok||!d.success){result.className="result show fail";result.textContent=d.message||"Recharge PIN purchase failed. If your wallet was debited, check Activity for the refund status.";return}const data=d.data||{};const nested=data.data||{};const pins=data?.epins||data?.data?.epins||data?.data?.data?.epins||nested?.epins||[];let html='<h3>Recharge PIN purchase successful</h3>Reference: '+(d.reference||'—')+'<br>Network: '+network.toUpperCase()+'<br>Quantity: '+quantity+'<br>Status: '+(d.status||'successful');if(Array.isArray(pins)&&pins.length){html+='<div class="pin-list">'+pins.map((x,i)=>'<div class="pin-row"><strong>PIN '+(i+1)+':</strong> '+(x.pin||x.PIN||x.code||'—')+(x.serial||x.serial_number?'<br><span class="muted">Serial: '+(x.serial||x.serial_number)+'</span>':'')+'</div>').join('')+'</div>'}result.className="result show success";result.innerHTML=html;}catch(e){result.className="result show fail";result.textContent="Unable to reach BOLTIV right now. Please try again."}};update();</script></body></html>
