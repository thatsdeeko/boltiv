<!doctype html>
<html lang="en">
<head><base href="/">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOLTIV</title>
<script>
(function () {
  const path = location.pathname.replace(/^\/+|\/+$/g, '');
  const routes = {
    '': 'index.html',
    'index': 'index.html',
    'login': 'login.html',
    'register': 'register.html',
    'forgot-password': 'forgot-password.html',
    'reset-password': 'reset-password.html',
    'dashboard': 'dashboard.html',
    'wallet': 'wallet.html',
    'transactions': 'transactions.html',
    'history': 'history.html',
    'receipt': 'receipt.html',
    'profile': 'profile.html',
    'notifications': 'notifications.html',
    'security': 'security.html',
    'support': 'support.html',
    'airtime': 'airtime.html',
    'data': 'data.html',
    'cable': 'cable.html',
    'electricity': 'electricity.html',
    'exam-pin': 'exam-pin.html',
    'contact': 'contact.html',
    'privacy': 'privacy.html',
    'terms': 'terms.html',
    'admin': 'admin.html'
  };
  const target = routes[path];
  if (target) {
    fetch('/' + target, {cache:'no-store'})
      .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
      .then(html => {
        if (!/<base\s+href=["']\/["']\s*\/?>(?:\s*)/i.test(html)) {
          html = html.replace(/<head([^>]*)>/i, '<head$1><base href="/">');
        }
        document.open();
        document.write(html);
        document.close();
        history.replaceState(null, '', '/' + path + (path ? '/' : ''));
      })
      .catch(() => show404());
  } else {
    show404();
  }
  function show404() {
    document.body.innerHTML = '<main style="font-family:system-ui;text-align:center;padding:15vh 20px"><h1>404</h1><p>Page not found.</p><a href="/">Return to BOLTIV</a></main>';
  }
})();
</script>
  <link rel="stylesheet" href="boltiv-theme.css?v=20260824-theme2">
  <script src="boltiv-theme.js?v=20260824-theme2"></script>
</head>
<body><p>Loading…</p></body>
</html>
