<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><meta name="description" content="Sell airtime, data and digital services to your customers with BOLTIV Agent."><title>Sell a Service — BOLTIV Agent</title><script src="/boltiv-api-config.js?v=1"></script><script src="/boltiv-client.js?v=20260820-nostorage"></script><script src="/transaction-pin.js?v=20260820-pinfix"></script><link rel="icon" href="/assets/boltiv-icon.webp"><link rel="stylesheet" href="/agent.css?v=1"></head><body><main class="agent-shell"><div class="agent-container"><header class="agent-top"><div><div class="eyebrow">BOLTIV Agent</div><h1 class="title">Sell a Service</h1><p class="sub">Choose a service, set your customer price and keep the difference as profit.</p></div><span class="agent-badge">ACTIVE</span></header><div class="service-switch" id="serviceTabs"><button class="service-tab active" data-service="airtime">Airtime</button><button class="service-tab" data-service="data">Data</button><button class="service-tab" data-service="cable">Cable TV</button><button class="service-tab" data-service="electricity">Electricity</button><button class="service-tab" data-service="exam_pin">Exam PINs</button></div><section class="form-card" id="form"></section><div id="agentMessage" class="agent-message"></div></div></main><nav class="agent-nav"><a data-page="home" class="" href="/agent-home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"></path><path d="M9.5 20.5v-6h5v6"></path></svg></span>Home</a><a data-page="sell" class="sell-nav active" href="/agent-sell"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Sell</a><a data-page="wallet" class="" href="/agent-wallet"><span class="nav-icon nav-icon-text" aria-hidden="true">₦</span>Wallet</a><a data-page="activity" class="" href="/agent-activity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg></span>Activity</a><a data-page="profile" class="" href="/agent-profile"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path></svg></span>Profile</a></nav><script src="/agent-app.js?v=1"></script><script>
let current='airtime', agentReady=false, dataPlans=[], selectedPlan=null, cableVerified=false, electricityVerified=false, examProducts=[];
const form=document.getElementById('form');
const query=new URLSearchParams(location.search);if(query.get('service'))current=query.get('service');
function tabs(){document.querySelectorAll('.service-tab').forEach(b=>{b.classList.toggle('active',b.dataset.service===current);b.onclick=()=>{current=b.dataset.service;renderForm();}})}
function customerBox(agentPrice=0,placeholder='Customer pays'){return `<div class="price-box"><div class="price-line"><span>YOUR BOLTIV PRICE</span><strong id="agentPrice">${money(agentPrice)}</strong></div><div class="field" style="margin-top:4px"><label>CUSTOMER PAYS</label><input class="input" id="customerPrice" inputmode="decimal" placeholder="${placeholder}" type="number" min="0" step="0.01"></div><div class="price-line profit"><span>AGENT PROFIT</span><strong id="profit">₦0.00</strong></div></div>`}
function wirePrice(){const cp=document.getElementById('customerPrice'),profit=document.getElementById('profit'),ap=Number(document.getElementById('agentPrice')?.textContent.replace(/[^0-9.]/g,'')||0);if(!cp)return;const update=()=>{const n=Number(cp.value||0);profit.textContent=money(Math.max(0,n-ap));};cp.oninput=update;update();}
async function renderForm(){tabs();cableVerified=false;electricityVerified=false;selectedPlan=null; if(current==='airtime'){form.innerHTML=`<div class="eyebrow">Airtime</div><h2 style="font-size:18px;margin:7px 0">Recharge a customer</h2><div class="field"><label>PHONE NUMBER</label><input class="input" id="phone" inputmode="numeric" maxlength="11" placeholder="08012345678"></div><div class="field"><label>NETWORK</label><select class="select" id="network"><option>MTN</option><option>AIRTEL</option><option>GLO</option><option>9MOBILE</option></select></div><div class="field"><label>YOUR BOLTIV PRICE</label><input class="input" id="agentCost" type="number" min="50" placeholder="Amount to sell" value="100"></div>${customerBox(100)}<button class="primary" id="sellBtn">CONFIRM SALE</button>`;wirePrice();document.getElementById('sellBtn').onclick=sellAirtime;return}
if(current==='data'){form.innerHTML=`<div class="eyebrow">Data</div><h2 style="font-size:18px;margin:7px 0">Sell a data plan</h2><div class="field"><label>PHONE NUMBER</label><input class="input" id="phone" inputmode="numeric" maxlength="11" placeholder="08012345678"></div><div class="field"><label>NETWORK</label><select class="select" id="network"><option>MTN</option><option>AIRTEL</option><option>GLO</option><option>9MOBILE</option></select></div><div class="field"><label>DATA PLAN</label><select class="select" id="plan"><option>Loading plans…</option></select></div><div id="pricing"></div><button class="primary" id="sellBtn" disabled>CONFIRM SALE</button>`;document.getElementById('network').onchange=loadDataPlans;await loadDataPlans();return}
if(current==='cable'){form.innerHTML=`<div class="eyebrow">Cable TV</div><h2 style="font-size:18px;margin:7px 0">Renew a customer's subscription</h2><div class="field"><label>PROVIDER</label><select class="select" id="provider"><option value="DSTV">DStv</option><option value="GOTV">GOtv</option></select></div><div class="field"><label>SMARTCARD / IUC</label><input class="input" id="number" inputmode="numeric" maxlength="20" placeholder="Enter number"></div><button class="primary" style="margin-top:10px" id="verify">VERIFY CUSTOMER</button><div class="field"><label>PLAN</label><select class="select" id="plan"><option value="Compact">DStv Compact — ₦19,000</option><option value="Confam">DStv Confam — ₦11,000</option><option value="Yanga">DStv Yanga — ₦6,000</option><option value="Jolli">GOtv Jolli — ₦5,800</option><option value="Max">GOtv Max — ₦8,500</option></select></div><div id="pricing"></div><button class="primary" id="sellBtn" disabled>CONFIRM SALE</button>`;document.getElementById('provider').onchange=()=>{document.getElementById('verify').click()};document.getElementById('plan').onchange=updateCable;document.getElementById('verify').onclick=verifyCable;return}
if(current==='electricity'){form.innerHTML=`<div class="eyebrow">Electricity</div><h2 style="font-size:18px;margin:7px 0">Pay a customer's meter</h2><div class="field"><label>PROVIDER</label><select class="select" id="provider"><option>IKEDC</option><option>EKEDC</option><option>AEDC</option><option>KEDCO</option><option>PHED</option><option>IBEDC</option><option>EEDC</option><option>JED</option><option>KAEDCO</option><option>BEDC</option><option>YEDC</option></select></div><div class="field"><label>METER TYPE</label><select class="select" id="meterType"><option>Prepaid</option><option>Postpaid</option></select></div><div class="field"><label>METER NUMBER</label><input class="input" id="meter" inputmode="numeric" placeholder="Enter meter number"></div><button class="primary" id="verify">VERIFY METER</button><div class="field"><label>AMOUNT</label><input class="input" id="amount" type="number" min="100" placeholder="1000"></div><div id="pricing"></div><button class="primary" id="sellBtn" disabled>CONFIRM SALE</button>`;document.getElementById('verify').onclick=verifyElectricity;document.getElementById('amount').oninput=updateElectricity;return}
if(current==='exam_pin'){form.innerHTML=`<div class="eyebrow">Education</div><h2 style="font-size:18px;margin:7px 0">Sell an Exam PIN</h2><div class="field"><label>EXAM / PRODUCT</label><select class="select" id="plan"><option>Loading products…</option></select></div><div class="field"><label>QUANTITY</label><select class="select" id="quantity"><option value="1">1 PIN</option><option value="2">2 PINS</option><option value="5">5 PINS</option></select></div><div id="pricing"></div><button class="primary" id="sellBtn" disabled>CONFIRM SALE</button>`;await loadExamProducts();return}}
async function loadDataPlans(){const network=document.getElementById('network').value;const plan=document.getElementById('plan');plan.innerHTML='<option>Loading plans…</option>';try{const d=await agentFetch('/api/vtu/data/plans',{method:'POST',body:JSON.stringify({network})});dataPlans=d.plans||[];plan.innerHTML=dataPlans.length?dataPlans.map((p,i)=>`<option value="${i}">${esc(p.name||p.plan_name||p.code)} — ${money(p.agent_price??p.customer_price)}</option>`).join(''):'<option>No plans available</option>';plan.onchange=updateDataPricing;updateDataPricing();}catch(e){plan.innerHTML='<option>Unable to load plans</option>';showAgentMessage(e.message)}}
function updateDataPricing(){const p=dataPlans[Number(document.getElementById('plan')?.value||0)];if(!p)return;document.getElementById('pricing').innerHTML=customerBox(Number(p.agent_price??p.customer_price),'Customer pays');wirePrice();document.getElementById('sellBtn').disabled=false}
async function loadExamProducts(){try{const d=await agentFetch('/api/vtu/exam-pin/products');examProducts=d.products||[];const sel=document.getElementById('plan');sel.innerHTML=examProducts.length?examProducts.map((p,i)=>`<option value="${i}">${esc(p.name)} — ${money(p.agent_price??p.customer_price)}</option>`).join(''):'<option>No products available</option>';sel.onchange=updateExamPricing;document.getElementById('quantity').onchange=updateExamPricing;updateExamPricing();}catch(e){showAgentMessage(e.message)}}
function updateExamPricing(){const p=examProducts[Number(document.getElementById('plan')?.value||0)],q=Number(document.getElementById('quantity')?.value||1);if(!p)return;const cost=Number(p.agent_price??p.customer_price)*q;document.getElementById('pricing').innerHTML=customerBox(cost,'Customer pays');wirePrice();document.getElementById('sellBtn').disabled=false}
function updateCable(){const provider=document.getElementById('provider').value,plan=document.getElementById('plan').value;const prices={DSTV:{Compact:19000,Confam:11000,Yanga:6000},GOTV:{Jolli:5800,Max:8500}};const cost=prices[provider]?.[plan];if(cost)document.getElementById('pricing').innerHTML=customerBox(cost,'Customer pays');wirePrice()}
async function verifyCable(){try{const d=await agentFetch('/api/vtu/cable/verify',{method:'POST',body:JSON.stringify({provider:document.getElementById('provider').value,smartcard:document.getElementById('number').value})});cableVerified=true;document.getElementById('sellBtn').disabled=false;updateCable();showAgentMessage(d.customer?.customer_name?'Verified: '+d.customer.customer_name:'Customer verified.','success');}catch(e){cableVerified=false;document.getElementById('sellBtn').disabled=true;showAgentMessage(e.message)}}
async function verifyElectricity(){try{const d=await agentFetch('/api/vtu/electricity/verify',{method:'POST',body:JSON.stringify({provider:document.getElementById('provider').value,meterNumber:document.getElementById('meter').value,meterType:document.getElementById('meterType').value})});electricityVerified=true;document.getElementById('sellBtn').disabled=false;document.getElementById('pricing').dataset.markup=d.agentMarkupPct||0;document.getElementById('pricing').dataset.fixed=d.agentFixedFee||0;updateElectricity();showAgentMessage(d.customerName?'Verified: '+d.customerName:'Meter verified.','success');}catch(e){electricityVerified=false;document.getElementById('sellBtn').disabled=true;showAgentMessage(e.message)}}
function updateElectricity(){const amount=Number(document.getElementById('amount')?.value||0),pct=Number(document.getElementById('pricing')?.dataset.markup||0),fixed=Number(document.getElementById('pricing')?.dataset.fixed||0);const ap=amount+amount*pct/100+fixed;document.getElementById('pricing').innerHTML=customerBox(ap,'Customer pays');document.getElementById('pricing').dataset.markup=pct;document.getElementById('pricing').dataset.fixed=fixed;wirePrice()}
async function submit(service,payload){const pin=await getPin();if(!pin)return;payload.service=service;payload.transactionPin=pin;payload.idempotencyKey=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));payload.providerPayload={...payload};delete payload.providerPayload.transactionPin;try{const d=await agentFetch('/api/vtu/'+(service==='exam_pin'?'exam-pin':service),{method:'POST',body:JSON.stringify(payload)});showReceipt(service,payload,d);}catch(e){showAgentMessage(e.message)}}
function receiptRow(label,value){if(value===undefined||value===null||value==='')return'';return `<div class="receipt-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;}
function showReceipt(service,payload,d){const status=d.status||'success';const pending=status==='pending'||status==='processing';const icon=document.getElementById('receiptIcon'),st=document.getElementById('receiptStatus');icon.className='receipt-icon'+(pending?' pending':'');icon.textContent=pending?'!':'✓';st.className='receipt-status'+(pending?' pending':'');st.textContent=pending?'PROCESSING':'SUCCESSFUL';document.getElementById('receiptAmount').textContent=money(payload.customerSellingPrice??payload.amount);const rows=[];if(service==='airtime'){rows.push(receiptRow('Network',payload.network));rows.push(receiptRow('Phone Number',payload.phone));}else if(service==='data'){rows.push(receiptRow('Network',payload.network));rows.push(receiptRow('Plan',payload.plan_name));rows.push(receiptRow('Phone Number',payload.phone));}else if(service==='cable'){rows.push(receiptRow('Provider',payload.provider));rows.push(receiptRow('Package',payload.plan));rows.push(receiptRow('Smartcard Number',payload.smartcard));}else if(service==='electricity'){rows.push(receiptRow('Disco',payload.provider));rows.push(receiptRow('Meter Type',payload.meterType));rows.push(receiptRow('Meter Number',payload.meterNumber));if(d.token)rows.push(receiptRow('Token',d.token));if(d.units)rows.push(receiptRow('Units',d.units));}else if(service==='exam_pin'){rows.push(receiptRow('Exam Type',payload.examLabel||payload.product_code));rows.push(receiptRow('Quantity',payload.quantity));if(Array.isArray(d.pins))d.pins.forEach((pin,i)=>{const v=typeof pin==='string'?pin:(pin.pin||pin.serial||pin.serial_number||pin.value||JSON.stringify(pin));rows.push(`<div class="receipt-row pin"><span>${esc(d.pins.length>1?'PIN '+(i+1):'PIN')}</span><strong>${esc(v)}</strong></div>`);});}rows.push(receiptRow('Your Profit',money(Math.max(0,(payload.customerSellingPrice||0)-(payload.amount||0)))));rows.push(receiptRow('Reference',d.reference));document.getElementById('receiptRows').innerHTML=rows.join('');document.getElementById('receiptOverlay').classList.add('show');}
function closeReceipt(){document.getElementById('receiptOverlay').classList.remove('show');location.href='/agent-activity';}
async function sellAirtime(){const phone=document.getElementById('phone').value.trim(),network=document.getElementById('network').value,amount=Number(document.getElementById('agentCost').value),cp=Number(document.getElementById('customerPrice').value);if(!/^0\d{10}$/.test(phone))return showAgentMessage('Enter a valid 11-digit phone number.');if(amount<50)return showAgentMessage('Minimum airtime sale is ₦50.');if(cp<amount)return showAgentMessage('Customer price cannot be lower than your BOLTIV price.');await submit('airtime',{phone,network,amount,airtime_amount:amount,customerSellingPrice:cp,networkConfirmed:false});}
async function sellData(){const p=dataPlans[Number(document.getElementById('plan').value)],phone=document.getElementById('phone').value.trim(),cp=Number(document.getElementById('customerPrice').value);if(!/^0\d{10}$/.test(phone))return showAgentMessage('Enter a valid 11-digit phone number.');const ap=Number(p.agent_price??p.customer_price);if(cp<ap)return showAgentMessage('Customer price cannot be lower than your BOLTIV price.');await submit('data',{phone,network:document.getElementById('network').value,plan_code:p.plan_code||p.code,bundle_id:p.bundle_id,service_id:p.service_id,plan_name:p.name,amount:Number(p.customer_price),customerSellingPrice:cp});}
async function sellCable(){if(!cableVerified)return showAgentMessage('Verify the customer first.');const provider=document.getElementById('provider').value,plan=document.getElementById('plan').value,prices={DSTV:{Compact:19000,Confam:11000,Yanga:6000},GOTV:{Jolli:5800,Max:8500}},amount=prices[provider][plan],cp=Number(document.getElementById('customerPrice').value);const ap=Number(document.getElementById('agentPrice').textContent.replace(/[^0-9.]/g,''));if(cp<ap)return showAgentMessage('Customer price cannot be lower than your BOLTIV price.');await submit('cable',{provider,smartcard:document.getElementById('number').value,plan,amount,customerSellingPrice:cp});}
async function sellElectricity(){if(!electricityVerified)return showAgentMessage('Verify the meter first.');const amount=Number(document.getElementById('amount').value),cp=Number(document.getElementById('customerPrice').value);if(amount<100)return showAgentMessage('Minimum electricity sale is ₦100.');const ap=Number(document.getElementById('agentPrice').textContent.replace(/[^0-9.]/g,''));if(cp<ap)return showAgentMessage('Customer price cannot be lower than your BOLTIV price.');await submit('electricity',{provider:document.getElementById('provider').value,meterNumber:document.getElementById('meter').value,meterType:document.getElementById('meterType').value,amount,customerSellingPrice:cp});}
async function sellExam(){const p=examProducts[Number(document.getElementById('plan').value)],q=Number(document.getElementById('quantity').value),ap=Number(p.agent_price??p.customer_price)*q,cp=Number(document.getElementById('customerPrice').value);if(cp<ap)return showAgentMessage('Customer price cannot be lower than your BOLTIV price.');await submit('exam_pin',{product_id:p.product_id,product_code:p.product_code,examLabel:p.name||p.product_code,quantity:q,amount:Number(p.customer_price)*q,customerSellingPrice:cp});}
(async()=>{const d=await requireAgent();if(!d)return;tabs();renderForm();})();
</script><div class="receipt-overlay" id="receiptOverlay" onclick="if(event.target===this)closeReceipt()"><div class="receipt-card"><div class="receipt-icon" id="receiptIcon">✓</div><div class="receipt-status" id="receiptStatus">SUCCESSFUL</div><div class="receipt-amount" id="receiptAmount"></div><div class="receipt-rows" id="receiptRows"></div><button class="receipt-done" onclick="closeReceipt()">DONE</button></div></div></body></html>
