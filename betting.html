<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Betting</title><link rel="stylesheet" href="style.css?v=20260817-services"><script src="transaction-pin.js?v=20260815-pinfix"></script><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html")</script><style>
.svc-page{min-height:100vh;padding-bottom:110px}.svc-header{display:flex;align-items:center;gap:13px;padding:18px 0 24px}.back{width:40px;height:40px;border-radius:12px;border:1px solid #e5e5e1;background:#fff;color:#b8860b;font-size:22px}.svc-title{color:#b8860b;font-size:21px;font-weight:1000}.svc-subtitle{color:#666;font-size:10px;margin-top:4px}.hero{padding:23px;border-radius:23px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 38%),linear-gradient(145deg,#fffdf4,#fff);border:1px solid #e5e5e1;margin-bottom:20px}.hero-label{color:#b8860b;font-size:10px;font-weight:1000;letter-spacing:1px}.hero-title{color:#171717;font-size:23px;font-weight:1000;margin-top:7px}.hero-text{color:#777;font-size:11px;line-height:1.6;margin-top:6px}.card{padding:20px;border-radius:21px;background:#fff;border:1px solid #e5e5e1}label{display:block;color:#777;font-size:10px;font-weight:900;letter-spacing:.6px;margin:0 0 8px}input,select,textarea{width:100%;box-sizing:border-box;padding:14px 15px;border-radius:13px;border:1px solid #e5e5e1;background:#fff;color:#171717;outline:none;font-family:inherit;font-size:13px;font-weight:700;margin-bottom:17px}textarea{min-height:125px;resize:vertical;line-height:1.5}input:focus,select:focus,textarea:focus{border-color:#b8860b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.estimate{padding:15px;border-radius:14px;background:#fffdf4;border:1px solid #ead99b;margin:-2px 0 18px;color:#777;font-size:10px;line-height:1.6}.estimate strong{display:block;color:#b8860b;font-size:20px;margin-top:3px}.buy{width:100%;padding:16px;border:0;border-radius:14px;background:#b8860b;color:#fff;font-size:11px;font-weight:1000;letter-spacing:.8px}.result{display:none;margin-top:16px;padding:16px;border-radius:15px;border:1px solid #ead99b;background:#fffdf4;color:#555;font-size:10px;line-height:1.7;word-break:break-word}.result.show{display:block}.result.success{border-color:#8ecf9a;background:#f3fff4}.result.fail{border-color:#e6b4b4;background:#fff5f5}.result h3{margin:0 0 8px;color:#171717;font-size:15px}.pin-list{margin-top:10px;padding:12px;border-radius:12px;background:#fff;border:1px solid #e5e5e1}.pin-row{padding:8px 0;border-bottom:1px solid #eee}.pin-row:last-child{border-bottom:0}.muted{color:#777}@media(min-width:900px){.svc-page .container{width:min(100% - 64px,560px)}}
</style><link rel="icon" type="image/png" href="assets/boltiv-icon.png"></head><body><div class="page svc-page"><div class="container"><div class="svc-header"><button class="back" onclick="history.back()">‹</button><div><div class="svc-title">Betting</div><div class="svc-subtitle">BET9JA • SPORTYBET • 1XBET • BETKING</div></div></div><div class="hero"><div class="hero-label">BOLTIV BETTING</div><div class="hero-title">Fund your betting wallet.</div><div class="hero-text">Betting wallet funding is processed through Bigisub. Select your platform, enter the account/customer ID and confirm with your BOLTIV transaction PIN.</div></div><div class="card"><label>BETTING PLATFORM</label><select id="platform"><option value="bet9ja">Bet9ja</option><option value="sportybet">SportyBet</option><option value="1xbet">1xBet</option><option value="betking">BetKing</option></select><label>ACCOUNT / CUSTOMER ID</label><input id="customer" inputmode="numeric" placeholder="Enter betting account ID"><label>AMOUNT</label><input id="amount" type="number" min="100" step="1" placeholder="₦500"><div class="estimate">Minimum amount: ₦100.<strong id="total">₦0.00</strong></div><button class="buy" id="buy">FUND BETTING WALLET</button><div class="result" id="result"></div></div></div></div><nav class="bottom-nav"><button class="nav-item" data-page="index.html"><span class="nav-icon">⌂</span><span>Home</span></button><button class="nav-item" data-page="wallet.html"><span class="nav-icon">₦</span><span>Wallet</span></button><button class="nav-item" data-page="transactions.html"><span class="nav-icon">↯</span><span>Activity</span></button><button class="nav-item" data-page="profile.html"><span class="nav-icon">◉</span><span>Profile</span></button></nav><script>const API="https://boltiv-backend.onrender.com";const $=id=>document.getElementById(id),money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});const amount=$("amount"),total=$("total"),result=$("result");amount.oninput=()=>total.textContent=money(amount.value);$("buy").onclick=async()=>{result.className="result";result.textContent="";const customer=$("customer").value.trim(),value=Number(amount.value||0);if(!customer||value<100){result.classList.add("show","fail");result.textContent="Enter a valid betting account ID and an amount of at least ₦100.";return}const transactionPin=await boltivGetTransactionPin();if(!transactionPin)return;result.className="result show";result.textContent="Processing your betting wallet funding…";try{const r=await fetch(API+"/api/vtu/purchase",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({service:"betting",providerPayload:{service:"betting",service_id:$("platform").value,customer_id:customer,phone_number:customer,amount:value},amount:value,recipient:customer,idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now()),transactionPin})});const d=await r.json();if(!r.ok||!d.success){result.className="result show fail";const parts=[];parts.push(d.provider_message||d.message||"Betting transaction failed. If your wallet was debited, check Activity for the refund status.");if(d.provider_code)parts.push("Provider code: "+d.provider_code);if(d.provider_status)parts.push("Provider status: "+d.provider_status);if(d.provider_http_status)parts.push("HTTP status: "+d.provider_http_status);if(d.provider_reference)parts.push("Provider reference: "+d.provider_reference);if(d.reference)parts.push("BOLTIV reference: "+d.reference);result.textContent=parts.join("\n");return}result.className="result show success";result.innerHTML='<h3>Betting funding successful</h3>Reference: '+(d.reference||'—')+'<br>Amount: '+money(d.amount)+'<br>Status: '+(d.status||'successful');}catch(e){result.className="result show fail";result.textContent="Unable to reach BOLTIV right now. Please try again."}};</script></body></html>
