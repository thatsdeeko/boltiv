<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><meta name="description" content="BOLTIV Agent"><title>Agent Home — BOLTIV Agent</title><script src="/boltiv-api-config.js?v=1"></script><script src="/boltiv-client.js?v=20260820-nostorage"></script><script src="/transaction-pin.js?v=20260820-pinfix"></script><link rel="icon" href="/assets/boltiv-icon.webp"><link rel="stylesheet" href="/agent.css?v=1"></head><body><main class="agent-shell"><div class="agent-container"><header class="agent-top"><div class="brand">BOLTIV <span>Agent</span></div><span class="agent-badge">ACTIVE</span></header><div class="eyebrow">Business workspace</div><h1 class="title" id="greeting">Good morning.</h1><p class="sub" id="agentName">Grow your business with BOLTIV.</p><section class="hero hero-gold"><div class="hero-row"><div><div class="eyebrow">Available balance</div><div class="hero-balance" id="balance">₦0.00</div></div><div class="agent-badge">ACTIVE</div></div><button class="fund" onclick="location.href='/agent-wallet'">Fund Wallet <span>→</span></button></section><section class="metrics"><div class="metric"><div class="label">Today's Sales</div><strong id="sales">₦0.00</strong></div><div class="metric profit"><div class="label">Today's Profit</div><strong id="profit">₦0.00</strong></div><div class="metric"><div class="label">Transactions</div><strong id="count">0</strong></div></section><div class="section-head"><h2>Sell a service</h2><a class="link" href="/agent-sell">View all →</a></div><div class="quick-grid"><button class="quick" onclick="location.href='/agent-sell?service=airtime'"><div class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.2"></rect><path d="M10 6h4M11 18h2"></path></svg></div><strong>Sell Airtime</strong><span>Recharge a customer</span></button><button class="quick" onclick="location.href='/agent-sell?service=data'"><div class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5a11 11 0 0 1 16 0M7 12.5a7 7 0 0 1 10 0M10 15.5a3 3 0 0 1 4 0"></path><circle cx="12" cy="18" r="1"></circle></svg></div><strong>Sell Data</strong><span>Choose a plan</span></button><button class="quick" onclick="location.href='/agent-sell?service=cable'"><div class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="12" rx="2"></rect><path d="M8 21h8M12 17v4M9 3l3 3 3-3"></path></svg></div><strong>Cable TV</strong><span>Renew a subscription</span></button><button class="quick" onclick="location.href='/agent-sell?service=electricity'"><div class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.8 5.8 13h5.3l-.8 8.2L18.2 11h-5.1l.4-8.2Z"></path></svg></div><strong>Electricity</strong><span>Pay a meter</span></button><button class="quick" onclick="location.href='/agent-sell?service=exam_pin'"><div class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20.5H7z"></path><path d="M14 3.5v4h4M9.5 12h5M9.5 15h5"></path></svg></div><strong>Exam PINs</strong><span>Sell education PINs</span></button></div><div class="section-head"><h2>Recent sales</h2><a class="link" href="/agent-activity">See activity →</a></div><section class="card" id="recent"><div class="loading">Loading activity…</div></section><div id="agentMessage" class="agent-message"></div></div></main><nav class="agent-nav"><a data-page="home" class="active" href="/agent-home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"></path><path d="M9.5 20.5v-6h5v6"></path></svg></span>Home</a><a data-page="sell" class="sell-nav " href="/agent-sell"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Sell</a><a data-page="wallet" class="" href="/agent-wallet"><span class="nav-icon nav-icon-text" aria-hidden="true">₦</span>Wallet</a><a data-page="activity" class="" href="/agent-activity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg></span>Activity</a><a data-page="profile" class="" href="/agent-profile"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path></svg></span>Profile</a></nav><script src="/agent-app.js?v=1"></script><script>(async()=>{const d=await requireAgent();if(!d)return;const name=d.user.name||'Agent';document.getElementById('agentName').textContent=name+' · Grow your business with BOLTIV.';const h=new Date().getHours();document.getElementById('greeting').textContent=(h<12?'Good morning, ':h<18?'Good afternoon, ':'Good evening, ')+name.split(' ')[0]+'.';const x=await agentFetch('/api/agent/dashboard');document.getElementById('balance').textContent=money(x.walletBalance);document.getElementById('sales').textContent=money(x.today.sales);document.getElementById('profit').textContent=money(x.today.profit);document.getElementById('count').textContent=x.today.transactions;const t=await agentFetch('/api/agent/transactions?limit=5');const rows=t.transactions||[];document.getElementById('recent').innerHTML=rows.length?rows.map(r=>`<div class="activity-row"><div class="activity-main"><strong>${esc(r.service)}</strong><small>${esc(r.recipient||r.reference)}</small></div><div class="activity-right"><strong>${money(r.agentPrice)}</strong><small class="status ${esc(r.status)}">${esc(r.status)}</small></div></div>`).join(''):'<div class="empty">No Agent sales yet. Your first sale will appear here.</div>';})().catch(e=>showAgentMessage(e.message));</script></body></html>
