justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e9e9e5;text-align:left}.modal-detail:last-child{border-bottom:0}.modal-detail span{color:#666;font-size:10px}.modal-detail strong{color:#171717;font-size:11px;font-weight:900;text-align:right;word-break:break-word}.modal-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#f5d76e,#D4AF37,#D4AF37);color:#f7f7f5;font-family:inherit;font-size:11px;font-weight:1000}

<script>
// Dynamic VTUGATE data catalog + purchase logic
const API="https://boltiv-backend.onrender.com";
let selectedNetwork="",selectedPlan=null,lastLoadedPlans=null;
const $=id=>document.getElementById(id),phone=$("phoneNumber"),buyAgainSection=$("buyAgainSection"),buyAgainList=$("buyAgainList"),modal=$("boltivModal"),icon=$("modalIcon"),status=$("modalStatus"),title=$("modalTitle"),msg=$("modalMessage"),details=$("modalDetails"),modalBtn=$("modalButton"),planGrid=$("planGrid"),planLoading=$("planLoading"),planHint=$("planHint"),planWarning=$("planWarning");
const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const BUY_AGAIN_KEY="boltivRecentDataPurchases";

// Format time difference (e.g., "3 days ago", "2 hours ago")
function formatTimeDiff(timestamp){
  if(!timestamp)return"";
  const now=Date.now();
  const diff=now-timestamp;
  const sec=Math.floor(diff/1000);
  const min=Math.floor(sec/60);
  const hr=Math.floor(min/60);
  const day=Math.floor(hr/24);
  if(day>0)return day+" "+(day===1?"day":"days")+" ago";
  if(hr>0)return hr+" "+(hr===1?"hour":"hours")+" ago";
  if(min>0)return min+" "+(min===1?"minute":"minutes")+" ago";
  return"just now";
}

// Find similar plans by price range (within ±15%)
function findSimilarPlans(target,allPlans){
  if(!target||!Array.isArray(allPlans))return[];
  const price=Number(target.customer_price||0);
  const margin=price*0.15;
  return allPlans.filter(p=>{
    const p_price=Number(p.customer_price||0);
    return Math.abs(p_price-price)<=margin && p.code!==target.code;
  }).slice(0,2);
}

function readBuyAgain(){
  try{
    const raw=localStorage.getItem(BUY_AGAIN_KEY);
    const items=raw?JSON.parse(raw):[];
    return Array.isArray(items)?items.filter(x=>x&&x.network&&x.phone&&x.plan_code):[];
  }catch(e){return []}
}
function saveBuyAgain(item){
  try{
    const current=readBuyAgain();
    const normalized={
      network:String(item.network||"").toUpperCase(),
      phone:String(item.phone||""),
      plan_code:String(item.plan_code||""),
      bundle_id:item.bundle_id||"",
      service_id:item.service_id||"",
      plan_name:String(item.plan_name||""),
      customer_price:Number(item.customer_price||0),
      savedAt:Date.now()
    };
    const key=x=>[x.network,x.phone,x.plan_code,x.bundle_id,x.service_id].join("|");
    const next=[normalized,...current.filter(x=>key(x)!==key(normalized))].slice(0,5);
    localStorage.setItem(BUY_AGAIN_KEY,JSON.stringify(next));
    renderBuyAgain();
  }catch(e){}
}
function renderBuyAgain(){
  const items=readBuyAgain();
  if(!items.length){
    buyAgainSection.style.display="none";
    buyAgainList.innerHTML="";
    return;
  }
  buyAgainSection.style.display="block";
  buyAgainList.innerHTML="";
  items.forEach((item,index)=>{
    const row=document.createElement("div");
    row.className="buy-again-item";
    const info=document.createElement("div");
    info.className="buy-again-info";
    const plan=document.createElement("div");
    plan.className="buy-again-plan";
    plan.textContent=(item.network||"DATA")+" · "+(item.plan_name||"Data plan");
    const meta=document.createElement("div");
    meta.className="buy-again-meta";
    meta.textContent=item.phone+(item.customer_price?" · Last paid "+money(item.customer_price):"");
    const date=document.createElement("div");
    date.className="buy-again-date";
    date.textContent="Purchased "+formatTimeDiff(item.savedAt);
    info.appendChild(plan);info.appendChild(meta);info.appendChild(date);
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="buy-again-button";
    btn.textContent="BUY AGAIN";
    btn.setAttribute("aria-label","Buy "+(item.plan_name||"data plan")+" again");
    btn.onclick=async()=>{
      phone.value=item.phone;
      const targetNetwork=String(item.network||"").toLowerCase();
      document.querySelectorAll(".network-button").forEach(x=>x.classList.toggle("active",String(x.dataset.network||"").toLowerCase()===targetNetwork));
      selectedNetwork=item.network;
      btn.disabled=true;
      btn.textContent="LOADING…";
      planWarning.innerHTML="";
      planWarning.style.display="none";
      try{
        const r=await fetch(API+"/api/vtu/data/plans",{
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")
          },
          body:JSON.stringify({network:selectedNetwork})
        });
        const d=await r.json();
        if(!r.ok||!d.success)throw new Error(d.message||"Unable to refresh data plans.");
        renderPlans(d.plans);
        lastLoadedPlans=d.plans||[];
        const match=(d.plans||[]).find(p=>{
          const code=String(p.code||"");
          const bundle=String(p.bundle_id||"");
          const service=String(p.service_id||"");
          const savedBundle=String(item.bundle_id||"");
          const savedService=String(item.service_id||"");
          if(code && code===String(item.plan_code||"")) return true;
          if(savedBundle && bundle && bundle===savedBundle) return true;
          if(savedService && service && service===savedService && planLabel(p)===item.plan_name) return true;
          return false;
        });
        if(match){
          const buttons=[...planGrid.querySelectorAll(".plan-button")];
          const idx=(d.plans||[]).indexOf(match);
          if(buttons[idx]){
            buttons.forEach(x=>x.classList.remove("active"));
            buttons[idx].classList.add("active");
          }
          selectedPlan=match;
          planHint.textContent="Previous purchase selected. Price refreshed from the live catalog.";
          planWarning.innerHTML="";
          planWarning.style.display="none";
          planGrid.scrollIntoView({behavior:"smooth",block:"nearest"});
        }else{
          // Show enhanced message with alternatives
          const alternatives=findSimilarPlans(item,lastLoadedPlans);
          let warningHTML='<div class="plan-hint-warning"><div style="font-weight:700;margin-bottom:6px;">Plan Not Available</div><p class="plan-hint-suggestion">The <strong>'+esc(item.plan_name)+'</strong> plan you purchased is no longer available from '+esc(item.network)+'.</p>';
          if(alternatives.length>0){
            warningHTML+='<p class="plan-hint-suggestion" style="margin-top:8px;"><strong>Similar plans available:</strong></p><div class="alternative-plans">';
            alternatives.forEach(alt=>{
              warningHTML+='<button class="alternative-plan-btn" onclick="selectAlternativePlan(this,'+JSON.stringify(alt).replace(/"/g,"&quot;")+')" type="button"><div style="font-weight:700;">'+esc(planLabel(alt))+'</div><div style="font-size:7px;color:#999;margin-top:3px;">'+money(alt.customer_price)+'</div></button>';
            });
            warningHTML+='</div>';
          }else{
            warningHTML+='<p class="plan-hint-suggestion" style="margin-top:8px;">Please select another plan from the available options below.</p>';
          }
          warningHTML+='</div>';
          planWarning.innerHTML=warningHTML;
          planWarning.style.display="block";
          planHint.textContent="";
          planGrid.scrollIntoView({behavior:"smooth",block:"nearest"});
        }
      }catch(e){
        planWarning.innerHTML='<div class="plan-hint-warning"><strong>Error:</strong> '+esc(e.message||"Unable to refresh the previous plan.")+'</div>';
        planWarning.style.display="block";
        planHint.textContent="";
      }finally{
        btn.disabled=false;
        btn.textContent="BUY AGAIN";
      }
    };
    row.appendChild(info);row.appendChild(btn);
    buyAgainList.appendChild(row);
  });
}

// Select alternative plan from the suggestion
function selectAlternativePlan(button,plan){
  selectedPlan=plan;
  const buttons=[...planGrid.querySelectorAll(".plan-button")];
  const idx=(lastLoadedPlans||[]).indexOf(plan);
  if(idx>=0 && buttons[idx]){
    buttons.forEach(x=>x.classList.remove("active"));
    buttons[idx].classList.add("active");
  }
  planWarning.innerHTML='<div style="color:#70d47b;font-size:10px;padding:10px;background:#f0fff2;border-radius:8px;border:1px solid #c6e9cc;">✓ Alternative plan selected. Ready to purchase.</div>';
}

function show(type,t,m,b="GOT IT",d=""){modal.className="boltiv-modal show "+type;title.textContent=t;msg.textContent=m;modalBtn.textContent=b;status.textContent=type==="success"?"SUCCESSFUL":type==="failed"?"FAILED":type==="processing"?"PROCESSING":"NOTICE";icon.innerHTML=type==="success"?"✓":type==="failed"?"×":type==="processing"?'<div class="modal-spinner"></div>':"!";details.innerHTML=d;details.style.display=d?"block":"none"}
function close(){modal.classList.remove("show");modalBtn.style.display="block"}
modalBtn.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
function esc(v){return String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function formatValidity(value, days){
  const raw=String(value??"").trim();
  if(raw && !/^undefined|null|n\/a$/i.test(raw)){
    // SME sometimes returns numeric validity (for example 30) instead of
    // the text form (30days). Treat a bare positive number as days.
    if(/^\d+(?:\.\d+)?$/.test(raw)){
      const n=Number(raw);
      if(n>0)return n+" "+(n===1?"Day":"Days");
    }
    const normalized=raw.replace(/(\d+(?:\.\d+)?)\s*(day|days)\b/ig,(m,n)=>n+" "+(Number(n)===1?"Day":"Days"));
    return normalized.replace(/(\d+(?:\.\d+)?)\s*(hour|hours)\b/ig,(m,n)=>n+" "+(Number(n)===1?"Hour":"Hours"));
  }
  const d=Number(days);
  return d>0 ? d+" "+(d===1?"Day":"Days") : "Validity not available";
}
function planLabel(plan){
  // Keep the exact plan name returned by BOLTIV/our live catalog.
  // This is also what the backend persists on the transaction receipt.
  return String(plan?.name||plan?.code||"").trim();
}
function isOneDayPlan(plan){
  const values=[plan?.validity_days,plan?.validity,plan?.validity_period,plan?.duration];
  return values.some(v=>{
    const raw=String(v??"").trim().toLowerCase();
    if(!raw)return false;
    if(/^1(?:\.0+)?$/.test(raw))return true;
    return /^(?:1\s*(?:day|days)|24\s*(?:hour|hours))$/.test(raw);
  });
}
function renderPlans(plans){
  selectedPlan=null;
  planGrid.innerHTML="";
  const filtered=(Array.isArray(plans)?plans:[]).filter(plan=>{
    const text=[plan?.sales_channel,plan?.plan_type,plan?.planType,plan?.data_type,plan?.dataType,plan?.bundle_type,plan?.bundleType,plan?.category,plan?.channel,plan?.channel_name,plan?.channelName,plan?.name,plan?.description].filter(Boolean).join(" ").toLowerCase();
    const sizeText=[plan?.size_mb,plan?.sizeMb,plan?.data_mb,plan?.dataMb,plan?.volume,plan?.size,plan?.quantity,plan?.data_size,plan?.dataSize,plan?.name].filter(Boolean).join(" ");
    const match=sizeText.match(/(\d+(?:\.\d+)?)\s*(gb|mb)\b/i);
    const explicitSize=match?(Number(match[2].toLowerCase()==="gb"?Number(match[1])*1024:Number(match[1]))):(Number(plan?.size_mb)||0);
    return /\b(sme|gifting)\b/.test(text)&&explicitSize>=500;
  });
  if(!filtered.length){planGrid.innerHTML='<div class="plan-loading">No data plans are currently available for this network.</div>';return;}
  filtered.forEach(plan=>{
    const b=document.createElement("button");
    b.type="button";b.className="plan-button";
    const label=planLabel(plan), validity=formatValidity(plan.validity??plan.validity_period??plan.duration,plan.validity_days);
    b.innerHTML='<div class="plan-size">'+esc(label)+'</div><div class="plan-validity">'+esc(validity)+'</div><div class="plan-price">'+money(plan.customer_price)+'</div>';
    b.onclick=()=>{document.querySelectorAll(".plan-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedPlan=plan;planWarning.innerHTML="";planWarning.style.display="none";};
    planGrid.appendChild(b);
  });
}
async function loadPlans(network){
  selectedPlan=null;
  planGrid.innerHTML='<div class="plan-loading">Loading '+esc(network)+' data plans…</div>';
  planHint.textContent="";
  planWarning.innerHTML="";
  planWarning.style.display="none";
  try{
    const r=await fetch(API+"/api/vtu/data/plans",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({network})});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.message||"Unable to load data plans.");
    renderPlans(d.plans);
    lastLoadedPlans=d.plans||[];
    planHint.textContent=d.plans?.length?d.plans.length+" SME & Gifting plans (500MB+) available":"";
  }catch(e){
    planGrid.innerHTML='<div class="plan-loading">'+esc(e.message||"Unable to load data plans.")+'</div>';
  }
}
function info(p,id="",bal=""){let h='<div class="modal-detail"><span>Service</span><strong>Data</strong></div><div class="modal-detail"><span>Network</span><strong>'+esc(selectedNetwork)+'</strong></div><div class="modal-detail"><span>Phone</span><strong>'+esc(p)+'</strong></div><div class="modal-detail"><span>Data Plan</span><strong>'+esc(planLabel(selectedPlan))+'</strong></div><div class="modal-detail"><span>Amount</span><strong>'+money(selectedPlan.customer_price)+'</strong></div>';if(id)h+='<div class="modal-detail"><span>Reference</span><strong>'+esc(id)+'</strong></div>';if(bal!=="")h+='<div class="modal-detail"><span>Wallet Balance</span><strong>'+money(bal)+'</strong></div>';return h}
document.querySelectorAll(".network-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".network-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedNetwork=b.dataset.network;loadPlans(selectedNetwork)});
$("purchaseButton").onclick=async()=>{
  const p=phone.value.trim();
  if(!p)return show("warning","Phone Number Required","Enter the 11-digit phone number you want to recharge.");
  if(p.length!==11||!/^[0-9]{11}$/.test(p))return show("warning","Check Your Number","Please enter a valid 11-digit Nigerian phone number.");
  if(!selectedNetwork)return show("warning","Select Your Network","Choose your network.");
  if(!selectedPlan)return show("warning","Select a Data Plan","Choose a data plan.");
  const transactionPin=await boltivGetTransactionPin();
  if(!transactionPin){modalBtn.style.display="block";return;}
  show("processing","Processing Data","Your request is being sent securely.","PLEASE WAIT",info(p));modalBtn.style.display="none";
  try{
    const r=await fetch(API+"/api/vtu/data",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({phone:p,network:selectedNetwork,plan_code:selectedPlan.plan_code||selectedPlan.code,bundle_id:selectedPlan.bundle_id,service_id:selectedPlan.service_id,plan_name:planLabel(selectedPlan),amount:Number(selectedPlan.customer_price),service:"data",providerPayload:{service:"data",phone:p,network:selectedNetwork,plan_code:selectedPlan.plan_code||selectedPlan.code,bundle_id:selectedPlan.bundle_id,service_id:selectedPlan.service_id,plan_name:planLabel(selectedPlan),amount:Number(selectedPlan.customer_price)},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin})});
    const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process data purchase.");
    saveBuyAgain({
      network:selectedNetwork,
      phone:p,
      plan_code:selectedPlan.plan_code||selectedPlan.code,
      bundle_id:selectedPlan.bundle_id,
      service_id:selectedPlan.service_id,
      plan_name:planLabel(selectedPlan),
      customer_price:Number(selectedPlan.customer_price)
    });

    show(d.status==="pending"?"processing":"success",d.status==="pending"?"Processing":"Data Purchased",d.message||"Your data request has been received.","DONE",info(p,d.reference,d.balance));
  }catch(e){show("failed","Data Purchase Failed",e.message||"Unable to process your data purchase.","DONE",info(p));}
  finally{modalBtn.style.display="block"}
};
renderBuyAgain();
document.querySelectorAll(".nav-item").forEach(i=>i.onclick=()=>location.href=i.dataset.page);
</script></body></html>
