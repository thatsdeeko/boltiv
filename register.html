<body>

<div class="page">
<div class="container">

<div class="auth-page">

<div class="auth-logo">BOLTIV</div>
<div class="auth-tagline">FAST. SIMPLE. POWERFUL.</div>

<div class="auth-card">

<h1>Create Account</h1>

<p class="auth-subtitle">
Join BOLTIV and manage your digital services
</p>

<div class="status-message" id="statusMessage"></div>

<div class="form-group">
<label class="label">FULL NAME</label>
<input
class="input"
id="nameInput"
type="text"
autocomplete="name"
placeholder="Enter your full name">
</div>

<div class="form-group">
<label class="label">PHONE NUMBER</label>
<input
class="input"
id="phoneInput"
type="tel"
inputmode="tel"
autocomplete="tel"
placeholder="Enter phone number">
</div>

<div class="form-group">
<label class="label">EMAIL ADDRESS</label>
<input
class="input"
id="emailInput"
type="email"
autocomplete="email"
placeholder="you@example.com">
</div>

<div class="form-group">
<label class="label">PASSWORD</label>
<input
class="input"
id="passwordInput"
type="password"
autocomplete="new-password"
placeholder="Create a password">
</div>

<div class="form-group">
<label class="label">CONFIRM PASSWORD</label>
<input
class="input"
id="confirmPasswordInput"
type="password"
autocomplete="new-password"
placeholder="Confirm your password">
</div>

<button
class="btn btn-primary auth-btn"
id="registerButton">
Create Account
</button>

<div class="auth-links">
<a href="login.html">
Already have an account? Login
</a>
</div>

</div>
</div>
</div>
</div>


<!-- SUCCESS MODAL -->

<div class="boltiv-success-overlay" id="successModal">

<div class="boltiv-success-card">

<div class="success-ring">✓</div>

<div class="success-label">
ACCOUNT CREATED
</div>

<h2>Welcome to BOLTIV</h2>

<p class="success-message">
Your account has been created successfully.
Your BOLTIV account is ready to use.
</p>

<div class="success-user" id="successUser">
Welcome, User
</div>

<button
class="boltiv-success-btn"
id="successContinue">
CONTINUE TO LOGIN
</button>

</div>
</div>


<script>

const API_BASE="https://boltiv-backend.onrender.com";

const registerButton=
document.getElementById("registerButton");

const statusMessage=
document.getElementById("statusMessage");

const successModal=
document.getElementById("successModal");

const successUser=
document.getElementById("successUser");

const successContinue=
document.getElementById("successContinue");


function showStatus(message,type="error"){

    statusMessage.textContent=message;

    statusMessage.className=
        "status-message show "+type;

}


function clearStatus(){

    statusMessage.textContent="";

    statusMessage.className=
        "status-message";

}


function getInitials(name){

    const parts=
        name.trim()
        .split(/\s+/)
        .filter(Boolean);

    if(parts.length===1){
        return parts[0]
            .charAt(0)
            .toUpperCase();
    }

    return (
        parts[0].charAt(0)+
        parts[parts.length-1].charAt(0)
    ).toUpperCase();

}


registerButton.onclick=async()=>{

    clearStatus();

    const name=
        document.getElementById("nameInput")
        .value.trim();

    const phone=
        document.getElementById("phoneInput")
        .value.trim();

    const email=
        document.getElementById("emailInput")
        .value.trim()
        .toLowerCase();

    const password=
        document.getElementById("passwordInput")
        .value;

    const confirm=
        document.getElementById("confirmPasswordInput")
        .value;


    if(name.length<2){

        showStatus(
            "Please enter your full name."
        );

        return;
    }


    if(phone.length<7){

        showStatus(
            "Please enter a valid phone number."
        );

        return;
    }


    if(!/^\S+@\S+\.\S+$/.test(email)){

        showStatus(
            "Please enter a valid email address."
        );

        return;
    }


    if(password.length<6){

        showStatus(
            "Password must contain at least 6 characters."
        );

        return;
    }


    if(password!==confirm){

        showStatus(
            "Passwords do not match."
        );

        return;
    }


    registerButton.disabled=true;

    registerButton.textContent=
        "CREATING ACCOUNT...";


    try{

        const response=await fetch(
            API_BASE+"/api/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    name:name,

                    fullName:name,

                    phone:phone,

                    phoneNumber:phone,

                    email:email,

                    password:password

                })
            }
        );


        let data;

        try{

            data=await response.json();

        }catch{

            data={
                success:false,
                message:
                "The server returned an invalid response."
            };

        }


        if(!response.ok||!data.success){

            throw new Error(
                data.message||
                "Unable to create account."
            );

        }


        /*
         IMPORTANT:
         We do NOT store the password.
         */

        localStorage.removeItem(
            "boltivLoggedIn"
        );

        localStorage.removeItem(
            "boltivUser"
        );

        localStorage.removeItem(
            "boltivUserEmail"
        );

        localStorage.removeItem(
            "boltivBalance"
        );

        localStorage.removeItem(
            "boltivTransactions"
        );


        successUser.textContent=
            "Welcome, "+name;

        successModal.classList.add("show");


    }catch(error){

        console.error(
            "BOLTIV REGISTRATION ERROR:",
            error
        );

        showStatus(
            error.message||
            "Unable to connect to BOLTIV."
        );

    }finally{

        registerButton.disabled=false;

        registerButton.textContent=
            "Create Account";

    }

};


successContinue.onclick=()=>{

    successModal.classList.remove("show");

    setTimeout(()=>{

        location.href="login.html";

    },250);

};

</script>
