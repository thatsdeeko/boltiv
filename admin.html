<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>BOLTIV — Admin Control Center</title>
<style>
/* BASE */
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c49a24;--gold2:#9b7315;--bg:#f7f7f5;--card:#fff;--text:#171717;--muted:#777;--line:#e8e8e8;--danger:#b42318;--dangerbg:#fff1f0;--success:#18753b;--successbg:#edf9f1}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:14.3px;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px;padding:30px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
.logo{text-align:center;color:var(--gold2);font-size:35.2px;font-weight:1000;letter-spacing:5px}
.title{text-align:center;margin-top:10px;font-size:17.6px;font-weight:1000}
.sub{text-align:center;margin:7px 0 27px;color:#888;font-size:9.9px;letter-spacing:1px}
label{display:block;margin-bottom:7px;color:#555;font-size:9.9px;font-weight:900;letter-spacing:.5px}
input{width:100%;height:48px;margin-bottom:16px;padding:0 14px;border:1px solid #ddd;border-radius:11px;outline:none;background:#fff;color:#171717;font-size:15.4px}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.login-btn{width:100%;height:49px;border:0;border-radius:11px;background:var(--gold);color:#171717;font-weight:1000}
.login-btn:hover{background:#b78d1f}
.login-btn:disabled{opacity:.55}
.message{display:none;margin-top:14px;padding:12px;border-radius:10px;text-align:center;font-size:9.9px;line-height:1.5}
.message.show{display:block}
.message.error{color:var(--danger);background:var(--dangerbg);border:1px solid #f1c7c2}
.message.success{color:#856404;background:#fff9e6;border:1px solid #ead58a}

/* DASHBOARD */
.dashboard{min-height:100vh}
.topbar{height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{color:var(--gold2);font-size:23px;font-weight:1000;letter-spacing:3px}
.admin-label{color:#888;font-size:8.8px;margin-top:3px;font-weight:700}
.logout-btn{padding:10px 14px;border:1px solid #ead58a;border-radius:9px;background:#fff9e6;color:#8a6b10;font-size:8.8px;font-weight:1000}
.container{width:100%;max-width:1100px;margin:auto;padding:22px}
.heading{margin-bottom:20px}
.heading h1{font-size:26.4px;font-weight:1000}
.heading p{margin-top:6px;color:#888;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:18px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.035)}
.stat-label{color:#777;font-size:8.8px;font-weight:900;letter-spacing:.5px}
.stat-value{margin-top:8px;color:var(--gold2);font-size:23.1px;font-weight:1000}
.section{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.035)}
.section-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.section-head h2{font-size:13.2px;font-weight:1000;letter-spacing:.5px}
.refresh-btn{padding:8px 11px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#555;font-size:8.8px;font-weight:900}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold2)}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:13px;text-align:left;border-bottom:1px solid #eee;font-size:8.8px;white-space:nowrap}
th{color:#888;font-size:7.7px;letter-spacing:.7px;background:#fafafa}
td{color:#333}
tr:last-child td{border-bottom:0}
.amount{color:var(--gold2);font-weight:1000}
.status{display:inline-block;padding:5px 8px;border-radius:6px;font-size:7.7px;font-weight:1000;text-transform:uppercase}
.status.successful{color:var(--success);background:var(--successbg)}
.status.failed{color:var(--danger);background:var(--dangerbg)}
.status.pending{color:#856404;background:#fff9e6}
.empty,.loading{padding:28px;text-align:center;color:#888;font-size:9.9px}
.error-box{padding:14px;margin:15px;border:1px solid #f1c7c2;border-radius:10px;background:var(--dangerbg);color:var(--danger);font-size:9.9px}

/* MOBILE */
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.container{padding:15px}.topbar{padding:0 15px}.brand{font-size:23px}.heading h1{font-size:23.1px}.stat-value{font-size:19.8px}}
@media(max-width:400px){.login-card{padding:24px 19px}.stats{gap:8px}.stat{padding:14px}.stat-value{font-size:17.6px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
<div class="login-card">
<div class="logo">BOLTIV</div>
<div class="title">ADMIN CONTROL CENTER</div>
<div class="sub">SECURE ADMINISTRATOR ACCESS</div>
<label for="email">ADMIN EMAIL</label>
<input id="email" type="email" autocomplete="username" placeholder="Admin email">
<label for="password">ADMIN PASSWORD</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Admin password">
<button id="loginButton" class="login-btn" type="button">LOGIN TO ADMIN</button>
<div id="message" class="message"></div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">
<div class="topbar">
<div>
<div class="brand">BOLTIV</div>
<div class="admin-label">ADMIN CONTROL CENTER</div>
</div>
<button id="logoutButton" class="logout-btn">LOGOUT</button>
</div>

<div class="container">
<div class="heading">
<h1>Dashboard</h1>
<p id="adminEmailDisplay">Loading administrator...</p>
</div>

<!-- STATS -->
<div class="stats">
<div class="stat"><div class="stat-label">TOTAL USERS</div><div id="usersCount" class="stat-value">0</div></div>
<div class="stat"><div class="stat-label">WALLET BALANCE</div><div id="walletBalance" class="stat-value">₦0.00</div></div>
<div class="stat"><div class="stat-label">TRANSACTIONS</div><div id="transactionsCount" class="stat-value">0</div></div>
<div class="stat"><div class="stat-label">PAYMENTS</div><div id="paymentsCount" class="stat-value">0</div></div>
</div>

<!-- USERS -->
<div class="section">
<div class="section-head"><h2>USERS</h2><button class="refresh-btn" onclick="loadUsers()">REFRESH</button></div>
<div id="usersArea" class="loading">Loading users...</div>
</div>

<!-- TRANSACTIONS -->
<div class="section">
<div class="section-head"><h2>TRANSACTIONS</h2><button class="refresh-btn" onclick="loadTransactions()">REFRESH</button></div>
<div id="transactionsArea" class="loading">Loading transactions...</div>
</div>

<!-- PAYMENTS -->
<div class="section">
<div class="section-head"><h2>PAYMENTS</h2><button class="refresh-btn" onclick="loadPayments()">REFRESH</button></div>
<div id="paymentsArea" class="loading">Loading payments...</div>
</div>
</div>
</div>

<script>
/* CONFIG */
const API="https://boltiv-backend.onrender.com";
const TOKEN_KEY="boltivAdminToken";
const EMAIL_KEY="boltivAdminEmail";

/* ELEMENTS */
const loginPage=document.getElementById("loginPage");
const dashboard=document.getElementById("dashboard");
const email=document.getElementById("email");
const password=document.getElementById("password");
const loginButton=document.getElementById("loginButton");
const message=document.getElementById("message");
const logoutButton=document.getElementById("logoutButton");

/* HELPERS */
function showMessage(text,type="error"){
message.textContent=text;
message.className="message show "+type;
}

function hideLogin(){
loginPage.classList.add("hidden");
dashboard.classList.remove("hidden");
}

function showLogin(){
dashboard.classList.add("hidden");
loginPage.classList.remove("hidden");
}

function money(value){
return "₦"+Number(value||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function escapeHTML(value){
return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function formatDate(value){
if(!value)return "—";
const date=new Date(value);
if(Number.isNaN(date.getTime()))return String(value);
return date.toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"});
}

/* API */
async function api(path,options={}){
const token=localStorage.getItem(TOKEN_KEY);
const headers={"Accept":"application/json",...(options.headers||{})};
if(options.body)headers["Content-Type"]="application/json";
if(token)headers["Authorization"]="Bearer "+token;

const response=await fetch(API+path,{...options,headers});
let data;

try{data=await response.json()}catch{throw new Error("Invalid server response.")}

if(response.status===401){
localStorage.removeItem(TOKEN_KEY);
localStorage.removeItem(EMAIL_KEY);
showLogin();
throw new Error("Admin session expired.");
}

if(!response.ok||!data.success)throw new Error(data.message||"Request failed.");
return data;
}

/* LOGIN */
async function login(){
const adminEmail=email.value.trim().toLowerCase();
const adminPassword=password.value;
message.className="message";
message.textContent="";

if(!adminEmail){showMessage("Enter your admin email.");email.focus();return}
if(!adminPassword){showMessage("Enter your admin password.");password.focus();return}

loginButton.disabled=true;
loginButton.textContent="LOGGING IN...";

try{
const data=await api("/api/admin/login",{method:"POST",body:JSON.stringify({email:adminEmail,password:adminPassword})});
if(!data.token)throw new Error("No admin session token was returned.");

localStorage.setItem(TOKEN_KEY,data.token);
localStorage.setItem(EMAIL_KEY,data.admin?.email||adminEmail);
showMessage("Login successful.","success");
setTimeout(openDashboard,400);
}catch(error){
console.error("BOLTIV ADMIN LOGIN ERROR:",error);
showMessage(error.message||"Admin login failed.");
}finally{
loginButton.disabled=false;
loginButton.textContent="LOGIN TO ADMIN";
}
}
/* DASHBOARD */
async function openDashboard(){
try{
const data=await api("/api/admin/me");

document.getElementById("adminEmailDisplay").textContent=
data.admin?.email||
localStorage.getItem(EMAIL_KEY)||
"Administrator";

hideLogin();
await loadAll();

}catch(error){
console.error("ADMIN SESSION ERROR:",error);

localStorage.removeItem(TOKEN_KEY);
localStorage.removeItem(EMAIL_KEY);

showLogin();

showMessage(
error.message||
"Unable to verify admin session."
);
}
}

/* LOAD ALL DATA */
async function loadAll(){
await Promise.all([
loadStats(),
loadUsers(),
loadTransactions(),
loadPayments()
]);
}

/* LOAD STATS */
async function loadStats(){
try{
const data=await api("/api/admin/stats");
const stats=data.stats||{};

document.getElementById("usersCount").textContent=
stats.users||0;

document.getElementById("walletBalance").textContent=
money(stats.walletBalance);

document.getElementById("transactionsCount").textContent=
stats.transactions||0;

document.getElementById("paymentsCount").textContent=
stats.payments||0;

}catch(error){
console.error("STATS ERROR:",error);
}
}

/* LOAD USERS */
async function loadUsers(){
const area=document.getElementById("usersArea");

area.innerHTML=
'<div class="loading">Loading users...</div>';

try{
const data=await api("/api/admin/users");
const users=data.users||[];

if(!users.length){
area.innerHTML=
'<div class="empty">No users found.</div>';
return;
}

let html=`
<div class="table-wrap">
<table>
<thead>
<tr>
<th>USER</th>
<th>PHONE</th>
<th>EMAIL</th>
<th>BALANCE</th>
<th>CREATED</th>
</tr>
</thead>
<tbody>`;

users.forEach(user=>{
html+=`
<tr>
<td>${escapeHTML(user.name||"—")}</td>
<td>${escapeHTML(user.phone||"—")}</td>
<td>${escapeHTML(user.email||"—")}</td>
<td class="amount">${money(user.balance)}</td>
<td>${escapeHTML(formatDate(user.created_at))}</td>
</tr>`;
});

html+=`
</tbody>
</table>
</div>`;

area.innerHTML=html;

}catch(error){
console.error("USERS ERROR:",error);

area.innerHTML=
`<div class="error-box">${escapeHTML(error.message)}</div>`;
}
}

/* LOAD TRANSACTIONS */
async function loadTransactions(){
const area=document.getElementById("transactionsArea");

area.innerHTML=
'<div class="loading">Loading transactions...</div>';

try{
const data=await api("/api/admin/transactions");
const items=data.transactions||[];

if(!items.length){
area.innerHTML=
'<div class="empty">No transactions found.</div>';
return;
}

let html=`
<div class="table-wrap">
<table>
<thead>
<tr>
<th>REFERENCE</th>
<th>USER</th>
<th>SERVICE</th>
<th>AMOUNT</th>
<th>STATUS</th>
<th>DATE</th>
</tr>
</thead>
<tbody>`;

items.forEach(item=>{
const status=String(
item.status||"pending"
).toLowerCase();

html+=`
<tr>
<td>${escapeHTML(item.reference||"—")}</td>
<td>${escapeHTML(item.user_id||"—")}</td>
<td>${escapeHTML(item.service||"—")}</td>
<td class="amount">${money(item.amount)}</td>
<td>
<span class="status ${escapeHTML(status)}">
${escapeHTML(item.status||"pending")}
</span>
</td>
<td>${escapeHTML(formatDate(item.date))}</td>
</tr>`;
});

html+=`
</tbody>
</table>
</div>`;

area.innerHTML=html;

}catch(error){
console.error("TRANSACTIONS ERROR:",error);

area.innerHTML=
`<div class="error-box">${escapeHTML(error.message)}</div>`;
}
}

/* LOAD PAYMENTS */
async function loadPayments(){
const area=document.getElementById("paymentsArea");

area.innerHTML=
'<div class="loading">Loading payments...</div>';

try{
const data=await api("/api/admin/payments");
const items=data.payments||[];

if(!items.length){
area.innerHTML=
'<div class="empty">No payments found.</div>';
return;
}

let html=`
<div class="table-wrap">
<table>
<thead>
<tr>
<th>REFERENCE</th>
<th>EMAIL</th>
<th>AMOUNT</th>
<th>STATUS</th>
<th>CREDITED</th>
<th>DATE</th>
</tr>
</thead>
<tbody>`;

items.forEach(item=>{
const status=String(
item.status||"pending"
).toLowerCase();

html+=`
<tr>
<td>${escapeHTML(item.reference||"—")}</td>
<td>${escapeHTML(item.email||"—")}</td>
<td class="amount">${money(item.amount)}</td>
<td>
<span class="status ${escapeHTML(status)}">
${escapeHTML(item.status||"pending")}
</span>
</td>
<td>${item.credited?"YES":"NO"}</td>
<td>${escapeHTML(formatDate(item.created_at))}</td>
</tr>`;
});

html+=`
</tbody>
</table>
</div>`;

area.innerHTML=html;

}catch(error){
console.error("PAYMENTS ERROR:",error);

area.innerHTML=
`<div class="error-box">${escapeHTML(error.message)}</div>`;
}
}

/* DATE FORMAT */
function formatDate(value){
if(!value)return "—";

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return String(value);
}

return date.toLocaleString("en-NG",{
dateStyle:"medium",
timeStyle:"short"
});
}

/* LOGOUT */
async function logout(){
const token=localStorage.getItem(TOKEN_KEY);

try{
if(token){
await fetch(
API+"/api/admin/logout",
{
method:"POST",
headers:{
"Authorization":"Bearer "+token,
"Accept":"application/json"
}
}
);
}
}catch(error){
console.error("ADMIN LOGOUT ERROR:",error);
}

localStorage.removeItem(TOKEN_KEY);
localStorage.removeItem(EMAIL_KEY);

showLogin();

email.value="";
password.value="";
}

/* BUTTON EVENTS */
loginButton.onclick=login;
logoutButton.onclick=logout;

/* PASSWORD ENTER KEY */
password.addEventListener("keydown",event=>{
if(event.key==="Enter"){
login();
}
});

/* EMAIL ENTER KEY */
email.addEventListener("keydown",event=>{
if(event.key==="Enter"){
password.focus();
}
});

/* START ADMIN */
(function(){
const savedToken=localStorage.getItem(TOKEN_KEY);

if(savedToken){
openDashboard();
}else{
showLogin();
}
})();
</script>

</body>
</html>
