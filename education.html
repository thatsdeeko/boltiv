<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Education</title><link rel="stylesheet" href="style.css"><script src="transaction-pin.js?v=20260815-pinfix"></script><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");</script><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}button,input,select{font-family:inherit}.page{min-height:100vh;padding-bottom:90px}.container{width:min(100% - 30px,480px);margin:auto}.header{display:flex;align-items:center;gap:14px;padding:22px 0}.back{width:40px;height:40px;border:1px solid #e5e5e1;border-radius:13px;background:#fff;color:#b8860b;font-size:22px}.title{font-size:20.9px;font-weight:1000}.subtitle{margin-top:4px;color:#666;font-size:10px}.card{padding:20px;border:1px solid #e5e5e1;border-radius:20px;background:#fff}.label{display:block;margin-bottom:8px;color:#777;font-size:10px;font-weight:900}.select,.input{width:100%;height:48px;padding:0 14px;border:1px solid #e5e5e1;border-radius:12px;background:#fff;color:#171717;outline:none;font-size:12.1px}.field{margin-bottom:17px}.info{padding:15px;border:1px solid #ead99b;border-radius:14px;background:#fffdf4;color:#666;font-size:10px;line-height:1.6;margin-bottom:17px}.amount-box{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border:1px solid #e5e5e1;border-radius:12px}.currency{color:#b8860b;font-weight:1000}.amount{width:100%;border:0;outline:0;font-size:14px}.price{margin-top:8px;color:#777;font-size:10px}.pay{width:100%;height:50px;margin-top:18px;border:0;border-radius:13px;background:#b8860b;color:#fff;font-size:11px;font-weight:1000}.pay:disabled{background:#333;color:#777}.message{display:none;margin-top:12px;padding:12px;border-radius:11px;font-size:10px;text-align:center}.error{background:#fff1f1;color:#b94c4c;border:1px solid #e7bcbc}.success{background:#f0fff1;color:#28733a;border:1px solid #b8dcbf}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;display:flex;justify-content:center;padding:8px 12px;background:rgba(255,255,255,.97);border-top:1px solid #222}.nav{width:25%;max-width:110px;border:0;background:transparent;color:#555;font-size:7.7px;font-weight:900}.nav.active{color:#b8860b}.nav-icon{display:block;margin-bottom:4px;font-size:18.7px}
</style><link rel="icon" type="image/png" href="assets/boltiv-icon.png"></head><body><div class="page"><div class="container"><header class="header"><button class="back" onclick="history.back()">‹</button><div><div class="title">Education</div><div class="subtitle">WAEC, NECO, JAMB & NABTEB PINS</div></div></header><section class="card"><div class="info">Buy examination/result-checking pins directly from your BOLTIV wallet. Select the examination, choose the quantity, then confirm your transaction PIN.</div><div class="field"><label class="label">EXAMINATION</label><select id="exam" class="select"><option value="WAEC">WAEC</option><option value="NECO">NECO</option><option value="JAMB">JAMB</option><option value="NABTEB">NABTEB</option></select></div><div class="field"><label class="label">QUANTITY</label><select id="quantity" class="select"><option value="1">1 PIN</option><option value="2">2 PINS</option><option value="3">3 PINS</option><option value="4">4 PINS</option><option value="5">5 PINS</option></select></div><div id="price" class="price">Checking current VTUGATE price…</div><button id="pay" class="pay" disabled>BUY EDUCATION PINS</button><div id="message" class="message"></div></section></div></div><script>
const API=(localStorage.getItem('boltivApiBase')||'https://boltiv-backend.onrender.com').replace(/\/$/,''); const exam=document.getElementById('exam'),quantity=document.getElementById('quantity'),price=document.getElementById('price'),pay=document.getElementById('pay'),message=document.getElementById('message'); let livePrice=null;
function token(){return localStorage.getItem('boltivToken')||localStorage.getItem('token')||''}
function show(text,type='error'){message.textContent=text;message.className='message '+type;message.style.display='block'}
async function loadPrice(){pay.disabled=true;price.textContent='Checking current VTUGATE price…';try{const r=await fetch(API+'/api/vtu/education/price',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token()},body:JSON.stringify({exam:exam.value,quantity:Number(quantity.value)})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Unable to load education price.');livePrice=Number(d.total);price.textContent='Current price: ₦'+livePrice.toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});pay.disabled=false;message.style.display='none'}catch(e){livePrice=null;price.textContent='Price unavailable right now.';show(e.message)}}
exam.onchange=loadPrice;quantity.onchange=loadPrice;pay.onclick=async()=>{if(!livePrice)return;const pin=await window.BoltivTransactionPin?.request?.();if(!pin)return;pay.disabled=true;show('Processing…','success');try{const r=await fetch(API+'/api/vtu/purchase',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),'X-Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({service:'education',amount:livePrice,transactionPin:pin,idempotencyKey:crypto.randomUUID(),recipient:exam.value,providerPayload:{service:'education',exam:exam.value,quantity:Number(quantity.value),amount:livePrice}})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Education purchase failed.');show((d.message||'Education pins purchased successfully.')+' Reference: '+(d.reference||''),'success')}catch(e){show(e.message)}finally{loadPrice()}}; loadPrice();
</script></body></html>
