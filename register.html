<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>BOLTIV — Create Account</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;background:#fff}
.container{width:100%;max-width:520px;margin:auto;padding:0 20px}
.auth-page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:35px 0}
.auth-logo{display:flex;justify-content:center;align-items:center;width:100%;margin:0 auto}
.auth-logo img{display:block;width:min(300px,82vw);height:auto;max-height:210px;object-fit:contain}
.auth-card{margin-top:32px;padding:28px;border:1px solid #e5e5e5;border-radius:20px;background:#fff;box-shadow:0 12px 35px rgba(0,0,0,.07)}
.auth-card h1{margin:0;color:#111;font-size:29.7px;font-weight:900}
.auth-subtitle{margin:8px 0 26px;color:#707070;font-size:15.4px;line-height:1.5}
.form-group{margin-bottom:19px}
.label{display:block;margin-bottom:8px;color:#333;font-size:13.2px;font-weight:800;letter-spacing:.8px}
.input{width:100%;height:52px;padding:0 15px;border:1px solid #dcdcdc;border-radius:11px;background:#fff;color:#171717;font-size:16.5px;outline:none;transition:border-color .2s,box-shadow .2s}
.input::placeholder{color:#777}
.input:focus{border-color:#b8860b;box-shadow:0 0 0 3px rgba(196,154,37,.12)}
.auth-btn{width:100%;height:52px;margin-top:4px;border:none;border-radius:11px;background:#b8860b;color:#111;font-size:16.5px;font-weight:900;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s}
.auth-btn:hover{background:#c9a12f;box-shadow:0 8px 20px rgba(196,154,37,.22)}
.auth-btn:active{transform:scale(.98)}
.auth-btn:disabled{opacity:.65;cursor:not-allowed}
.auth-links{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:14.3px}
.auth-links a{color:#555;text-decoration:none;font-weight:700}
.auth-links a:hover{text-decoration:underline}
.status-message{display:none;margin-bottom:17px;padding:13px 14px;border-radius:10px;font-size:14.3px;line-height:1.5}
.status-message.show{display:block}
.status-message.error{color:#a32929;background:#fff4f4;border:1px solid #f0caca}
.status-message.success{color:#80620c;background:#fffaf0;border:1px solid #ead9a5}
.boltiv-success-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.3s ease}
.boltiv-success-overlay.show{opacity:1;visibility:visible}
.boltiv-success-card{width:100%;max-width:390px;padding:32px 24px 25px;border:1px solid #b8860b;border-radius:24px;background:#fff;box-shadow:0 25px 70px rgba(0,0,0,.16);text-align:center;transform:translateY(25px) scale(.94);transition:.3s ease}
.boltiv-success-overlay.show .boltiv-success-card{transform:translateY(0) scale(1)}
.success-ring{width:70px;height:70px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #b8860b;background:#fffaf0;color:#b58a17;font-size:35.2px;font-weight:1000}
.success-label{color:#b58a17;font-size:11px;font-weight:1000;letter-spacing:2px;margin-bottom:8px}
.boltiv-success-card h2{margin:0;color:#171717;font-size:26.4px;font-weight:900}
.success-message{margin:10px auto 0;max-width:300px;color:#707070;font-size:14.3px;line-height:1.7}
.success-user{margin-top:18px;padding:13px;border:1px solid #e5e5e5;border-radius:12px;background:#fafafa;color:#b58a17;font-size:14.3px;font-weight:800}
.boltiv-success-btn{width:100%;margin-top:17px;padding:14px;border:0;border-radius:11px;background:#b8860b;color:#171717;font-size:14.3px;font-weight:1000;cursor:pointer;transition:.2s}
.boltiv-success-btn:hover{background:#c9a12f;box-shadow:0 8px 20px rgba(196,154,37,.2)}
@media(max-width:480px){.container{padding:0 16px}.auth-page{justify-content:flex-start;padding-top:38px}.auth-logo img{width:min(290px,84vw);max-height:195px}.auth-card{margin-top:28px;padding:23px 20px;border-radius:18px}.auth-card h1{font-size:26.4px}.auth-subtitle{font-size:14.3px}}
@media(min-width:768px){.container{max-width:560px}.auth-logo img{width:320px;max-height:225px}.auth-card{padding:32px}}
</style>
</head>
<body>

<div class="page">
<div class="container">

<div class="auth-page">

<div class="auth-logo"><img src="assets/boltiv-logo.jpg" alt="BOLTIV — Fast. Simple. Powerful."></div>

<div class="auth-card">

<h1>Create Account</h1>

<p class="auth-subtitle">
Join BOLTIV and manage your digital services
</p>

<div class="status-message" id="statusMessage"></div>

<div class="form-group">
<label class="label">FULL NAME</label>
<input
class="input"
id="nameInput"
type="text"
autocomplete="name"
placeholder="Enter your full name">
</div>

<div class="form-group">
<label class="label">PHONE NUMBER</label>
<input
class="input"
id="phoneInput"
type="tel"
inputmode="tel"
autocomplete="tel"
placeholder="Enter phone number">
</div>

<div class="form-group">
<label class="label">EMAIL ADDRESS</label>
<input
class="input"
id="emailInput"
type="email"
autocomplete="email"
placeholder="you@example.com">
</div>

<div class="form-group">
<label class="label">PASSWORD</label>
<input
class="input"
id="passwordInput"
type="password"
autocomplete="new-password"
placeholder="Create a password">
</div>

<div class="form-group">
<label class="label">CONFIRM PASSWORD</label>
<input
class="input"
id="confirmPasswordInput"
type="password"
autocomplete="new-password"
placeholder="Confirm your password">
</div>

<button
class="btn btn-primary auth-btn"
id="registerButton">
Create Account
</button>

<div class="auth-links">
<a href="login.html">
Already have an account? Login
</a>
</div>

</div>
</div>
</div>
</div>


<!-- SUCCESS MODAL -->

<div class="boltiv-success-overlay" id="successModal">

<div class="boltiv-success-card">

<div class="success-ring">✓</div>

<div class="success-label">
ACCOUNT CREATED
</div>

<h2>Welcome to BOLTIV</h2>

<p class="success-message">
Your account has been created successfully.
Your BOLTIV account is ready to use.
</p>

<div class="success-user" id="successUser">
Welcome, User
</div>

<button
class="boltiv-success-btn"
id="successContinue">
CONTINUE TO LOGIN
</button>

</div>
</div>


<script>

const API_BASE="https://boltiv-backend.onrender.com";

const registerButton=
document.getElementById("registerButton");

const statusMessage=
document.getElementById("statusMessage");

const successModal=
document.getElementById("successModal");

const successUser=
document.getElementById("successUser");

const successContinue=
document.getElementById("successContinue");


function showStatus(message,type="error"){

    statusMessage.textContent=message;

    statusMessage.className=
        "status-message show "+type;

}


function clearStatus(){

    statusMessage.textContent="";

    statusMessage.className=
        "status-message";

}


function getInitials(name){

    const parts=
        name.trim()
        .split(/\s+/)
        .filter(Boolean);

    if(parts.length===1){
        return parts[0]
            .charAt(0)
            .toUpperCase();
    }

    return (
        parts[0].charAt(0)+
        parts[parts.length-1].charAt(0)
    ).toUpperCase();

}


registerButton.onclick=async()=>{

    clearStatus();

    const name=
        document.getElementById("nameInput")
        .value.trim();

    const phone=
        document.getElementById("phoneInput")
        .value.trim();

    const email=
        document.getElementById("emailInput")
        .value.trim()
        .toLowerCase();

    const password=
        document.getElementById("passwordInput")
        .value;

    const confirm=
        document.getElementById("confirmPasswordInput")
        .value;


    if(name.length<2){

        showStatus(
            "Please enter your full name."
        );

        return;
    }


    if(phone.length<7){

        showStatus(
            "Please enter a valid phone number."
        );

        return;
    }


    if(!/^\S+@\S+\.\S+$/.test(email)){

        showStatus(
            "Please enter a valid email address."
        );

        return;
    }


    if(password.length<6){

        showStatus(
            "Password must contain at least 6 characters."
        );

        return;
    }


    if(password!==confirm){

        showStatus(
            "Passwords do not match."
        );

        return;
    }


    registerButton.disabled=true;

    registerButton.textContent=
        "CREATING ACCOUNT...";


    try{

        const response=await fetch(
            API_BASE+"/api/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    name:name,

                    fullName:name,

                    phone:phone,

                    phoneNumber:phone,

                    email:email,

                    password:password

                })
            }
        );


        let data;

        try{

            data=await response.json();

        }catch{

            data={
                success:false,
                message:
                "The server returned an invalid response."
            };

        }


        if(!response.ok||!data.success){

            throw new Error(
                data.message||
                "Unable to create account."
            );

        }


        /*
         IMPORTANT:
         We do NOT store the password.
         */

        localStorage.removeItem(
            "boltivLoggedIn"
        );

        localStorage.removeItem(
            "boltivUser"
        );

        localStorage.removeItem(
            "boltivUserEmail"
        );

        localStorage.removeItem(
            "boltivBalance"
        );

        localStorage.removeItem(
            "boltivTransactions"
        );


        successUser.textContent=
            "Welcome, "+name;

        successModal.classList.add("show");


    }catch(error){

        console.error(
            "BOLTIV REGISTRATION ERROR:",
            error
        );

        showStatus(
            error.message||
            "Unable to connect to BOLTIV."
        );

    }finally{

        registerButton.disabled=false;

        registerButton.textContent=
            "Create Account";

    }

};


successContinue.onclick=()=>{

    successModal.classList.remove("show");

    setTimeout(()=>{

        location.href="login.html";

    },250);

};

</script>

</body>
</html>
