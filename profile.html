<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>BOLTIV — Profile</title>
<link rel="stylesheet" href="style.css">
<script>
if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");
</script>
<style>
*{box-sizing:border-box}
.profile-page{min-height:100vh;padding-bottom:110px}
.profile-top{display:flex;align-items:center;padding:18px 0 25px}
.profile-title{font-size:20px;font-weight:1000;color:#fff}
.profile-title span{color:#d4af37}
.profile-sub{margin-top:4px;font-size:8px;color:#666;letter-spacing:.5px}
.identity-card{padding:24px 20px;border-radius:24px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 35%),linear-gradient(145deg,#181818,#090909);border:1px solid #292929;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.identity{display:flex;align-items:center;gap:15px}
.avatar{width:68px;height:68px;flex-shrink:0;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#d4af37,#8c701c);color:#050505;font-size:24px;font-weight:1000}
.identity-name{font-size:17px;font-weight:1000;color:#fff;word-break:break-word}
.identity-email{margin-top:5px;color:#777;font-size:9px;word-break:break-word}
.status{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:5px 8px;border-radius:20px;background:#111c12;color:#6fd47a;font-size:7px;font-weight:900}
.status-dot{width:5px;height:5px;border-radius:50%;background:#6fd47a}
.section{margin-top:25px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-head h3{margin:0;color:#fff;font-size:11px;font-weight:1000}
.edit-btn{border:1px solid #d4af37;background:rgba(212,175,55,.08);color:#d4af37;padding:8px 11px;border-radius:9px;font-size:7px;font-weight:1000}
.details-card{padding:5px 18px 18px;border-radius:20px;background:#101010;border:1px solid #242424}
.detail{padding:17px 0;border-bottom:1px solid #202020}
.detail:last-child{border-bottom:0}
.detail-label{margin-bottom:7px;color:#666;font-size:7px;font-weight:900;letter-spacing:.7px}
.detail-input{width:100%;padding:0;border:0;outline:0;background:transparent;color:#eee;font-size:12px;font-weight:800;line-height:20px}
.detail-input:disabled{opacity:1}
.detail-input.editing{padding:9px 10px;border-radius:9px;background:#080808;border:1px solid #332b16;color:#d4af37}
.save-btn{display:none;width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#d4af37,#a78320);color:#050505;font-size:9px;font-weight:1000}
.save-btn.show{display:block}
.actions{display:grid;gap:9px}
.action{width:100%;padding:15px;display:flex;align-items:center;gap:12px;border-radius:15px;background:#101010;border:1px solid #242424;color:#fff;text-align:left}
.action-icon{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#17140b;border:1px solid #403513;color:#d4af37;font-size:13px}
.action-text{flex:1}
.action-title{font-size:9px;font-weight:900}
.action-sub{margin-top:3px;color:#666;font-size:7px}
.action-arrow{color:#555;font-size:15px}
.logout{color:#e07777}
.logout .action-icon{color:#e07777;background:#1b0e0e;border-color:#422020}
.modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.25s}
.modal.show{opacity:1;visibility:visible}
.modal-box{width:100%;max-width:370px;padding:26px 22px;border-radius:24px;background:linear-gradient(145deg,#181818,#080808);border:1px solid #d4af37;text-align:center;transform:translateY(20px) scale(.95);transition:.25s}
.modal.show .modal-box{transform:translateY(0) scale(1)}
.modal-icon{width:58px;height:58px;margin:0 auto 15px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#17140b;border:1px solid #d4af37;color:#d4af37;font-size:22px}
.modal-title{color:#fff;font-size:17px;font-weight:1000}
.modal-text{margin-top:7px;color:#777;font-size:9px;line-height:1.6}
.modal-btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#d4af37;color:#050505;font-size:9px;font-weight:1000}
</style>
</head>
<body>
<div class="page profile-page"><div class="container">

<!-- HEADER -->
<div class="profile-top"><div><div class="profile-title">My <span>Profile</span></div><div class="profile-sub">MANAGE YOUR BOLTIV ACCOUNT</div></div></div>

<!-- IDENTITY -->
<div class="identity-card"><div class="identity"><div class="avatar" id="avatar">U</div><div><div class="identity-name" id="identityName">User</div><div class="identity-email" id="identityEmail">No email added</div><div class="status"><span class="status-dot"></span>ACCOUNT ACTIVE</div></div></div></div>

<!-- PERSONAL INFORMATION -->
<div class="section"><div class="section-head"><h3>Personal Information</h3><button class="edit-btn" id="editBtn">EDIT DETAILS</button></div>
<div class="details-card">
<div class="detail"><div class="detail-label">FULL NAME</div><input id="nameInput" class="detail-input" type="text" disabled placeholder="Enter your full name"></div>
<div class="detail"><div class="detail-label">PHONE NUMBER</div><input id="phoneInput" class="detail-input" type="tel" disabled placeholder="Enter phone number"></div>
<div class="detail"><div class="detail-label">EMAIL ADDRESS</div><input id="emailInput" class="detail-input" type="email" disabled placeholder="Enter email address"></div>
<button id="saveBtn" class="save-btn">SAVE CHANGES</button>
</div></div>

<!-- SECURITY -->
<div class="section"><div class="section-head"><h3>Security</h3></div><div class="actions">
<button class="action" id="securityBtn"><div class="action-icon">⌾</div><div class="action-text"><div class="action-title">Security Settings</div><div class="action-sub">Manage your Transaction PIN and account security</div></div><div class="action-arrow">›</div></button>
</div></div>

<!-- SUPPORT -->
<div class="section"><div class="section-head"><h3>Support</h3></div><div class="actions">
<button class="action" id="supportBtn"><div class="action-icon">?</div><div class="action-text"><div class="action-title">BOLTIV Support</div><div class="action-sub">Get help with your account and transactions</div></div><div class="action-arrow">›</div></button>
</div></div>

<!-- ACCOUNT ACTIONS -->
<div class="section"><div class="section-head"><h3>Account</h3></div><div class="actions">
<button class="action logout" id="logoutBtn"><div class="action-icon">↪</div><div class="action-text"><div class="action-title">Log Out</div><div class="action-sub">Sign out of your BOLTIV account</div></div><div class="action-arrow">›</div></button>
</div></div>

</div></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
<button class="nav-item" data-page="index.html"><span class="nav-icon">⌂</span><span>Home</span></button>
<button class="nav-item" data-page="wallet.html"><span class="nav-icon">₦</span><span>Wallet</span></button>
<button class="nav-item" data-page="transactions.html"><span class="nav-icon">↯</span><span>Activity</span></button>
<button class="nav-item active" data-page="profile.html"><span class="nav-icon">◉</span><span>Profile</span></button>
</nav>

<!-- SUCCESS MODAL -->
<div class="modal" id="modal"><div class="modal-box"><div class="modal-icon">✓</div><div class="modal-title">Profile Updated</div><div class="modal-text">Your personal information has been successfully updated.</div><button class="modal-btn" id="modalDone">DONE</button></div></div>

<script>
// USER STORAGE
function getUser(){try{return JSON.parse(localStorage.getItem("boltivUser")||"{}")||{}}catch(e){return{}}}
function saveUser(user){localStorage.setItem("boltivUser",JSON.stringify(user))}

// ELEMENTS
const nameInput=document.getElementById("nameInput"),phoneInput=document.getElementById("phoneInput"),emailInput=document.getElementById("emailInput"),editBtn=document.getElementById("editBtn"),saveBtn=document.getElementById("saveBtn"),modal=document.getElementById("modal");

// LOAD PROFILE
function loadProfile(){
const user=getUser();
const name=String(user.name||user.fullName||user.firstName||"User").trim()||"User";
const phone=user.phone||user.phoneNumber||"";
const email=user.email||"";
nameInput.value=name;
phoneInput.value=phone;
emailInput.value=email;
document.getElementById("identityName").textContent=name;
document.getElementById("identityEmail").textContent=email||"No email added";
const parts=name.split(/\s+/).filter(Boolean);
document.getElementById("avatar").textContent=parts.length>1?(parts[0][0]+parts[parts.length-1][0]).toUpperCase():name[0].toUpperCase();
}

// EDIT MODE
function enableEdit(){
[nameInput,phoneInput,emailInput].forEach(input=>{input.disabled=false;input.classList.add("editing")});
editBtn.textContent="DONE EDITING";
saveBtn.classList.add("show");
nameInput.focus();
}
function disableEdit(){
[nameInput,phoneInput,emailInput].forEach(input=>{input.disabled=true;input.classList.remove("editing")});
editBtn.textContent="EDIT DETAILS";
saveBtn.classList.remove("show");
}

// EDIT BUTTON
editBtn.onclick=()=>nameInput.disabled?enableEdit():disableEdit();

// SAVE PROFILE
saveBtn.onclick=()=>{
const name=nameInput.value.trim(),phone=phoneInput.value.trim(),email=emailInput.value.trim();
if(name.length<2){alert("Please enter your full name.");return}
if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert("Please enter a valid email address.");return}
const oldUser=getUser();
saveUser({...oldUser,name,fullName:name,phone,phoneNumber:phone,email});
loadProfile();
disableEdit();
modal.classList.add("show");
};

// CLOSE MODAL
document.getElementById("modalDone").onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};

// SECURITY
document.getElementById("securityBtn").onclick=()=>location.href="security.html";

// SUPPORT
document.getElementById("supportBtn").onclick=()=>location.href="support.html";

// LOGOUT
document.getElementById("logoutBtn").onclick=()=>{
localStorage.removeItem("boltivLoggedIn");
location.replace("login.html");
};

// NAVIGATION
document.querySelectorAll(".nav-item").forEach(item=>{item.onclick=()=>location.href=item.dataset.page});

// START
loadProfile();
</script>
</body>
</html>
<!-- BOLTIV PROFILE UPDATED WITH SUPPORT -->
