<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">

<title>BOLTIV — Login</title>

<link rel="stylesheet" href="style.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#ffffff;
    color:#171717;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    min-height:100vh;
    background:#ffffff;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:0 20px;
}

.auth-page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:35px 0;
}

.auth-logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#b8860b;font-size:39.6px;font-weight:1000;letter-spacing:5px}.auth-logo img{width:78px;height:88px;object-fit:contain;display:block}.auth-logo span{display:block;line-height:1}

.auth-tagline{
    text-align:center;
    color:#777;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    margin-top:7px;
}

.auth-card{
    margin-top:32px;
    padding:28px;
    border:1px solid #e5e5e5;
    border-radius:20px;
    background:#ffffff;
    box-shadow:
        0 12px 35px rgba(0,0,0,.07);
}

.auth-card h1{
    margin:0;
    color:#111111;
    font-size:29.7px;
    font-weight:900;
}

.auth-subtitle{
    margin:8px 0 26px;
    color:#707070;
    font-size:15.4px;
    line-height:1.5;
}

.form-group{
    margin-bottom:19px;
}

.label{
    display:block;
    margin-bottom:8px;
    color:#333333;
    font-size:13.2px;
    font-weight:800;
    letter-spacing:.8px;
}

.input{
    width:100%;
    height:52px;
    padding:0 15px;

    border:1px solid #dcdcdc;
    border-radius:11px;

    background:#ffffff;
    color:#171717;

    font-size:16.5px;
    outline:none;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.input::placeholder{
    color:#777;
}

.input:focus{
    border-color:#b8860b;
    box-shadow:
        0 0 0 3px rgba(196,154,37,.12);
}

.auth-btn{
    width:100%;
    height:52px;
    margin-top:4px;

    border:none;
    border-radius:11px;

    background:#b8860b;
    color:#111111;

    font-size:16.5px;
    font-weight:900;

    cursor:pointer;

    transition:
        transform .15s,
        background .2s,
        box-shadow .2s;
}

.auth-btn:hover{
    background:#c9a12f;
    box-shadow:
        0 8px 20px rgba(196,154,37,.22);
}

.auth-btn:active{
    transform:scale(.98);
}

.auth-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.auth-links{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;

    margin-top:22px;

    font-size:14.3px;
}

.auth-links a{
    color:#555;
    text-decoration:none;
    font-weight:700;
}

.auth-links a:first-child{
    color:#b58a17;
}

.auth-links a:hover{
    text-decoration:underline;
}

.status-message{
    display:none;

    margin-bottom:17px;
    padding:13px 14px;

    border-radius:10px;

    font-size:14.3px;
    line-height:1.5;
}

.status-message.show{
    display:block;
}

.status-message.error{
    color:#a32929;
    background:#fff4f4;
    border:1px solid #f0caca;
}

.status-message.success{
    color:#80620c;
    background:#fffaf0;
    border:1px solid #ead9a5;
}

@media(max-width:480px){

    .container{
        padding:0 16px;
    }

    .auth-page{
        justify-content:flex-start;
        padding-top:55px;
    }

    .auth-logo{
        font-size:35.2px;
    }

    .auth-card{
        margin-top:28px;
        padding:23px 20px;
        border-radius:18px;
    }

    .auth-card h1{
        font-size:26.4px;
    }

    .auth-subtitle{
        font-size:14.3px;
    }

}

</style>
<link rel="icon" type="image/png" href="assets/boltiv-icon.png">
<script src="boltiv-ui.js" defer></script>
</head>

<body>

<div class="page">

<div class="container">

<div class="auth-page">

<div class="auth-logo"><img src="assets/boltiv-logo.png" alt="BOLTIV logo"><span>BOLTIV</span></div>

<div class="auth-tagline">
FAST. SIMPLE. POWERFUL.
</div>


<div class="auth-card">

<h1>
Welcome Back
</h1>

<p class="auth-subtitle">
Login to your BOLTIV account
</p>


<div
id="statusMessage"
class="status-message">
</div>


<div class="form-group">

<label
class="label"
for="emailInput">

EMAIL

</label>

<input
class="input"
id="emailInput"
type="email"
autocomplete="email"
placeholder="you@example.com">

</div>


<div class="form-group">

<label
class="label"
for="passwordInput">

PASSWORD

</label>

<input
class="input"
id="passwordInput"
type="password"
autocomplete="current-password"
placeholder="Enter your password">

</div>


<button
class="auth-btn"
id="loginButton">

Login

</button>


<div class="auth-links">

<a href="register.html">
Create Account
</a>

<a href="forgot-password.html">
Forgot Password?
</a>

</div>

</div>

</div>

</div>

</div>


<script>

const API_BASE =
"https://boltiv-backend.onrender.com";


const loginButton =
document.getElementById("loginButton");

const statusMessage =
document.getElementById("statusMessage");


function showStatus(
    message,
    type="error"
){

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message show " +
        type;

}


function clearStatus(){

    statusMessage.textContent = "";

    statusMessage.className =
        "status-message";

}


async function login(){

    clearStatus();

    const email =
        document
        .getElementById("emailInput")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("passwordInput")
        .value;


    if(!email){

        showStatus(
            "Enter your email."
        );

        return;
    }


    if(!/^\S+@\S+\.\S+$/.test(email)){

        showStatus(
            "Enter a valid email address."
        );

        return;
    }


    if(!password){

        showStatus(
            "Enter your password."
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "LOGGING IN...";


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/auth/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


        let data;


        try{

            data =
                await response.json();

        }catch{

            data = {
                success:false,
                message:
                "Invalid server response."
            };

        }


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Invalid email or password."
            );

        }


        /*
        SAVE AUTH SESSION ONLY.
        NEVER SAVE THE PASSWORD.
        */

        if(data.token){

            localStorage.setItem(
                "boltivAuthToken",
                data.token
            );

        }


        if(data.user){

            localStorage.setItem(
                "boltivUser",
                JSON.stringify(
                    data.user
                )
            );


            if(data.user.email){

                localStorage.setItem(
                    "boltivUserEmail",
                    data.user.email
                );

            }

        }


        localStorage.setItem(
            "boltivLoggedIn",
            "true"
        );


        showStatus(
            "Login successful. Opening BOLTIV...",
            "success"
        );


        setTimeout(()=>{

            location.href =
                "index.html";

        },500);


    }catch(error){

        console.error(
            "BOLTIV LOGIN ERROR:",
            error
        );

        showStatus(
            error.message ||
            "Unable to connect to BOLTIV."
        );


    }finally{

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }

}


loginButton.onclick = login;


document
.getElementById("passwordInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);

</script>

</body>
</html>
