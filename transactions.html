<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f7f7f5">
<title>BOLTIV — Transactions</title>
<link rel="stylesheet" href="style.css">
<script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");</script>
<style>
.transactions-page{min-height:100vh;padding-bottom:110px}.transactions-header{display:flex;align-items:center;gap:13px;padding:18px 0 20px}.back-button{width:40px;height:40px;border-radius:12px;border:1px solid #e5e5e1;background:#ffffff;color:#b8860b;font-size:22px;display:flex;align-items:center;justify-content:center}.transactions-title{color:#b8860b;font-size:20.9px;font-weight:1000}.transactions-subtitle{color:#666;font-size:10px;margin-top:4px}.search-box{position:relative;margin-bottom:17px}.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#b8860b;font-size:16.5px;pointer-events:none}.transaction-search{width:100%;height:48px;box-sizing:border-box;padding:0 42px;border-radius:15px;border:1px solid #e5e5e1;background:#ffffff;color:#171717;outline:none;font-family:inherit;font-size:11px;font-weight:800}.transaction-search::placeholder{color:#666}.transaction-search:focus{border-color:#b8860b;box-shadow:0 0 0 2px rgba(212,175,55,.07)}.clear-search{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:9px;background:#1a1a1a;color:#777;display:none;align-items:center;justify-content:center;font-size:14.3px}.clear-search.show{display:flex}.filter-box{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding-bottom:5px;margin-bottom:18px;width:100%}.filter-box::-webkit-scrollbar{display:none}.filter-button{width:100%;min-width:0;padding:10px 5px;border-radius:12px;border:1px solid #e5e5e1;background:#fafaf8;color:#777;font-family:inherit;font-size:10px;font-weight:900}.filter-button.active{color:#f7f7f5;background:#b8860b;border-color:#b8860b}.transaction-summary{padding:20px;border-radius:21px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.14),transparent 38%),linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;margin-bottom:18px}.summary-label{color:#777;font-size:10px;font-weight:900;letter-spacing:.7px}.summary-row{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-top:8px}.summary-count{color:#171717;font-size:27.5px;font-weight:1000}.summary-status{color:#70d47b;font-size:10px;font-weight:900}.transaction-list{display:flex;flex-direction:column;gap:10px}.transaction-item{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:15px;border-radius:17px;border:1px solid #e5e5e1;background:#ffffff;text-align:left;color:#171717;transition:.2s ease}.transaction-item:active{transform:scale(.98)}.transaction-icon{width:43px;height:43px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fffdf4;border:1px solid #ead99b;color:#b8860b;font-size:18.7px;font-weight:1000}.transaction-info{min-width:0;flex:1}.transaction-name{color:#171717;font-size:11px;font-weight:1000}.transaction-number{color:#666;font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.transaction-right{flex-shrink:0;text-align:right}.transaction-amount{color:#171717;font-size:11px;font-weight:1000}.transaction-status{font-size:7.7px;font-weight:1000;margin-top:5px}.status-success{color:#70d47b}.status-failed{color:#e07878}.status-pending{color:#b8860b}.status-processing{color:#b8860b}.status-refunded{color:#b42318}.transaction-note{margin-top:12px;padding:12px 14px;border-radius:13px;background:#fffdf4;border:1px solid #ead99b;color:#6b5716;font-size:10px;line-height:1.5}.empty-state{padding:45px 20px;border-radius:21px;border:1px dashed #e5e5e1;background:#fafaf8;text-align:center}.empty-icon{width:60px;height:60px;margin:0 auto 15px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fffdf4;border:1px solid #ead99b;color:#b8860b;font-size:26.4px}.empty-title{color:#171717;font-size:15.4px;font-weight:1000}.empty-text{color:#666;font-size:11px;line-height:1.6;margin-top:7px}.modal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,20,20,.45);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.25s ease}.modal.show{opacity:1;visibility:visible}.modal-card{width:100%;max-width:390px;box-sizing:border-box;padding:25px 20px;border-radius:25px;background:linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;box-shadow:0 30px 90px rgba(0,0,0,.75)}.modal-top{display:flex;align-items:center;gap:13px;margin-bottom:20px}.modal-service-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fffdf4;border:1px solid #ead99b;color:#b8860b;font-size:20.9px;font-weight:1000}.modal-service{color:#171717;font-size:15.4px;font-weight:1000}.modal-service-status{font-size:7.7px;font-weight:1000;margin-top:4px}.detail-box{padding:5px 14px;border-radius:16px;background:#fafaf8;border:1px solid #e5e5e1}.detail-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #e9e9e5}.detail-row:last-child{border-bottom:0}.detail-row span{color:#666;font-size:10px}.detail-row strong{color:#171717;font-size:11px;font-weight:900;text-align:right;word-break:break-word}.close-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#f5d76e,#b8860b,#b8860b);color:#f7f7f5;font-family:inherit;font-size:11px;font-weight:1000}
@media (max-width:380px){.filter-box{gap:5px}.filter-button{padding:9px 3px;font-size:8.6px;border-radius:10px}}
@media (min-width:700px){.transactions-page{padding-bottom:120px}.filter-box{gap:10px}.filter-button{padding:11px 8px}}
</style>
<link rel="icon" type="image/png" href="assets/boltiv-icon.png">
<script src="boltiv-ui.js" defer></script>
</head>
<body>
<div class="page transactions-page"><div class="container">
<div class="transactions-header"><button class="back-button" onclick="history.back()">‹</button><div><div class="transactions-title">Transactions</div><div class="transactions-subtitle">YOUR PAYMENT ACTIVITY</div></div></div>

<div class="search-box"><span class="search-icon">⌕</span><input type="search" id="transactionSearch" class="transaction-search" placeholder="Search transactions..." autocomplete="off"><button type="button" id="clearSearch" class="clear-search">×</button></div>

<div class="filter-box">
<button class="filter-button active" data-filter="all">ALL</button>
<button class="filter-button" data-filter="airtime">AIRTIME</button>
<button class="filter-button" data-filter="data">DATA</button>
<button class="filter-button" data-filter="electricity">ELECTRICITY</button>
<button class="filter-button" data-filter="cable">CABLE TV</button>
</div>

<div class="transaction-summary"><div class="summary-label">TRANSACTIONS FOUND</div><div class="summary-row"><div class="summary-count" id="transactionCount">0</div><div class="summary-status">● ACTIVITY</div></div></div>

<div class="transaction-list" id="transactionList"></div>

<div class="empty-state" id="emptyState"><div class="empty-icon">↯</div><div class="empty-title" id="emptyTitle">No Transactions Yet</div><div class="empty-text" id="emptyText">Your Airtime, Data, Electricity and Cable TV transactions will appear here after you make a purchase.</div></div>
</div></div>

<nav class="bottom-nav">
<button class="nav-item" data-page="index.html"><span class="nav-icon">⌂</span><span>Home</span></button>
<button class="nav-item" data-page="wallet.html"><span class="nav-icon">₦</span><span>Wallet</span></button>
<button class="nav-item active" data-page="transactions.html"><span class="nav-icon">↯</span><span>Activity</span></button>
<button class="nav-item" data-page="profile.html"><span class="nav-icon">◉</span><span>Profile</span></button>
</nav>

<div class="modal" id="transactionModal"><div class="modal-card"><div class="modal-top"><div class="modal-service-icon" id="modalIcon">₦</div><div><div class="modal-service" id="modalService">Transaction</div><div class="modal-service-status" id="modalStatus">● SUCCESSFUL</div></div></div><div class="detail-box" id="modalDetails"></div><button class="close-button" id="closeModal">DONE</button></div></div>

<script>
const list=document.getElementById("transactionList"),empty=document.getElementById("emptyState"),emptyTitle=document.getElementById("emptyTitle"),emptyText=document.getElementById("emptyText"),count=document.getElementById("transactionCount"),search=document.getElementById("transactionSearch"),clear=document.getElementById("clearSearch"),modal=document.getElementById("transactionModal"),modalIcon=document.getElementById("modalIcon"),modalService=document.getElementById("modalService"),modalStatus=document.getElementById("modalStatus"),modalDetails=document.getElementById("modalDetails");
let filter="all",term="";

const API="https://boltiv-backend.onrender.com";
function getTransactions(){try{const x=JSON.parse(localStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function normalizeTransaction(t){
  const service=String(t.service||"").toLowerCase();
  const type=service.includes("airtime")?"airtime":service.includes("data")?"data":service.includes("cable")||service.includes("tv")?"cable":service.includes("electric")?"electricity":service.includes("wallet")?"wallet":"other";
  let meta=t.metadata;
  if(typeof meta==="string"){try{meta=JSON.parse(meta)}catch{meta={}}}
  meta=meta&&typeof meta==="object"?meta:{};
  return {...t,type,amount:Number(t.amount||0),createdAt:t.date||t.createdAt||"",phone:t.recipient||meta.phone||t.phone||"",network:meta.network||meta.network_provider||t.network||"",provider:meta.provider||t.provider||"",plan:meta.plan||meta.plan_name||t.plan||"",smartcard:meta.smartcard||meta.iuc||t.smartcard||"",meterNumber:meta.meterNumber||meta.meter||t.meterNumber||"",meterType:meta.meterType||t.meterType||"",id:t.reference||t.id};
}
async function syncTransactions(){
  const token=localStorage.getItem("boltivAuthToken")||"";
  if(!token)return false;
  try{
    const r=await fetch(API+"/api/transactions",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
    const d=await r.json();
    if(!r.ok||!d.success||!Array.isArray(d.transactions))throw new Error(d.message||"Unable to load transactions");
    localStorage.setItem("boltivTransactions",JSON.stringify(d.transactions.map(normalizeTransaction)));
    return true;
  }catch(e){console.warn("Transaction sync failed:",e);return false;}
}
function icon(type){return type==="airtime"?"☎":type==="data"?"◉":type==="electricity"?"ϟ":type==="cable"?"▣":"₦"}
function title(type){return type==="airtime"?"Airtime Purchase":type==="data"?"Data Purchase":type==="electricity"?"Electricity Payment":type==="cable"?"Cable TV Subscription":"Transaction"}
function number(t){return t.phone||t.meterNumber||t.smartcard||t.number||t.reference||t.id||"BOLTIV TRANSACTION"}
function status(t){return String(t.status||"Successful")}
function statusClass(s){s=s.toLowerCase();if(s.includes("fail"))return"status-failed";if(s.includes("refund"))return"status-refunded";if(s.includes("process"))return"status-processing";if(s.includes("pending")||s.includes("initiated"))return"status-pending";return"status-success"}
function money(v){return"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateValue(t){return t.createdAt||t.date||""}
function formatDate(t){const d=new Date(dateValue(t));return isNaN(d)?"Unknown date":d.toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"})}
function formatTime(t){const d=new Date(dateValue(t));return isNaN(d)?"Unknown time":d.toLocaleTimeString("en-NG",{hour:"2-digit",minute:"2-digit"})}
function matches(t){if(!term)return true;return[t.type,title(t.type),t.phone,t.network,t.provider,t.plan,t.smartcard,t.meterNumber,t.meterType,t.amount,t.id,t.reference,t.date,t.createdAt].filter(Boolean).join(" ").toLowerCase().includes(term.toLowerCase())}

function render(){
let data=getTransactions();
if(filter!=="all")data=data.filter(t=>t.type===filter);
data=data.filter(matches);
data.sort((a,b)=>new Date(dateValue(b))-new Date(dateValue(a)));
count.textContent=data.length;
list.innerHTML="";
if(!data.length){empty.style.display="block";emptyTitle.textContent=term?"No Transaction Found":"No Transactions Yet";emptyText.textContent=term?"We couldn't find a transaction matching your search.":"Your Airtime, Data, Electricity and Cable TV transactions will appear here after you make a purchase.";return}
empty.style.display="none";
data.forEach(t=>{
const item=document.createElement("button");
item.type="button";item.className="transaction-item";
const s=status(t);
item.innerHTML=`<div class="transaction-icon">${icon(t.type)}</div><div class="transaction-info"><div class="transaction-name">${title(t.type)}</div><div class="transaction-number">${number(t)}</div></div><div class="transaction-right"><div class="transaction-amount">${money(t.amount)}</div><div class="transaction-status ${statusClass(s)}">${s.toUpperCase()}</div></div>`;
item.onclick=()=>show(t);
list.appendChild(item);
});
}

function show(t){
const s=status(t);modalIcon.textContent=icon(t.type);modalService.textContent=title(t.type);modalStatus.textContent="● "+s.toUpperCase();modalStatus.className="modal-service-status "+statusClass(s);
let rows=`<div class="detail-row"><span>Service</span><strong>${title(t.type)}</strong></div><div class="detail-row"><span>Amount</span><strong>${money(t.amount)}</strong></div>`;
if(t.type==="airtime")rows+=`<div class="detail-row"><span>Phone</span><strong>${t.phone||"—"}</strong></div><div class="detail-row"><span>Network</span><strong>${t.network||"—"}</strong></div>`;
if(t.type==="data")rows+=`<div class="detail-row"><span>Phone</span><strong>${t.phone||"—"}</strong></div><div class="detail-row"><span>Network</span><strong>${t.network||"—"}</strong></div><div class="detail-row"><span>Data Plan</span><strong>${t.plan||"—"}</strong></div>`;
if(t.type==="cable")rows+=`<div class="detail-row"><span>Provider</span><strong>${t.provider||"—"}</strong></div><div class="detail-row"><span>Smartcard / IUC</span><strong>${t.smartcard||"—"}</strong></div><div class="detail-row"><span>Plan</span><strong>${t.plan||"—"}</strong></div>`;
if(t.type==="electricity")rows+=`<div class="detail-row"><span>Provider</span><strong>${t.provider||"—"}</strong></div><div class="detail-row"><span>Meter</span><strong>${t.meterNumber||"—"}</strong></div><div class="detail-row"><span>Meter Type</span><strong>${t.meterType||"—"}</strong></div>`;
rows+=`<div class="detail-row"><span>Date</span><strong>${formatDate(t)}</strong></div><div class="detail-row"><span>Time</span><strong>${formatTime(t)}</strong></div><div class="detail-row"><span>Reference</span><strong>${t.reference||t.id||"—"}</strong></div>`;if(t.provider_reference)rows+=`<div class="detail-row"><span>Provider Ref</span><strong>${t.provider_reference}</strong></div>`;modalDetails.innerHTML=rows;
const old=document.getElementById("transactionNote");if(old)old.remove();if(["pending","processing","initiated"].includes(String(s).toLowerCase())){const n=document.createElement("div");n.id="transactionNote";n.className="transaction-note";n.textContent="Your wallet has been protected while the provider confirms this transaction. BOLTIV will keep checking the status automatically.";modalDetails.after(n);}else if(String(s).toLowerCase()==="refunded"){const n=document.createElement("div");n.id="transactionNote";n.className="transaction-note";n.textContent="The transaction was not completed and the amount has been returned to your BOLTIV wallet.";modalDetails.after(n);}modal.classList.add("show");}


document.querySelectorAll(".filter-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
search.oninput=()=>{term=search.value.trim();clear.classList.toggle("show",!!term);render()};
clear.onclick=()=>{search.value="";term="";clear.classList.remove("show");search.focus();render()};
document.getElementById("closeModal").onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};
document.querySelectorAll(".nav-item").forEach(i=>i.onclick=()=>location.href=i.dataset.page);
(async()=>{await syncTransactions();render()})();
window.addEventListener("pageshow",async()=>{await syncTransactions();render()});
setInterval(async()=>{const hasPending=getTransactions().some(t=>["pending","processing","initiated"].includes(String(t.status||"").toLowerCase()));if(hasPending){await syncTransactions();render();}},15000);
</script>
</body>
</html>
<!-- END OF BOLTIV TRANSACTIONS -->
