body{
    margin:0;

.form-group{

.label{

}

.input{
    width:100%;

    padding:0 15px;

    border:1px solid #dcdcdc;
    border-radius:11px;

    color:#171717;

    outline:none;

}

}

.auth-btn{
    width:100%;
    height:52px;
    margin-top:4px;

    border:none;
    border-radius:11px;

    background:#D4AF37;
    color:#111111;

    font-size:16.5px;

    transition:
        transform .15s,

.auth-links a{

.auth-links a:first-child{

.auth-links a:hover{

.status-message{

    margin-bottom:17px;

}

.status-message.show{

}

.status-message.error{

@media(max-width:480px){

<body>
<div class="page">
<div class="container">
<div class="auth-page">
<div class="auth-logo"><img alt="BOLTIV logo" src="assets/boltiv-logo.webp"/><span>BOLTIV</span></div>
<div class="auth-tagline">
FAST. SIMPLE. POWERFUL.
</div>
<div class="auth-card">
<h1>
Welcome Back
</h1>
<p class="auth-subtitle">
Login to your BOLTIV account
</p>
<div aria-live="polite" class="status-message" id="statusMessage" role="status">
</div>
<button id="resendVerificationButton" type="button" style="display:none;width:100%;margin:-4px 0 16px;padding:11px;border:1px solid #e1cf91;border-radius:10px;background:#fffaf0;color:#9b760c;font-weight:800;cursor:pointer;">
RESEND VERIFICATION EMAIL
</button>
<div class="form-group">
<label class="label" for="emailInput">

EMAIL

</label>
<input aria-label="Email address" autocomplete="email" class="input" id="emailInput" placeholder="you@example.com" type="email"/>
</div>
<div class="form-group">
<label class="label" for="passwordInput">

PASSWORD

</label>
<div class="password-field">
<input aria-label="Password" autocomplete="current-password" class="input" id="passwordInput" placeholder="Enter your password" type="password"/>
<button aria-controls="passwordInput" aria-label="Show password" class="password-toggle" id="passwordToggle" type="button">SHOW</button>
</div>
</div>
<button class="auth-btn" id="loginButton">

Login

</button>
<div class="auth-links">
<a href="/register">
Create Account
</a>
<a href="/forgot-password">
Forgot Password?
</a>
</div>
</div>
</div>
</div>
</div>
<script>

const API_BASE =
"https://boltiv-backend.onrender.com";


const loginButton =
document.getElementById("loginButton");

const statusMessage =
document.getElementById("statusMessage");

const resendVerificationButton =
document.getElementById("resendVerificationButton");


function showStatus(
    message,
    type="error"
){

    statusMessage.textContent =
        message;

    statusMessage.className =
        "status-message show " +
        type;

}


function clearStatus(){

    statusMessage.textContent = "";

    statusMessage.className =
        "status-message";

}


async function login(){

    clearStatus();

    const email =
        document
        .getElementById("emailInput")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("passwordInput")
        .value;


    if(!email){

        showStatus(
            "Enter your email."
        );

        return;
    }


    if(!/^\S+@\S+\.\S+$/.test(email)){

        showStatus(
            "Enter a valid email address."
        );

        return;
    }


    if(!password){

        showStatus(
            "Enter your password."
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "LOGGING IN...";


    try{

        const response =
            await fetch(
                API_BASE +
                "/api/auth/login",
                {
                    method:"POST",
                    credentials:"include",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


        let data;


        try{

            data =
                await response.json();

        }catch{

            data = {
                success:false,
                message:
                "Invalid server response."
            };

        }


        if(
            !response.ok ||
            !data.success
        ){

            const authError = new Error(
                data.message ||
                "Invalid email or password."
            );
            authError.code = data.code || "";
            throw authError;

        }


        /*
        SAVE AUTH SESSION ONLY.
        NEVER SAVE THE PASSWORD.
        */

        // The backend sets the HttpOnly boltiv_user_session cookie.
        // Keep the returned token only in memory as a same-page fallback;
        // never create a client-readable auth cookie.
        if(data.sessionToken){
            boltivMemoryStorage.setItem("boltivAuthToken", data.sessionToken);
        }


        if(data.user){

            boltivMemoryStorage.setItem(
                "boltivUser",
                JSON.stringify(
                    data.user
                )
            );


            if(data.user.email){

                boltivMemoryStorage.setItem(
                    "boltivUserEmail",
                    data.user.email
                );

            }

        }


        boltivMemoryStorage.setItem(
            "boltivLoggedIn",
            "true"
        );


        showStatus(
            "Login successful. Opening BOLTIV...",
            "success"
        );


        setTimeout(()=>{

            location.href =
                "/dashboard";

        },500);


    }catch(error){

        console.error(
            "BOLTIV LOGIN ERROR:",
            error
        );

        showStatus(
            error.message ||
            "Unable to connect to BOLTIV."
        );

        if(error.code === "EMAIL_NOT_VERIFIED"){
            resendVerificationButton.style.display = "block";
        }


    }finally{

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }

}


resendVerificationButton.onclick = async()=>{
    const email = document.getElementById("emailInput").value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){
        showStatus("Enter the email address you used to register.");
        return;
    }
    resendVerificationButton.disabled=true;
    resendVerificationButton.textContent="SENDING...";
    try{
        const response=await fetch(API_BASE+"/api/auth/resend-verification",{
            method:"POST",
            credentials:"include",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email})
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok||!data.success) throw new Error(data.message||"Unable to resend verification email.");
        showStatus(data.message||"A new verification email has been sent.","success");
    }catch(error){
        showStatus(error.message||"Unable to resend verification email.");
    }finally{
        resendVerificationButton.disabled=false;
        resendVerificationButton.textContent="RESEND VERIFICATION EMAIL";
    }
};

if(new URLSearchParams(location.search).get("verification")==="pending"){
    showStatus("Account created. Check your email and verify your address before signing in.","success");
}

loginButton.onclick = login;


document
.getElementById("passwordInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


// Password visibility controls: this only changes the field type locally.
function setupPasswordToggle(toggleId,inputId){
    const toggle=document.getElementById(toggleId);
    const input=document.getElementById(inputId);
    if(!toggle||!input)return;
    toggle.addEventListener("click",()=>{
        const showing=input.type==="text";
        input.type=showing?"password":"text";
        toggle.textContent=showing?"SHOW":"HIDE";
        toggle.setAttribute("aria-label",showing?"Show password":"Hide password");
        input.focus({preventScroll:true});
    });
}

setupPasswordToggle("passwordToggle","passwordInput");
</script>
</body>
</html>
