<style>
.smart-page{padding-bottom:112px}.smart-topbar{display:flex;align-items:center;justify-content:space-between;margin:24px 0 30px}.smart-back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--t-fg-26231e);font-size:13px;font-weight:800}.smart-back span{width:36px;height:36px;border:1px solid var(--t-bd-eadfba);border-radius:12px;display:grid;place-items:center;background:var(--t-bg-ffffff);color:var(--t-fg-a17b13);font-size:18px}
.smart-hero{position:relative;overflow:hidden;border-radius:28px;padding:30px;background:linear-gradient(135deg,#171717 0%,#211f18 55%,#2d2616 100%);border:1px solid rgba(212,175,55,.48);box-shadow:0 20px 48px rgba(0,0,0,.18);color:#fff}.smart-hero:before{content:"";position:absolute;width:280px;height:280px;right:-80px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.3),transparent 68%)}.smart-hero>*{position:relative;z-index:1}.smart-kicker{font-size:11px;letter-spacing:.18em;font-weight:900;color:#e2c453;margin-bottom:10px}.smart-hero h1{margin:0;max-width:720px;font-size:clamp(31px,7vw,52px);line-height:1.02;letter-spacing:-.04em;color:#fff}.smart-hero p{margin:13px 0 0;max-width:680px;color:rgba(255,255,255,.72);font-size:14px;line-height:1.65}.smart-hero-tag{display:inline-flex;margin-top:20px;padding:9px 12px;border:1px solid rgba(228,206,122,.35);border-radius:999px;background:rgba(212,175,55,.1);color:#e5c65a;font-size:11px;font-weight:800}
.smart-group{margin-top:30px}.smart-group-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:13px}.smart-group-title{margin:0;color:var(--t-fg-26231e);font-size:15px;letter-spacing:.1em;font-weight:900}.smart-group-note{font-size:11px;color:var(--t-fg-817b70);font-weight:700}.smart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.smart-card{position:relative;display:flex;align-items:center;gap:14px;min-width:0;padding:18px;border:1px solid var(--t-bd-eee8d9);border-radius:21px;background:var(--t-bg-ffffff);text-decoration:none;box-shadow:0 9px 24px rgba(25,25,20,.045);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.smart-card:hover{transform:translateY(-2px);border-color:#d9bf61;box-shadow:0 14px 30px rgba(25,25,20,.08)}.smart-card-icon{width:50px;height:50px;flex:0 0 50px;border-radius:16px;display:grid;place-items:center;background:var(--t-bg-fbf4d9);border:1px solid #e4ce7a;color:var(--t-fg-b48a12)}.smart-card-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.smart-card-copy{min-width:0;flex:1}.smart-card-copy strong{display:block;color:var(--t-fg-24211d);font-size:14px}.smart-card-copy small{display:block;margin-top:4px;color:var(--t-fg-888174);font-size:11px;line-height:1.45}.smart-arrow{color:var(--t-fg-a17b13);font-size:21px}.smart-card.soon{background:var(--t-bg-faf8f0);box-shadow:none;opacity:.9}.smart-card.soon:hover{transform:none;border-color:var(--t-bd-eee8d9);box-shadow:none}.smart-badge{display:inline-flex;margin-top:6px;padding:4px 7px;border-radius:999px;background:var(--t-bg-fbf4d9);border:1px solid #e4ce7a;color:var(--t-fg-a17b13);font-size:9px;font-weight:900;letter-spacing:.08em}.smart-footer-note{margin-top:30px;padding:18px 20px;border:1px solid rgba(197,154,28,.2);border-radius:18px;background:var(--t-bg-fffdf7);color:var(--t-fg-716e68);font-size:12px;line-height:1.6}
@media(max-width:560px){.smart-topbar{margin-top:18px;margin-bottom:25px}.smart-hero{padding:24px 20px;border-radius:23px}.smart-hero h1{font-size:34px}.smart-grid{grid-template-columns:1fr;gap:11px}.smart-card{padding:14px;border-radius:18px}.smart-card-icon{width:44px;height:44px;flex-basis:44px;border-radius:13px}.smart-group-note{display:none}}
</style>
<style>
.fav-intro{margin:6px 0 4px;color:var(--t-fg-26231e);font-size:26px;font-weight:900;letter-spacing:-.03em}.fav-sub{margin:0 0 6px;color:var(--t-fg-817b70);font-size:13px;line-height:1.6}
.fav-row .smart-card-copy small{word-break:break-all}.fav-del{flex:0 0 auto;border:1px solid var(--t-bd-eadfba);background:var(--t-bg-ffffff);color:var(--t-fg-b94c4c);border-radius:10px;padding:8px 10px;font-size:10px;font-weight:900;font-family:inherit;cursor:pointer}
.fav-empty{margin-top:24px;padding:20px;border:1px dashed var(--t-bd-eadfba);border-radius:18px;color:var(--t-fg-817b70);font-size:13px;line-height:1.6;text-align:center}.fav-err{color:var(--t-fg-b94c4c);font-size:12px;margin-top:14px}
</style>

<script>document.querySelectorAll('.nav-item').forEach(i=>i.onclick=()=>location.href=i.dataset.page);</script>
<script>
(function(){
var API=window.BOLTIV_API_BASE,list=document.getElementById("favList");
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function hdr(){var t=window.boltivMemoryStorage&&boltivMemoryStorage.getItem("boltivAuthToken");var h={"Content-Type":"application/json"};if(t)h.Authorization="Bearer "+t;return h}
var ICON_PHONE='<svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"></rect><path d="M11 18h2"></path></svg>';
var ICON_TV='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>';
function group(title,items,icon){
  if(!items.length)return"";
  return '<section class="smart-group"><div class="smart-group-head"><h2 class="smart-group-title">'+title+'</h2></div><div class="smart-grid">'+items.map(function(f){
    var meta=f.recipient+(f.network?" · "+f.network:f.provider?" · "+f.provider:"");
    return '<div class="smart-card fav-row"><span class="smart-card-icon">'+icon+'</span><span class="smart-card-copy"><strong>'+esc(f.name)+'</strong><small>'+esc(meta)+'</small></span><button class="fav-del" type="button" data-id="'+Number(f.id)+'" aria-label="Remove '+esc(f.name)+'">REMOVE</button></div>';
  }).join("")+'</div></section>';
}
function render(favs){
  var phones=favs.filter(function(f){return f.kind==="phone"}),cards=favs.filter(function(f){return f.kind==="cable"});
  if(!favs.length){list.innerHTML='<div class="fav-empty">Nothing saved yet.<br/>Open Airtime, Data or Cable TV, enter a number and tap <b>Save this number</b>.</div>';return}
  list.innerHTML=group("PHONE NUMBERS",phones,ICON_PHONE)+group("SMARTCARDS",cards,ICON_TV);
  list.querySelectorAll(".fav-del").forEach(function(b){b.onclick=function(){remove(Number(b.dataset.id),b)}});
}
function load(){
  window.boltivAuthReady.then(function(u){
    if(!u)return;
    return fetch(API+"/api/favorites",{headers:hdr(),cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
      if(!d.success)throw new Error();render(d.favorites||[]);
    });
  }).catch(function(){list.innerHTML='<div class="fav-err">Could not load your saved items. Please try again.</div>'});
}
function remove(id,btn){
  if(!id||!confirm("Remove this saved item?"))return;
  btn.disabled=true;
  fetch(API+"/api/favorites/delete",{method:"POST",headers:hdr(),body:JSON.stringify({id:id})}).then(function(r){return r.json()}).then(function(d){
    if(d.success)load();else{btn.disabled=false;alert(d.message||"Could not remove it. Please try again.")}
  }).catch(function(){btn.disabled=false;alert("Could not remove it. Please try again.")});
}
load();
})();
</script>
