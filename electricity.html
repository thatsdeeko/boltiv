<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f7f7f5">
<title>BOLTIV — Electricity</title>
<link rel="stylesheet" href="style.css">
<script src="transaction-pin.js"></script><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");</script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#ffffff;color:#171717;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}button,input,select{font-family:inherit}button{cursor:pointer}.page{min-height:100vh;padding-bottom:90px}.container{width:min(100% - 30px,480px);margin:auto}.header{display:flex;align-items:center;gap:14px;padding:22px 0}.back{width:40px;height:40px;border:1px solid #e5e5e1;border-radius:13px;background:#ffffff;color:#b8860b;font-size:22px}.title{font-size:20.9px;font-weight:1000}.subtitle{margin-top:4px;color:#666;font-size:10px}.card{padding:20px;border:1px solid #e5e5e1;border-radius:20px;background:#ffffff}.label{display:block;margin-bottom:8px;color:#777;font-size:10px;font-weight:900}.input,.select{width:100%;height:48px;padding:0 14px;border:1px solid #e5e5e1;border-radius:12px;background:#ffffff;color:#171717;outline:none;font-size:12.1px}.input:focus,.select:focus{border-color:#b8860b}.field{margin-bottom:17px}.providers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.provider{padding:13px;border:1px solid #e5e5e1;border-radius:13px;background:#fafaf8;color:#171717;text-align:left}.provider.active{border-color:#b8860b;background:#fffdf4}.provider-name{font-size:11px;font-weight:1000}.provider-text{margin-top:4px;color:#666;font-size:7.7px}.verify{width:100%;height:45px;margin-top:3px;border:1px solid #b8860b;border-radius:12px;background:#fffdf4;color:#b8860b;font-size:11px;font-weight:1000}.amount-box{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border:1px solid #e5e5e1;border-radius:12px;background:#ffffff}.currency{color:#b8860b;font-size:14.3px;font-weight:1000}.amount{width:100%;border:0;outline:0;background:transparent;color:#171717;font-size:14.3px}.summary{display:none;margin-top:17px;padding:15px;border:1px solid #e5e5e1;border-radius:14px;background:#fafaf8}.summary-row{display:flex;justify-content:space-between;margin-bottom:8px;color:#777;font-size:10px}.summary-row:last-child{margin-bottom:0}.summary-row strong{color:#fff}.pay{width:100%;height:50px;margin-top:18px;border:0;border-radius:13px;background:#b8860b;color:#f7f7f5;font-size:11px;font-weight:1000}.pay:disabled{background:#333;color:#777}.message{display:none;margin-top:12px;padding:12px;border-radius:11px;font-size:10px;text-align:center}.error{background:#fff1f1;color:#ff8d8d;border:1px solid #4a2020}.success{background:#122313;color:#8cff9a;border:1px solid #254d29}.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;display:flex;justify-content:center;padding:8px 12px;background:rgba(255,255,255,.97);border-top:1px solid #222}.nav{width:25%;max-width:110px;border:0;background:transparent;color:#555;font-size:7.7px;font-weight:900}.nav.active{color:#b8860b}.nav-icon{display:block;margin-bottom:4px;font-size:18.7px}
</style>
</head>
<body>
<div class="page"><div class="container">
<header class="header"><button class="back" onclick="history.back()">‹</button><div><div class="title">Electricity</div><div class="subtitle">Pay your electricity bill</div></div></header>
<section class="card">
<div class="field"><label class="label">ELECTRICITY PROVIDER</label><div class="providers">
<button class="provider active" data-provider="IKEDC"><div class="provider-name">IKEDC</div><div class="provider-text">Ikeja Electric</div></button>
<button class="provider" data-provider="EKEDC"><div class="provider-name">EKEDC</div><div class="provider-text">Eko Electric</div></button>
<button class="provider" data-provider="AEDC"><div class="provider-name">AEDC</div><div class="provider-text">Abuja Electric</div></button>
<button class="provider" data-provider="KEDCO"><div class="provider-name">KEDCO</div><div class="provider-text">Kano Electric</div></button>
</div></div>
<div class="field"><label class="label">METER TYPE</label><select id="meterType" class="select"><option value="Prepaid">Prepaid</option><option value="Postpaid">Postpaid</option></select></div>
<div class="field"><label class="label">METER NUMBER</label><input id="meter" class="input" type="tel" inputmode="numeric" placeholder="Enter meter number"></div>
<button id="verify" class="verify">VERIFY METER</button>
<div class="field" style="margin-top:18px"><label class="label">AMOUNT</label><div class="amount-box"><span class="currency">₦</span><input id="amount" class="amount" type="number" inputmode="decimal" min="100" placeholder="Enter amount"></div></div>
<div id="summary" class="summary"><div class="summary-row"><span>Provider</span><strong id="sumProvider">-</strong></div><div class="summary-row"><span>Meter</span><strong id="sumMeter">-</strong></div><div class="summary-row"><span>Type</span><strong id="sumType">-</strong></div><div class="summary-row"><span>Amount</span><strong id="sumAmount">₦0.00</strong></div></div>
<button id="pay" class="pay" disabled>PAY ELECTRICITY</button><div id="message" class="message"></div>
</section>
</div></div>

<nav class="bottom-nav">
<button class="nav" onclick="location.href='index.html'"><span class="nav-icon">⌂</span>Home</button>
<button class="nav" onclick="location.href='wallet.html'"><span class="nav-icon">₦</span>Wallet</button>
<button class="nav" onclick="location.href='transactions.html'"><span class="nav-icon">↯</span>Activity</button>
<button class="nav" onclick="location.href='profile.html'"><span class="nav-icon">◉</span>Profile</button>
</nav>

<script>
const $=id=>document.getElementById(id),providers=document.querySelectorAll(".provider");
let selectedProvider="IKEDC",verified=false;
const plans={};
function money(v){return"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function balance(){return Number(localStorage.getItem("boltivWalletBalance")||0)}
function setBalance(v){localStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(v)||0)))}
function transactions(){try{let x=JSON.parse(localStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function save(t){let x=transactions();x.unshift(t);localStorage.setItem("boltivTransactions",JSON.stringify(x))}
function msg(t,c){$("message").textContent=t;$("message").className="message "+c;$("message").style.display="block"}
function check(){let v=Number($("amount").value);$("pay").disabled=!(verified&&v>=100);if(verified&&v>=100)$("sumAmount").textContent=money(v)}
providers.forEach(b=>b.onclick=()=>{providers.forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedProvider=b.dataset.provider;verified=false;$("summary").style.display="none";$("pay").disabled=true});
$("verify").onclick=()=>{let n=$("meter").value.trim();if(n.length<8)return msg("Enter a valid meter number.","error");verified=true;$("sumProvider").textContent=selectedProvider;$("sumMeter").textContent=n;$("sumType").textContent=$("meterType").value;$("summary").style.display="block";check();msg("Meter verified successfully.","success")};
$("amount").addEventListener("input",check);
$("pay").onclick=async()=>{let v=Number($("amount").value),n=$("meter").value.trim();if(!verified)return msg("Please verify your meter first.","error");if(v<100)return msg("Minimum electricity payment is ₦100.","error");const pin=await BoltivTransactionPin.request();if(!pin)return;$("pay").disabled=true;msg("Processing your electricity payment...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/electricity",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,meterNumber:n,meterType:$("meterType").value,amount:v,service:"electricity",providerPayload:{service:"electricity",provider:selectedProvider,meterNumber:n,meterType:$("meterType").value,amount:v},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin:pin})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process electricity payment.");msg(`${d.message||"Electricity request received."} Reference: ${d.reference||"-"}`,"success");}catch(e){msg(e.message||"Electricity payment failed.","error");}finally{$("pay").disabled=false}};
</script>
</body>
</html>
