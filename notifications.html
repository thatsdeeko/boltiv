<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLTIV — Notifications</title><link rel="stylesheet" href="style.css"><style>.page{padding-bottom:100px}.header{display:flex;align-items:center;gap:12px;padding:20px 0}.back{width:40px;height:40px;border:1px solid #e5e5e1;border-radius:12px;background:#fff;color:#b8860b;font-size:22px}.title{font-size:21px;font-weight:1000}.list{display:grid;gap:10px}.item{padding:16px;border:1px solid #e5e5e1;border-radius:17px;background:#fff}.item.unread{border-color:#ead99b;background:#fffdf4}.item h3{margin:0;font-size:14px}.item p{margin:6px 0 0;color:#666;font-size:11px;line-height:1.55}.item small{display:block;margin-top:8px;color:#999;font-size:9px}</style></head><body><div class="page"><div class="container"><header class="header"><button class="back" onclick="history.back()">‹</button><div><div class="title">Notifications</div><div style="color:#777;font-size:10px">ACCOUNT & TRANSACTION UPDATES</div></div></header><div id="list" class="list"><div class="item">Loading notifications...</div></div></div></div><script>const token=localStorage.getItem("boltivAuthToken")||"",API="https://boltiv-backend.onrender.com";async function load(){const r=await fetch(API+"/api/notifications",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok||!d.success){list.innerHTML='<div class="item">Unable to load notifications.</div>';return}list.innerHTML=d.notifications.length?d.notifications.map(n=>`<article class="item ${n.read?"":"unread"}"><h3>${n.title}</h3><p>${n.message}</p><small>${new Date(n.created_at).toLocaleString("en-NG")}</small></article>`).join(""):'<div class="item">No notifications yet.</div>';if(d.notifications.some(n=>!n.read))fetch(API+"/api/notifications/read",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({})})}load();</script></body></html>
