// Cable TV logic
const providers=document.querySelectorAll(".provider"),smartcard=document.getElementById("smartcard"),plan=document.getElementById("plan"),verify=document.getElementById("verify"),pay=document.getElementById("pay"),summary=document.getElementById("summary"),message=document.getElementById("message");let selectedProvider="DSTV",verified=false;
const plans={Compact:19000,Confam:11000,Yanga:6000,Jolli:5800,Max:8500},money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2}),getBalance=()=>Number(boltivMemoryStorage.getItem("boltivWalletBalance")||0),setBalance=v=>boltivMemoryStorage.setItem("boltivWalletBalance",String(Math.max(0,Number(v)||0)));
function getTransactions(){try{let x=JSON.parse(boltivMemoryStorage.getItem("boltivTransactions")||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveTransaction(x){let t=getTransactions();t.unshift(x);boltivMemoryStorage.setItem("boltivTransactions",JSON.stringify(t))}
function showMessage(t,c){message.textContent=t;message.className="message "+c;message.style.display="block"}
const modal=document.getElementById("boltivModal"),mi=document.getElementById("modalIcon"),ms=document.getElementById("modalStatus"),mt=document.getElementById("modalTitle"),mm=document.getElementById("modalMessage"),md=document.getElementById("modalDetails"),mb=document.getElementById("modalButton");

function closeModal(){modal.classList.remove("show");mb.style.display="block"}
mb.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};
providers.forEach(b=>b.onclick=()=>{providers.forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedProvider=b.dataset.provider;verified=false;summary.style.display="none";pay.disabled=true;message.style.display="none"});
verify.onclick=async()=>{let n=smartcard.value.trim();if(!/^\d{8,20}$/.test(n))return showMessage("Enter a valid smartcard or IUC number.","error");verify.disabled=true;showMessage("Verifying with your cable provider...","success");try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/cable/verify",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,smartcard:n})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Cable number could not be verified.");verified=true;updateSummary();checkPayment();const name=d.customer?.customer_name||d.customer?.name||d.customer?.customerName||"";showMessage(name?`Verified: ${name}`:"Number verified successfully.","success")}catch(e){verified=false;pay.disabled=true;showMessage(e.message||"Cable verification failed.","error")}finally{verify.disabled=false}};
plan.onchange=()=>{if(verified)updateSummary();checkPayment()};
function updateSummary(){let v=plans[plan.value]||0;document.getElementById("sumProvider").textContent=selectedProvider;document.getElementById("sumNumber").textContent=smartcard.value.trim();document.getElementById("sumPlan").textContent=plan.value||"-";document.getElementById("sumAmount").textContent=money(v);summary.style.display="block"}
function checkPayment(){pay.disabled=!(verified&&plans[plan.value])}
function payDetails(value,number){return`<div class="modal-detail"><span>Service</span><strong>Cable TV</strong></div><div class="modal-detail"><span>Provider</span><strong>${selectedProvider}</strong></div><div class="modal-detail"><span>Number</span><strong>${number}</strong></div><div class="modal-detail"><span>Plan</span><strong>${plan.value||"-"}</strong></div><div class="modal-detail"><span>Amount</span><strong>${money(value)}</strong></div>`}
pay.onclick=async()=>{let value=plans[plan.value],number=smartcard.value.trim();if(!verified)return showMessage("Please verify your smartcard or IUC number first.","error");if(!value)return showMessage("Select a subscription plan.","error");pay.disabled=true;const transactionPin=await boltivGetTransactionPin();if(!transactionPin){pay.disabled=false;return;}showModal("processing","Processing Payment","Connecting to BOLTIV...");mb.style.display="none";try{const r=await fetch("https://boltiv-backend.onrender.com/api/vtu/cable",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({provider:selectedProvider,smartcard:number,plan:plan.value,amount:value,service:"cable",providerPayload:{service:"cable",provider:selectedProvider,smartcard:number,plan:plan.value,amount:value},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin:transactionPin})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process cable payment.");showModal("success","Cable TV Renewed",d.message||"Your cable TV subscription was renewed successfully.",payDetails(value,number)+(d.reference?`<div class="modal-detail"><span>Reference</span><strong>${d.reference}</strong></div>`:""));mb.style.display="block";}catch(e){showModal("failed","Payment Failed",e.message||"Cable payment failed.",payDetails(value,number));mb.style.display="block";}finally{pay.disabled=false}};
