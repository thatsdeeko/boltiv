<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>BOLTIV — Admin Login</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:#050505;
color:#fff;
font-family:Arial,sans-serif;
}

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:390px;
padding:28px;
background:#101010;
border:1px solid #292929;
border-radius:22px;
box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.logo{
text-align:center;
color:#d4af37;
font-size:30px;
font-weight:900;
letter-spacing:4px;
}

.title{
text-align:center;
margin-top:10px;
font-size:15px;
font-weight:900;
}

.sub{
text-align:center;
margin:7px 0 25px;
color:#666;
font-size:9px;
letter-spacing:1px;
}

label{
display:block;
margin-bottom:7px;
color:#888;
font-size:8px;
font-weight:700;
}

input{
width:100%;
height:48px;
margin-bottom:15px;
padding:0 14px;
border:1px solid #292929;
border-radius:10px;
outline:none;
background:#080808;
color:#fff;
font-size:14px;
}

input:focus{
border-color:#d4af37;
}

button{
width:100%;
height:48px;
border:0;
border-radius:10px;
background:#d4af37;
color:#050505;
font-weight:900;
cursor:pointer;
}

button:disabled{
opacity:.55;
}

.message{
display:none;
margin-top:14px;
padding:11px;
border-radius:10px;
text-align:center;
font-size:9px;
line-height:1.5;
}

.message.show{
display:block;
}

.message.error{
color:#ff8585;
background:#211010;
border:1px solid #542323;
}

.message.success{
color:#d4af37;
background:#17140b;
border:1px solid #3a3016;
}
</style>
</head>

<body>

<div class="login">
<div class="card">

<div class="logo">BOLTIV</div>

<div class="title">
ADMIN CONTROL CENTER
</div>

<div class="sub">
SECURE ADMINISTRATOR ACCESS
</div>

<label for="email">
ADMIN EMAIL
</label>

<input
id="email"
type="email"
autocomplete="username"
placeholder="Admin email">

<label for="password">
ADMIN PASSWORD
</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Admin password">

<button
id="loginButton"
type="button">
LOGIN TO ADMIN
</button>

<div
id="message"
class="message">
</div>

</div>
</div>

<script>
const API=
"https://boltiv-backend.onrender.com";

const email=
document.getElementById("email");

const password=
document.getElementById("password");

const button=
document.getElementById("loginButton");

const message=
document.getElementById("message");

function showMessage(text,type="error"){

message.textContent=text;

message.className=
"message show "+type;

}

async function login(){

const adminEmail=
email.value.trim().toLowerCase();

const adminPassword=
password.value;

message.className="message";
message.textContent="";

if(!adminEmail){

showMessage(
"Enter your admin email."
);

email.focus();
return;
}

if(!adminPassword){

showMessage(
"Enter your admin password."
);

password.focus();
return;
}

button.disabled=true;
button.textContent="LOGGING IN...";

try{

const response=
await fetch(
API+"/api/admin/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json",
"Accept":
"application/json"
},

body:JSON.stringify({
email:adminEmail,
password:adminPassword
})
}
);

const data=
await response.json();

if(!response.ok||!data.success){

throw new Error(
data.message||
"Admin login failed."
);

}

if(!data.token){

throw new Error(
"No admin session token was returned."
);

}

localStorage.setItem(
"boltivAdminToken",
data.token
);

localStorage.setItem(
"boltivAdminEmail",
data.admin?.email||
adminEmail
);

showMessage(
"Login successful. Opening dashboard...",
"success"
);

setTimeout(function(){

window.location.href=
"admin.html";

},700);

}catch(error){

console.error(
"BOLTIV ADMIN LOGIN ERROR:",
error
);

showMessage(
error.message||
"Unable to connect to BOLTIV."
);

}finally{

button.disabled=false;
button.textContent=
"LOGIN TO ADMIN";

}

}

button.onclick=login;

password.onkeydown=
function(event){

if(event.key==="Enter"){
login();
}

};

email.onkeydown=
function(event){

if(event.key==="Enter"){
password.focus();
}

};
</script>

</body>
</html>
