<style>

*{box-sizing:border-box}body{margin:0;background:var(--sf);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.nw{flex-wrap:nowrap}.row>.f{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ok{color:#15803d;font-weight:700}.no{color:#b42318;font-weight:700}

.tg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}.tc{position:relative;border:2px solid var(--ln);border-radius:20px;padding:12px;background:var(--cd);text-align:left;cursor:pointer;font:inherit;color:inherit;display:block;width:100%}.tc.on{border-color:var(--g);box-shadow:0 0 0 4px rgba(201,162,39,.18)}

.tm{border-radius:12px;overflow:hidden;aspect-ratio:16/11;position:relative;border:1px solid rgba(0,0,0,.08)}.tm .a{position:absolute;left:0;right:0;top:0;height:9%;opacity:.9}.tm .h{position:absolute;left:8%;top:20%;width:84%;height:38%;border-radius:6px}.tm .p{position:absolute;left:8%;top:62%;width:26%;height:26%;border-radius:5px;box-shadow:34px 0 0 -0px rgba(0,0,0,.0)}
.tm .p2,.tm .p3{position:absolute;top:62%;width:26%;height:26%;border-radius:5px}.tm .p2{left:37%}.tm .p3{left:66%}.tm .pill{position:absolute;left:12%;top:40%;width:20%;height:7%;border-radius:99px}
.tm.t-market .h,.tm.t-studio .h{width:52%}.tm.t-folio .h{height:8%;top:26%;width:70%;border-radius:2px}.tm.t-folio .pill{top:48%}.tm.t-bistro .h{left:20%;width:60%}.tm.t-glow .h{border-radius:18px}.tm.t-atelier .h{height:44%}
/* site cards */
.sc{display:flex;gap:14px;align-items:center}.sc .tm{width:92px;flex:none}.sc .m{min-width:0;flex:1}.sc h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc .u{font-size:13px;color:var(--gd);font-weight:700;word-break:break-all}
.stats3{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--mu)}.stats3 b{color:var(--tx)}
/* editor */
.ed{display:block}.pv{display:none}.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}.bar a{flex:1;text-align:center;font-size:12px;font-weight:800;padding:9px 2px;border-radius:14px;color:var(--mu);cursor:pointer}.bar a.on{color:#1a1403;background:linear-gradient(135deg,var(--g2),var(--g))}
.frame{border:10px solid #14110a;border-radius:38px;overflow:hidden;background:#fff;height:min(76vh,740px);width:100%;max-width:392px;margin:auto;box-shadow:0 22px 50px rgba(0,0,0,.25)}.frame iframe{width:100%;height:100%;border:0}
@media(min-width:900px){.split{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:28px;align-items:start}.pv{display:block;position:sticky;top:76px}.bar{position:static;border:0;background:none;padding:0;gap:6px;margin:6px 0 4px;justify-content:flex-start}.bar a{flex:0 0 auto;padding:10px 20px}body{padding-bottom:30px}.mobonly{display:none}}
@media(max-width:899px){body.t-preview .ed{display:none}body.t-preview .pv{display:block}}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--cd);box-shadow:0 0 0 1.5px var(--ln);cursor:pointer;position:relative;overflow:hidden;padding:0}.sw button.on{box-shadow:0 0 0 2.5px var(--g)}.sw i{position:absolute;inset:50% 0 0 0}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.it:last-child{border:0}.it .m{flex:1;min-width:0}.it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;border:1px solid var(--ln);background:var(--sf);flex:none}
.sec{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.sec:last-child{border:0}.sec input[type=text]{min-height:42px;flex:1}.ar{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font-size:16px;cursor:pointer;flex:none}.ar:disabled{opacity:.3}
.tg2{position:relative;width:48px;height:28px;flex:none;margin:0}.tg2 input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;min-height:0}.tg2 span{position:absolute;inset:0;border-radius:99px;background:#cfc8b4;transition:.2s;pointer-events:none}.tg2 span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg2 input:checked+span{background:var(--g)}.tg2 input:checked+span:after{left:23px}
.banner{display:flex;gap:12px;align-items:center;background:#fff7dc;border:1px solid #f0dc99;color:#6b5206;border-radius:18px;padding:14px;margin:14px 0}html[data-theme=dark] .banner{background:#2a2208;border-color:#5a4a10;color:#f3e3a0}
.modal{position:fixed;inset:0;background:rgba(10,9,5,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:var(--cd);width:min(560px,100%);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:26px}}
.full{position:fixed;inset:0;z-index:22;background:var(--sf);display:flex;flex-direction:column}.full .fh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);padding-top:calc(10px + env(safe-area-inset-top,0px))}.full iframe{flex:1;border:0;width:100%;background:#fff}.full .ff{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.wiz{position:fixed;inset:0;z-index:21;background:var(--sf);overflow:auto;padding-top:env(safe-area-inset-top,0)}.steps{display:flex;gap:6px;margin:6px 0 16px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--ln)}.steps i.on{background:var(--g)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#14110a;color:#f5e7b0;padding:12px 18px;border-radius:99px;z-index:40;font-size:14px;font-weight:600;max-width:92vw;text-align:center}
.stat b{display:block;font-size:28px;letter-spacing:-.02em}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.spark{display:flex;align-items:flex-end;gap:2px;height:80px}.spark i{flex:1;background:linear-gradient(var(--g2),var(--g));border-radius:4px 4px 0 0;min-height:3px}

<body>
<header class="top"><div class="w ti" id="hd"><span class="logo">BOLTIV <span>LINK</span></span></div></header>
<div class="w" id="app"><div class="card">Loading…</div></div>
<nav class="bar" id="bar" hidden></nav>
<div id="layer"></div>
<script>
(function(){'use strict';
const API=window.BOLTIV_API_BASE,ms=window.boltivMemoryStorage||window.localStorage,$=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₦'+Number(v||0).toLocaleString('en-NG');
const HEADF=['Playfair Display','Cormorant Garamond','DM Serif Display','Fraunces','Syne','Space Grotesk','Montserrat','Poppins','Outfit','Manrope','Inter','DM Sans','Nunito','Lora'];
const BODYF=['Inter','DM Sans','Nunito','Manrope','Lora','Outfit','Poppins'];
const SECS=['highlights','products','services','about','gallery','testimonials','contact'];
const SECN={highlights:'Highlights',products:'Products',services:'Services',about:'About',gallery:'Gallery',testimonials:'Testimonials',contact:'Contact'};
let S={auth:true,sites:[],templates:[],pricing:{price:5000,days:30,domain:'boltiv.ng',maxSites:10},balance:0,imgBase:'',view:'home',tab:'design',cur:null,stats:null},saveT,prevT,dirty=false,seq=0,W=null;
const qs=new URLSearchParams(location.search);
async function api(path,o){o=o||{};const h={Accept:'application/json'};const tok=ms.getItem&&ms.getItem('boltivAuthToken');if(tok)h.Authorization='Bearer '+tok;let body;
 if(o.body!==undefined){h['Content-Type']='application/json';body=JSON.stringify(o.body)}
 let r;try{r=await fetch(API+path,{method:o.method||(body?'POST':'GET'),headers:h,body,cache:'no-store',credentials:'include'})}catch(e){throw new Error('No connection. Check your internet and try again.')}
 const d=await r.json().catch(()=>({success:false,message:'Unexpected response.'}));
 if(r.status===401){const e=new Error('auth');e.auth=true;throw e}
 if(!r.ok||d.success===false){const e=new Error(d.message||'Request failed.');e.data=d;throw e}return d}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
function sheet(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet">'+h+'</div>';m.addEventListener('click',e=>{if(e.target===m)m.remove()});$('#layer').appendChild(m);return m}
const closeAll=()=>{$('#layer').innerHTML=''};
const D=()=>S.cur.draft;
const TPL=id=>S.templates.find(t=>t.id===id)||S.templates[0]||{palettes:[{primary:'#c9a227',accent:'#14110a',bg:'#faf8f2',text:'#171717'}]};
const mock=(c,id)=>'<div class="tm t-'+esc(id)+'" style="background:'+c.bg+'"><i class="a" style="background:'+c.text+'18"></i><i class="h" style="background:linear-gradient(135deg,'+c.accent+','+c.primary+')"></i><i class="pill" style="background:'+c.primary+'"></i><i class="p" style="background:'+c.text+'14"></i><i class="p2" style="background:'+c.text+'14"></i><i class="p3" style="background:'+c.text+'14"></i></div>';
function stateChip(s){return s.state==='active'?'<span class="chip '+(s.daysLeft<=7?'w2':'')+'">'+s.daysLeft+' days left</span>':s.state==='expired'?'<span class="chip x">Offline</span>':'<span class="chip n">Suspended</span>'}
async function load(keep){
 try{const d=await api('/api/link/me');S.sites=d.sites;S.templates=d.templates;S.pricing=d.pricing;S.balance=d.walletBalance;S.imgBase=d.imgBase}
 catch(e){if(e.auth){S.auth=false;try{const [p,t]=await Promise.all([api('/api/link/pricing'),api('/api/link/templates')]);S.pricing=p;S.templates=t.templates}catch(_){}}else{$('#app').innerHTML='<div class="card">'+esc(e.message)+'</div>';return}}
 if(keep&&S.cur){S.cur.site=S.sites.find(x=>x.id===S.cur.site.id)||S.cur.site}
 else if(S.auth&&qs.get('site')){const id=Number(qs.get('site'));if(S.sites.some(x=>x.id===id)){await openSite(id,qs.get('tab'));return}}
 render();
 const nm=(qs.get('name')||ms.getItem&&ms.getItem('boltivLinkPending')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,30);
 if(nm&&!W){qs.delete('name');if(S.auth){ms.removeItem&&ms.removeItem('boltivLinkPending');startWizard(nm)}else{ms.setItem&&ms.setItem('boltivLinkPending',nm)}}}
function render(){S.view==='site'&&S.cur?renderSite():renderHome()}
/* ---------- home ---------- */
function renderHome(){
 document.body.className='';$('#bar').hidden=true;
 $('#hd').innerHTML='<span class="logo">BOLTIV <span>LINK</span></span><span class="sp"></span>'+(S.auth?'<a class="sm" href="/dashboard" style="color:var(--mu);font-weight:700;text-decoration:none">Dashboard</a>':'<a class="btn s" href="/login">Sign in</a>');
 const tg='<div class="tg">'+S.templates.map(t=>'<div class="tc">'+mock(t.palettes[0],t.id)+'<b>'+esc(t.name)+'</b><span class="cat">'+esc(t.category)+'</span><small>'+esc(t.blurb)+'</small><div class="dots">'+t.palettes.map(p=>'<i style="background:'+p.primary+'"></i>').join('')+'</div><button class="btn o s" style="margin-top:12px;width:100%" data-demo="'+t.id+'">Preview</button></div>').join('')+'</div>';
 const intro='<section class="hero"><div class="kick">BOLTIV LINK</div><h1>Your business, beautifully online.</h1><p>Choose a professional design, add your products and photos, and go live at <b style="color:#fff">yourname.'+esc(S.pricing.domain)+'</b> in minutes. ₦'+Number(S.pricing.price).toLocaleString('en-NG')+' for '+S.pricing.days+' days.</p><div class="row" style="margin-top:18px"><button class="btn" data-a="new">'+(S.sites.length?'Create another website':'Create my website')+'</button><a class="btn o s" style="color:#fff;border-color:rgba(255,255,255,.35)" href="/boltiv-link">How it works</a></div></section>';
 let mine='';
 if(S.sites.length){mine='<h2 style="margin-top:26px">My websites <span class="sm" style="color:var(--mu);font-weight:600">('+S.sites.length+')</span></h2>'+S.sites.map(s=>{const c=s.colors||TPL(s.template).palettes[0];return '<div class="card sc" data-open="'+s.id+'" style="cursor:pointer">'+mock(c,s.template||'atelier')+'<div class="m"><div class="row nw" style="justify-content:space-between"><h3>'+esc(s.name)+'</h3>'+stateChip(s)+'</div><div class="u">'+esc(s.url.replace('https://',''))+'</div><div class="stats3"><span><b>'+s.views30+'</b> views · 30d</span><span>'+(s.publishedAt?'Live':'Not published')+'</span></div><div class="row" style="margin-top:12px"><button class="btn s" data-open="'+s.id+'">Manage</button>'+(s.state!=='active'?'<button class="btn k s" data-renew="'+s.id+'">Renew</button>':'')+'</div></div></div>'}).join('')}
 $('#app').innerHTML=intro+mine+'<h2 style="margin-top:26px">Designs for every kind of business</h2><p class="sm">Pick a starting point. You can change colours, fonts, layout and sections any time.</p>'+tg;
}
/* ---------- create wizard ---------- */
function startWizard(name){
 if(!S.auth){ms.setItem&&ms.setItem('boltivLinkPending',name||'');location.href='/login';return}
 if(S.sites.length>=S.pricing.maxSites){toast('You can have up to '+S.pricing.maxSites+' websites.');return}
 W={step:1,name:name||'',ok:false,tpl:null,biz:'',idem:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random())};drawWizard();if(W.name)checkName()}
function drawWizard(){
 let el=$('#wiz');if(!el){el=document.createElement('div');el.id='wiz';el.className='wiz';$('#layer').appendChild(el)}
 const stp='<div class="steps">'+[1,2,3].map(i=>'<i class="'+(i<=W.step?'on':'')+'"></i>').join('')+'</div>';
 let h='<div class="w" style="max-width:640px;padding:10px 0 40px"><div class="row nw"><button class="back" data-w="back">← '+(W.step===1?'Close':'Back')+'</button><span class="sp"></span><span class="sm">Step '+W.step+' of 3</span></div>'+stp;
 if(W.step===1)h+='<h1 style="font-size:clamp(28px,7vw,40px)">Choose your website name</h1><p>This becomes your address. It is reserved for you permanently.</p><label>Website name</label><div class="row nw"><input id="wn" class="f" placeholder="deekostore" autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="30" value="'+esc(W.name)+'"><b class="sm">.'+esc(S.pricing.domain)+'</b></div><div id="wc" class="sm" style="min-height:24px;margin-top:8px"></div><button class="btn" id="wnext" style="width:100%;margin-top:14px" '+(W.ok?'':'disabled')+'>Continue</button>';
 if(W.step===2)h+='<h1 style="font-size:clamp(28px,7vw,40px)">Pick a design</h1><p>A starting point built for your kind of business. Everything is customisable afterwards.</p><div class="tg" style="margin-top:14px">'+S.templates.map(t=>'<div class="tc '+(W.tpl===t.id?'on':'')+'" data-pick="'+t.id+'">'+mock(t.palettes[0],t.id)+'<b>'+esc(t.name)+'</b><span class="cat">'+esc(t.category)+'</span><small>'+esc(t.blurb)+'</small><div class="row nw" style="margin-top:10px"><button class="btn o s f" data-demo="'+t.id+'">Preview</button><button class="btn s f" data-pick="'+t.id+'">'+(W.tpl===t.id?'Selected ✓':'Choose')+'</button></div></div>').join('')+'</div>';

async function publish(btn){clearTimeout(saveT);if(btn){btn.disabled=true}
 const go=async force=>{try{if(dirty)await save();const r=await api('/api/link/publish',{body:{id:S.cur.site.id,force:!!force}});toast('Your website is live!');closeAll();const d=await api('/api/link/site?id='+S.cur.site.id);S.cur.site=d.site;S.cur.samples=d.samples;S.sites=S.sites.map(x=>x.id===d.site.id?Object.assign(x,d.site):x);renderSite()}
  catch(er){if(btn)btn.disabled=false;if(er.data&&er.data.code==='sample_content'){const m=sheet('<h2>Sample content found</h2><p>'+esc(er.message)+' Visitors will see it. Do you want to replace it first?</p><div class="row"><button class="btn o f" id="a">Publish anyway</button><button class="btn f" id="b">Edit my content</button></div>');m.querySelector('#a').onclick=()=>go(true);m.querySelector('#b').onclick=()=>{closeAll();S.tab='content';renderSite()}}else toast(er.message)}};
 go(false)}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{const T=e.target;
 let x=T.closest('[data-demo]');if(x){e.stopPropagation();demo(x.dataset.demo);return}
 x=T.closest('[data-pick]');if(x&&W){W.tpl=x.dataset.pick;W.step=3;drawWizard();return}
 x=T.closest('[data-w]');if(x&&W){if(W.step===1){W=null;closeAll()}else{W.step--;drawWizard()}return}
 if(T.closest('#wnext')&&W){W.step=2;drawWizard();return}
 if(T.closest('#wpay')&&W){W.biz=$('#wb').value;payNew(T.closest('#wpay'));return}
 x=T.closest('[data-renew]');if(x){e.stopPropagation();renewSheet(Number(x.dataset.renew));return}
 x=T.closest('[data-open]');if(x){await openSite(Number(x.dataset.open));return}
 x=T.closest('[data-t]');if(x&&S.cur){S.tab=x.dataset.t;history.replaceState(null,'','/link?site='+S.cur.site.id+'&tab='+S.tab);renderSite();scrollTo(0,0);return}
 x=T.closest('[data-tpl]');if(x&&S.cur){const id=x.dataset.tpl;if(id!==D().theme.template){const m=sheet('<h2>Switch to '+esc(TPL(id).name)+'?</h2><p>Your content, photos and contact details are kept. Colours, fonts and layout will change to this design.</p><div class="row"><button class="btn o f" id="c">Cancel</button><button class="btn f" id="y">Switch design</button></div>');m.querySelector('#c').onclick=closeAll;m.querySelector('#y').onclick=()=>{closeAll();applyTemplate(id)}}return}
 x=T.closest('[data-pal]');if(x&&S.cur){const p=TPL(D().theme.template).palettes[Number(x.dataset.pal)];Object.assign(D().theme,{primary:p.primary,accent:p.accent,bg:p.bg,text:p.text,bgGradientTo:p.to||p.bg});changed();renderSite();return}
 x=T.closest('[data-mv]');if(x&&S.cur){const p=x.dataset.mv.split(':'),i=Number(p[0]),j=i+Number(p[1]),o=D().order;if(j>=0&&j<o.length){[o[i],o[j]]=[o[j],o[i]];changed();renderSite()}return}
 x=T.closest('[data-edit]');if(x&&S.cur){const p=x.dataset.edit.split(':');itemSheet(p[0],p[1]==='new'?'new':Number(p[1]));return}
 x=T.closest('[data-gdel]');if(x&&S.cur){D().gallery.splice(Number(x.dataset.gdel),1);changed();renderSite();return}
 x=T.closest('[data-clear]');if(x&&S.cur){set(x.dataset.clear,'');renderSite();return}
 x=T.closest('[data-up]');if(x&&S.cur){const p=x.dataset.up;x.disabled=true;try{const id=await pickImage(p==='brand.logo'?400:1400);if(p==='gallery+'){D().gallery.push(id);changed()}else set(p,id);renderSite()}catch(er){if(er.message)toast(er.message);x.disabled=false}return}
 x=T.closest('[data-a]');if(!x)return;const a=x.dataset.a;
 if(a==='new')startWizard('');if(a==='home')goHome();if(a==='publish')publish(x);
 if(a==='share'){const u=S.cur.site.url;try{if(navigator.share)await navigator.share({title:D().brand.name,url:u});else{await navigator.clipboard.writeText(u);toast('Link copied')}}catch(_){}}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-p]');if(!el||!S.cur)return;if(el.dataset.p.startsWith('labels.')){D().labels=D().labels||{};}set(el.dataset.p,el.dataset.n?Number(el.value):el.value)});
document.addEventListener('change',e=>{const el=e.target;if(el.matches&&el.matches('[data-sec]')&&S.cur){D().sections[el.dataset.sec]=el.checked;changed();return}
 if(el.id==='swsite'){openSite(Number(el.value));return}
 if(el.matches&&el.matches('select[data-re]'))renderSite()});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
load()})();
</script>
</body>
</html>
