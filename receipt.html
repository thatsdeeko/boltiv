<!DOCTYPE html>

<html lang="en"><head><base href="/"><meta content="noindex,nofollow" name="robots"/><script src="boltiv-client.js?v=20260820-nostorage"></script><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>BOLTIV — Receipt</title><link href="style.css?v=20260821-servicecenter" rel="stylesheet"/><style>.receipt{padding:28px 0 110px}.receipt-card{background:#fff;border:1px solid #e5e5e1;border-radius:24px;padding:24px;box-shadow:0 15px 40px rgba(0,0,0,.08)}.logo{text-align:center;color:#D4AF37;font-size:34px;font-weight:1000;letter-spacing:4px}.logo img{width:58px;height:70px;object-fit:contain;display:block;margin:0 auto 5px}.logo span{display:block}.status{margin:18px auto;padding:9px 12px;border-radius:20px;background:#fff9e6;color:#D4AF37;text-align:center;font-weight:900;font-size:12px}.row{display:flex;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid #eee}.row span{color:#777;font-size:12px}.row strong{text-align:right;font-size:13px;word-break:break-word}.actions{display:flex;gap:10px;margin-top:20px}.actions button,.actions a{flex:1;padding:14px;border:0;border-radius:12px;text-align:center;font-weight:900;text-decoration:none}.primary{background:#D4AF37;color:#fff}.secondary{background:#fff9e6;color:#D4AF37;border:1px solid #ead99b!important}</style><link href="assets/boltiv-icon.webp" rel="icon" type="image/png"/>
<style>/* Phase 3 accessibility polish */ :focus-visible{outline:3px solid #D4AF37;outline-offset:3px} @media (prefers-reduced-motion: reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}</style><link rel="stylesheet" href="../boltiv-theme.css">
</head><body><div class="page receipt-page"><div class="container receipt"><div class="receipt-card"><div class="logo"><img alt="BOLTIV logo" src="assets/boltiv-logo.webp"/><span>BOLTIV</span></div><div aria-live="polite" class="status" id="status" role="status">LOADING</div><div id="details"></div><div class="actions"><button class="primary" onclick="window.print()">PRINT / SAVE</button><a class="secondary" href="/transactions">BACK</a></div></div></div></div><script>const API="https://boltiv-backend.onrender.com";const token=boltivMemoryStorage.getItem("boltivAuthToken")||"";const ref=new URLSearchParams(location.search).get("reference");const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});const esc=v=>String(v??"-").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));async function load(){if(!ref){status.textContent="INVALID RECEIPT";return}const r=await fetch(API+"/api/transactions/detail?reference="+encodeURIComponent(ref),{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok||!d.success){status.textContent="RECEIPT NOT FOUND";return}const t=d.transaction;status.textContent=String(t.status||"").toUpperCase();let meta=t.metadata;try{if(typeof meta==="string")meta=JSON.parse(meta)}catch{meta={}};meta=meta&&typeof meta==="object"?meta:{};const requestMeta=meta.request&&typeof meta.request==="object"?meta.request:{};const pricing=meta.pricing&&typeof meta.pricing==="object"?meta.pricing:{};const phone=t.recipient||meta.phone||requestMeta.phone||requestMeta.phone_number||t.phone||"-";const network=t.network||meta.network||meta.network_provider||requestMeta.network||requestMeta.network_provider||"-";const provider=meta.provider||t.provider||"-";const plan=t.plan||meta.plan||meta.plan_name||pricing.plan||pricing.plan_name||requestMeta.plan_name||requestMeta.plan||"-";details.innerHTML=`<div class="row"><span>Service</span><strong>${esc(t.service)}</strong></div><div class="row"><span>Amount</span><strong>${money(t.amount)}</strong></div>${phone!=="-"?`<div class="row"><span>Phone</span><strong>${esc(phone)}</strong></div>`:""}${network!=="-"?`<div class="row"><span>Network</span><strong>${esc(network)}</strong></div>`:""}${provider!=="-"?`<div class="row"><span>Provider</span><strong>${esc(provider)}</strong></div>`:""}${plan!=="-"?`<div class="row"><span>Plan</span><strong>${esc(plan)}</strong></div>`:""}<div class="row"><span>Reference</span><strong>${esc(t.reference)}</strong></div><div class="row"><span>Provider Reference</span><strong>${esc(t.provider_reference)}</strong></div><div class="row"><span>Date</span><strong>${new Date(t.date).toLocaleString("en-NG")}</strong></div>`}load();</script><button type="button" class="boltiv-theme-toggle" data-boltiv-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
<script src="../boltiv-theme.js"></script>
</body></html>
