<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>BOLTIV — Buy Data</title><link rel="stylesheet" href="style.css"><script src="transaction-pin.js?v=20260815-pinfix"></script><script>if(localStorage.getItem("boltivLoggedIn")!=="true")location.replace("login.html");</script><style>
.data-page{min-height:100vh;padding-bottom:110px}.data-header{display:flex;align-items:center;gap:13px;padding:18px 0 24px}.back-button{width:40px;height:40px;border-radius:12px;border:1px solid #e5e5e1;background:#ffffff;color:#b8860b;font-size:22px;display:flex;align-items:center;justify-content:center}.data-title{color:#b8860b;font-size:20.9px;font-weight:1000}.data-subtitle{color:#666;font-size:10px;margin-top:4px}.data-hero{padding:23px;border-radius:23px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.16),transparent 38%),linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;margin-bottom:20px}.data-hero-label{color:#b8860b;font-size:10px;font-weight:1000;letter-spacing:1px}.data-hero-title{color:#171717;font-size:23.1px;font-weight:1000;margin-top:7px}.data-hero-text{color:#777;font-size:11px;line-height:1.6;margin-top:6px}.data-card{padding:20px;border-radius:21px;background:#ffffff;border:1px solid #e5e5e1}.data-label{display:block;color:#777;font-size:10px;font-weight:900;letter-spacing:.6px;margin-bottom:8px}.data-input{width:100%;box-sizing:border-box;padding:15px;border-radius:13px;border:1px solid #e5e5e1;background:#ffffff;color:#171717;outline:none;font-family:inherit;font-size:13.2px;font-weight:800;margin-bottom:18px}.data-input::placeholder{color:#555}.data-input:focus{border-color:#b8860b;box-shadow:0 0 0 2px rgba(212,175,55,.07)}.network-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.network-button{padding:13px 5px;border-radius:12px;border:1px solid #e5e5e1;background:#fafaf8;color:#777;font-size:7.7px;font-weight:1000}.network-button.active{color:#b8860b;border-color:#b8860b;background:#fffdf4}.plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.plan-button{text-align:left;padding:15px;border-radius:15px;border:1px solid #e5e5e1;background:#fafaf8;color:#fff}.plan-button.active{border-color:#b8860b;background:#fffdf4}.plan-size{color:#b8860b;font-size:14.3px;font-weight:1000;margin-bottom:5px}.plan-validity{color:#777;font-size:10px;margin-bottom:8px}.plan-price{color:#171717;font-size:11px;font-weight:1000}.plan-loading{grid-column:1/-1;padding:18px;border-radius:15px;border:1px dashed #d9d9d4;color:#777;text-align:center;font-size:10px;line-height:1.5;background:#fafaf8}.purchase-button{width:100%;padding:16px;border:1px solid #e5e5e1;border-radius:14px;background:#ffffff;color:#b8860b;font-family:inherit;font-size:11px;font-weight:1000;letter-spacing:.8px}.boltiv-modal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,20,20,.45);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.25s}.boltiv-modal.show{opacity:1;visibility:visible}.receipt-brand{display:flex;justify-content:center;margin:-4px auto 10px}.receipt-brand img{width:68px;height:72px;object-fit:contain}.boltiv-modal-card{width:100%;max-width:390px;box-sizing:border-box;padding:28px 22px;border-radius:25px;text-align:center;background:linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;box-shadow:0 30px 90px rgba(0,0,0,.75);transform:translateY(25px) scale(.94);transition:.3s}.boltiv-modal.show .boltiv-modal-card{transform:translateY(0) scale(1)}.modal-icon{width:66px;height:66px;margin:0 auto 17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30.8px;font-weight:1000}.boltiv-modal.warning .modal-icon,.boltiv-modal.processing .modal-icon{background:#fffdf4;border:1px solid #b8860b;color:#b8860b}.boltiv-modal.success .modal-icon{background:#101c12;border:1px solid #56b866;color:#70d47b}.boltiv-modal.failed .modal-icon{background:#fff0f0;border:1px solid #b94c4c;color:#e07878}.modal-spinner{width:24px;height:24px;border-radius:50%;border:3px solid #332b16;border-top-color:#b8860b;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.modal-status{color:#b8860b;font-size:10px;font-weight:1000;letter-spacing:1px;margin-bottom:8px}.modal-title{color:#171717;font-size:20.9px;font-weight:1000}.modal-message{color:#777;font-size:11px;line-height:1.6;margin-top:8px}.modal-details{margin-top:20px;padding:5px 14px;border-radius:15px;background:#fafaf8;border:1px solid #e5e5e1}.modal-detail{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e9e9e5;text-align:left}.modal-detail:last-child{border-bottom:0}.modal-detail span{color:#666;font-size:10px}.modal-detail strong{color:#171717;font-size:11px;font-weight:900;text-align:right;word-break:break-word}.modal-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#f5d76e,#b8860b,#b8860b);color:#f7f7f5;font-family:inherit;font-size:11px;font-weight:1000}
</style><link rel="icon" type="image/png" href="assets/boltiv-icon.png">
</head><body>
<div class="page data-page"><div class="container">
<div class="data-header"><button class="back-button" onclick="history.back()">‹</button><div><div class="data-title">Buy Data</div><div class="data-subtitle">INSTANT DATA RECHARGE</div></div></div>
<div class="data-hero"><div class="data-hero-label">BOLTIV DATA</div><div class="data-hero-title">Stay Connected.</div><div class="data-hero-text">Choose a data plan and recharge instantly from your BOLTIV wallet.</div></div>
<div class="data-card">
<label class="data-label">PHONE NUMBER</label><input class="data-input" id="phoneNumber" type="tel" inputmode="numeric" maxlength="11" placeholder="08012345678">
<label class="data-label">SELECT NETWORK</label><div class="network-grid"><button type="button" class="network-button" data-network="MTN">MTN</button><button type="button" class="network-button" data-network="AIRTEL">AIRTEL</button><button type="button" class="network-button" data-network="GLO">GLO</button><button type="button" class="network-button" data-network="9MOBILE">9MOBILE</button></div>
<label class="data-label">SELECT DATA PLAN</label><div class="plan-grid" id="planGrid"><div class="plan-loading" id="planLoading">Select a network to load available plans.</div></div><div id="planHint" class="data-subtitle" style="margin:-10px 0 18px"></div><button type="button" class="purchase-button" id="purchaseButton">BUY DATA</button>
</div></div></div>
<nav class="bottom-nav"><button class="nav-item" data-page="index.html"><span class="nav-icon">⌂</span><span>Home</span></button><button class="nav-item" data-page="wallet.html"><span class="nav-icon">₦</span><span>Wallet</span></button><button class="nav-item" data-page="transactions.html"><span class="nav-icon">↯</span><span>Activity</span></button><button class="nav-item" data-page="profile.html"><span class="nav-icon">◉</span><span>Profile</span></button></nav>
<div class="boltiv-modal" id="boltivModal"><div class="boltiv-modal-card"><div class="receipt-brand"><img src="assets/boltiv-logo.png" alt="BOLTIV logo"></div><div class="modal-icon" id="modalIcon">!</div><div class="modal-status" id="modalStatus">NOTICE</div><div class="modal-title" id="modalTitle">Complete Your Purchase</div><div class="modal-message" id="modalMessage">Please complete the required information.</div><div class="modal-details" id="modalDetails" style="display:none"></div><button type="button" class="modal-button" id="modalButton">GOT IT</button></div></div>
<script>
// Dynamic VTUGATE data catalog + purchase logic
const API="https://boltiv-backend.onrender.com";
let selectedNetwork="",selectedPlan=null;
const $=id=>document.getElementById(id),phone=$("phoneNumber"),modal=$("boltivModal"),icon=$("modalIcon"),status=$("modalStatus"),title=$("modalTitle"),msg=$("modalMessage"),details=$("modalDetails"),modalBtn=$("modalButton"),planGrid=$("planGrid"),planLoading=$("planLoading"),planHint=$("planHint");
const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
function show(type,t,m,b="GOT IT",d=""){modal.className="boltiv-modal show "+type;title.textContent=t;msg.textContent=m;modalBtn.textContent=b;status.textContent=type==="success"?"SUCCESSFUL":type==="failed"?"FAILED":type==="processing"?"PROCESSING":"NOTICE";icon.innerHTML=type==="success"?"✓":type==="failed"?"×":type==="processing"?'<div class="modal-spinner"></div>':"!";details.innerHTML=d;details.style.display=d?"block":"none"}
function close(){modal.classList.remove("show");modalBtn.style.display="block"}
modalBtn.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
function esc(v){return String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function planLabel(plan){
  if(Number(plan.size_mb)>0){
    const mb=Number(plan.size_mb);
    if(mb>=1024){const gb=mb/1024;return (Number.isInteger(gb)?gb:gb.toFixed(2))+"GB"}
    return mb+"MB";
  }
  return plan.name||plan.code;
}
function renderPlans(plans){
  selectedPlan=null;
  planGrid.innerHTML="";
  if(!Array.isArray(plans)||!plans.length){planGrid.innerHTML='<div class="plan-loading">No data plans are currently available for this network.</div>';return;}
  plans.forEach(plan=>{
    const b=document.createElement("button");
    b.type="button";b.className="plan-button";
    const label=planLabel(plan), validity=Number(plan.validity_days)>0?Number(plan.validity_days)+" Days":"Available";
    b.innerHTML='<div class="plan-size">'+esc(label)+'</div><div class="plan-validity">'+esc(validity)+'</div><div class="plan-price">'+money(plan.customer_price)+'</div>';
    b.onclick=()=>{document.querySelectorAll(".plan-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedPlan=plan;};
    planGrid.appendChild(b);
  });
}
async function loadPlans(network){
  selectedPlan=null;
  planGrid.innerHTML='<div class="plan-loading">Loading '+esc(network)+' data plans…</div>';
  planHint.textContent="";
  try{
    const r=await fetch(API+"/api/vtu/data/plans",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({network})});
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.message||"Unable to load data plans.");
    renderPlans(d.plans);
    planHint.textContent=d.plans?.length?d.plans.length+" live plans available":"";
  }catch(e){
    planGrid.innerHTML='<div class="plan-loading">'+esc(e.message||"Unable to load data plans.")+'</div>';
  }
}
function info(p,id="",bal=""){let h='<div class="modal-detail"><span>Service</span><strong>Data</strong></div><div class="modal-detail"><span>Network</span><strong>'+esc(selectedNetwork)+'</strong></div><div class="modal-detail"><span>Phone</span><strong>'+esc(p)+'</strong></div><div class="modal-detail"><span>Data Plan</span><strong>'+esc(planLabel(selectedPlan))+'</strong></div><div class="modal-detail"><span>Amount</span><strong>'+money(selectedPlan.customer_price)+'</strong></div>';if(id)h+='<div class="modal-detail"><span>Reference</span><strong>'+esc(id)+'</strong></div>';if(bal!=="")h+='<div class="modal-detail"><span>Wallet Balance</span><strong>'+money(bal)+'</strong></div>';return h}
document.querySelectorAll(".network-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".network-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedNetwork=b.dataset.network;loadPlans(selectedNetwork)});
$("purchaseButton").onclick=async()=>{
  const p=phone.value.trim();
  if(!p)return show("warning","Phone Number Required","Enter the 11-digit phone number you want to recharge.");
  if(p.length!==11||!/^[0-9]{11}$/.test(p))return show("warning","Check Your Number","Please enter a valid 11-digit Nigerian phone number.");
  if(!selectedNetwork)return show("warning","Select Your Network","Choose your network.");
  if(!selectedPlan)return show("warning","Select a Data Plan","Choose a data plan.");
  const transactionPin=await boltivGetTransactionPin();
  if(!transactionPin){modalBtn.style.display="block";return;}
  show("processing","Processing Data","Your request is being sent securely.","PLEASE WAIT",info(p));modalBtn.style.display="none";
  try{
    const r=await fetch(API+"/api/vtu/data",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(localStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({phone:p,network:selectedNetwork,plan_code:selectedPlan.code,bundle_id:selectedPlan.bundle_id,service_id:selectedPlan.service_id,amount:Number(selectedPlan.customer_price),service:"data",providerPayload:{service:"data",phone:p,network:selectedNetwork,plan_code:selectedPlan.code,bundle_id:selectedPlan.bundle_id,service_id:selectedPlan.service_id,amount:Number(selectedPlan.customer_price)},idempotencyKey:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),transactionPin})});
    const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Unable to process data purchase.");
    show(d.status==="pending"?"processing":"success",d.status==="pending"?"Processing":"Data Purchased",d.message||"Your data request has been received.","DONE",info(p,d.reference,d.balance));
  }catch(e){show("failed","Data Purchase Failed",e.message||"Unable to process your data purchase.","DONE",info(p));}
  finally{modalBtn.style.display="block"}
};
document.querySelectorAll(".nav-item").forEach(i=>i.onclick=()=>location.href=i.dataset.page);
</script></body></html>
