<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><meta name="description" content="BOLTIV Agent"><title>Agent Activity — BOLTIV Agent</title><script src="/boltiv-api-config.js?v=1"></script><script src="/boltiv-client.js?v=20260820-nostorage"></script><script src="/transaction-pin.js?v=20260820-pinfix"></script><link rel="icon" href="/assets/boltiv-icon.webp"><link rel="stylesheet" href="/agent.css?v=1"></head><body><main class="agent-shell"><div class="agent-container"><header class="agent-top"><div><div class="eyebrow">BOLTIV Agent</div><h1 class="title">Activity</h1></div><a class="statement-btn" href="#" id="statementLink"><span>Statement</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></a></header><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="successful">Successful</button><button class="tab" data-filter="pending">Pending</button><button class="tab" data-filter="failed">Failed</button><button class="tab" data-filter="refunded">Refunded</button></div><section class="card" id="list"><div class="loading">Loading activity…</div></section><div class="section-head"><h2>Earnings</h2><a class="link" href="/agent-earnings">View earnings →</a></div><section class="summary-grid"><div class="summary-box"><div class="label">Today</div><strong id="today">₦0.00</strong></div><div class="summary-box"><div class="label">This Week</div><strong id="week">₦0.00</strong></div></section></div></main><nav class="agent-nav"><a data-page="home" class="" href="/agent-home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7v9a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"></path><path d="M9.5 20.5v-6h5v6"></path></svg></span>Home</a><a data-page="sell" class="sell-nav " href="/agent-sell"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Sell</a><a data-page="wallet" class="" href="/agent-wallet"><span class="nav-icon nav-icon-text" aria-hidden="true">₦</span>Wallet</a><a data-page="activity" class="active" href="/agent-activity"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg></span>Activity</a><a data-page="profile" class="" href="/agent-profile"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path></svg></span>Profile</a><div class="receipt-overlay" id="receiptOverlay" onclick="if(event.target===this)closeReceipt()"><div class="receipt-card"><div class="receipt-icon" id="receiptIcon">✓</div><div class="receipt-status" id="receiptStatus">SUCCESSFUL</div><div class="receipt-amount" id="receiptAmount"></div><div class="receipt-rows" id="receiptRows"></div><button class="receipt-done" onclick="closeReceipt()">DONE</button></div></div></nav><script src="/agent-app.js?v=1"></script><script>(async()=>{await requireAgent();document.getElementById('statementLink').onclick=async e=>{e.preventDefault();try{const r=await fetch(AGENT_API+'/api/agent/transactions/export',{credentials:'include',headers:agentHeaders()});if(!r.ok)throw new Error('Unable to download statement.');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='boltiv-agent-statement.csv';a.click();URL.revokeObjectURL(u);}catch(e){showAgentMessage(e.message)}};const t=await agentFetch('/api/agent/transactions?limit=200');const d=await agentFetch('/api/agent/dashboard');const rows=t.transactions||[];const now=new Date();const start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-6);const weekProfit=rows.filter(x=>String(x.status).toLowerCase()==='successful'&&new Date(x.date)>=start).reduce((sum,x)=>sum+Number(x.profit||0),0);document.getElementById('today').textContent=money(d.today.profit);document.getElementById('week').textContent=money(weekProfit);const serviceIcons={airtime:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.2"></rect><path d="M10 6h4M11 18h2"></path></svg>',data:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5a11 11 0 0 1 16 0M7 12.5a7 7 0 0 1 10 0M10 15.5a3 3 0 0 1 4 0"></path><circle cx="12" cy="18" r="1"></circle></svg>',cable:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="12" rx="2"></rect><path d="M8 21h8M12 17v4M9 3l3 3 3-3"></path></svg>',electricity:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.8 5.8 13h5.3l-.8 8.2L18.2 11h-5.1l.4-8.2Z"></path></svg>',exam_pin:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20.5H7z"></path><path d="M14 3.5v4h4M9.5 12h5M9.5 15h5"></path></svg>'};const serviceLabels={airtime:'Airtime',data:'Data',cable:'Cable TV',electricity:'Electricity',exam_pin:'Exam PINs'};const render=f=>{const filtered=f==='all'?rows:rows.filter(x=>String(x.status).toLowerCase()===f);document.getElementById('list').innerHTML=filtered.length?filtered.map(r=>`<div class="activity-row" data-ref="${esc(r.reference)}"><div class="activity-left"><span class="activity-icon">${serviceIcons[r.service]||serviceIcons.airtime}</span><div class="activity-main"><strong>${esc(serviceLabels[r.service]||r.service)}</strong><small>${esc(r.recipient||r.reference)} · ${new Date(r.date).toLocaleDateString('en-NG',{day:'2-digit',month:'short'})}</small></div></div><div class="activity-right"><strong class="activity-amount">${money(r.customerSellingPrice||r.agentPrice)}</strong><span class="profit"><span>Profit</span> ${money(r.profit)}</span><span class="status ${esc(r.status)}">${esc(r.status)}</span></div><span class="activity-chevron">\u203a</span></div>`).join(''):'<div class="empty">No transactions in this filter.</div>'};document.getElementById('list').onclick=e=>{const row=e.target.closest('.activity-row');if(!row)return;const tx=rows.find(x=>x.reference===row.dataset.ref);if(tx)openReceipt(tx);};function receiptRow(label,value){if(value===undefined||value===null||value==='')return'';return `<div class="receipt-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;}function openReceipt(tx){const status=String(tx.status||'').toLowerCase();const pending=status==='pending'||status==='processing';const bad=status==='failed'||status==='refunded';const icon=document.getElementById('receiptIcon'),st=document.getElementById('receiptStatus');icon.className='receipt-icon'+(pending?' pending':bad?' bad':'');icon.textContent=pending?'!':bad?'\u00d7':'\u2713';st.className='receipt-status'+(pending?' pending':bad?' bad':'');st.textContent=(tx.status||'').toUpperCase();document.getElementById('receiptAmount').textContent=money(tx.customerSellingPrice||tx.agentPrice);const rows2=[];const service=String(tx.service||'');if(service==='airtime'){rows2.push(receiptRow('Network',tx.network));rows2.push(receiptRow('Phone Number',tx.phone||tx.recipient));}else if(service==='data'){rows2.push(receiptRow('Network',tx.network));rows2.push(receiptRow('Plan',tx.plan));rows2.push(receiptRow('Phone Number',tx.phone||tx.recipient));}else if(service==='cable'){rows2.push(receiptRow('Provider',tx.provider));rows2.push(receiptRow('Package',tx.plan));rows2.push(receiptRow('Smartcard Number',tx.smartcard||tx.recipient));}else if(service==='electricity'){rows2.push(receiptRow('Disco',tx.provider));rows2.push(receiptRow('Meter Type',tx.meterType));rows2.push(receiptRow('Meter Number',tx.meterNumber||tx.recipient));if(tx.token)rows2.push(receiptRow('Token',tx.token));if(tx.units)rows2.push(receiptRow('Units',tx.units));}else if(service==='exam_pin'){rows2.push(receiptRow('Exam Type',tx.examLabel));rows2.push(receiptRow('Quantity',tx.quantity));if(Array.isArray(tx.pins))tx.pins.forEach((pin,i)=>{const v=typeof pin==='string'?pin:(pin.pin||pin.serial||pin.serial_number||pin.value||JSON.stringify(pin));rows2.push(`<div class="receipt-row pin"><span>${esc(tx.pins.length>1?'PIN '+(i+1):'PIN')}</span><strong>${esc(v)}</strong></div>`);});}rows2.push(receiptRow('Your Profit',money(tx.profit)));rows2.push(receiptRow('Date',new Date(tx.date).toLocaleString('en-NG',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})));rows2.push(receiptRow('Reference',tx.reference));document.getElementById('receiptRows').innerHTML=rows2.join('');document.getElementById('receiptOverlay').classList.add('show');}function closeReceipt(){document.getElementById('receiptOverlay').classList.remove('show');}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render('all');})().catch(e=>showAgentMessage(e.message));</script></body></html>
