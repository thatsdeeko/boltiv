it;font-size:11px;font-weight:1000;letter-spacing:.8px}.boltiv-modal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,20,20,.45);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:.25s}.boltiv-modal.show{opacity:1;visibility:visible}.receipt-brand{display:flex;justify-content:center;margin:-4px auto 10px}.receipt-brand img{width:68px;height:72px;object-fit:contain}.boltiv-modal-card{width:100%;max-width:390px;box-sizing:border-box;padding:28px 22px;border-radius:25px;text-align:center;background:linear-gradient(145deg,#fffdf4,#ffffff);border:1px solid #e5e5e1;box-shadow:0 30px 90px rgba(0,0,0,.75)}.modal-icon{width:66px;height:66px;margin:0 auto 17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30.8px;font-weight:1000}.warning .modal-icon,.processing .modal-icon{background:#fffdf4;border:1px solid #D4AF37;color:#D4AF37}.failed .modal-icon{background:#fff0f0;border:1px solid #b94c4c;color:#e07878}.modal-status{font-size:10px;font-weight:1000;letter-spacing:1px;color:#D4AF37;margin-bottom:8px}.modal-title{color:#171717;font-size:20.9px;font-weight:1000}.modal-message{color:#777;font-size:11px;line-height:1.6;margin-top:8px}.modal-details{margin-top:20px;padding:5px 14px;border-radius:15px;background:#fafaf8;border:1px solid #e5e5e1}.modal-detail{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e9e9e5;text-align:left}.modal-detail:last-child{border:0}.modal-detail span{color:#666;font-size:10px}.modal-detail strong{color:#171717;font-size:11px}.modal-button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:#D4AF37;color:#f7f7f5;font-family:inherit;font-size:11px;font-weight:1000}

</head><body><div class="page airtime-page"><div class="container">
<div class="airtime-header"><button class="back-button" onclick="history.back()">‹</button><div><div class="airtime-title">Buy Airtime</div><div class="airtime-subtitle">INSTANT AIRTIME RECHARGE</div></div></div>
<div class="airtime-hero"><div class="airtime-hero-label">BOLTIV AIRTIME</div><div class="airtime-hero-title">Stay Connected.</div><div class="airtime-hero-text">Recharge any supported network instantly from your BOLTIV wallet.</div></div>
<div class="airtime-card">
<label class="airtime-label" id="phone-number-label">PHONE NUMBER</label><input aria-label="Phone number" aria-labelledby="phone-number-label" class="airtime-input" id="phoneNumber" inputmode="numeric" maxlength="11" placeholder="08012345678" type="tel"/>
<label class="airtime-label" for="customAmount">SELECT NETWORK</label><div class="network-grid"><button class="network-button" data-network="MTN">MTN</button><button class="network-button" data-network="AIRTEL">AIRTEL</button><button class="network-button" data-network="GLO">GLO</button><button class="network-button" data-network="9MOBILE">9MOBILE</button></div>
<label class="airtime-label" for="customAmount">SELECT AMOUNT</label><div class="amount-grid"><button class="amount-button" data-amount="100">₦100</button><button class="amount-button" data-amount="200">₦200</button><button class="amount-button" data-amount="500">₦500</button><button class="amount-button" data-amount="1000">₦1,000</button><button class="amount-button" data-amount="2000">₦2,000</button><button class="amount-button" data-amount="5000">₦5,000</button></div>
<label class="airtime-label" for="customAmount">OR ENTER AMOUNT</label><input aria-label="Custom amount" class="airtime-input" id="customAmount" inputmode="numeric" min="50" placeholder="Enter amount" type="number"/>
<button class="purchase-button" id="purchaseButton">BUY AIRTIME</button></div></div></div>
<nav class="bottom-nav"><button class="nav-item" onclick="location.href='/dashboard'"><span class="nav-icon">⌂</span>Home</button><button class="nav-item" onclick="location.href='/wallet'"><span class="nav-icon">₦</span>Wallet</button><button class="nav-item" onclick="location.href='/transactions'"><span class="nav-icon">↯</span>Activity</button><button class="nav-item" onclick="location.href='/profile'"><span class="nav-icon">◉</span>Profile</button></nav>
<div class="boltiv-modal" id="boltivModal"><div class="boltiv-modal-card"><div class="receipt-brand"><img alt="BOLTIV logo" src="assets/boltiv-logo.webp"/></div><div class="modal-icon" id="modalIcon">!</div><div aria-live="polite" class="modal-status" id="modalStatus" role="status">NOTICE</div><div class="modal-title" id="modalTitle"></div><div aria-live="polite" class="modal-message" id="modalMessage" role="status"></div><div class="modal-details" id="modalDetails" style="display:none"></div><button class="modal-button" id="modalButton">GOT IT</button></div></div>
<script>
const API="https://boltiv-backend.onrender.com",modal=document.getElementById("boltivModal"),mi=document.getElementById("modalIcon"),ms=document.getElementById("modalStatus"),mt=document.getElementById("modalTitle"),mm=document.getElementById("modalMessage"),md=document.getElementById("modalDetails"),mb=document.getElementById("modalButton"),phone=document.getElementById("phoneNumber"),custom=document.getElementById("customAmount");let network="",amount=0;
function money(n){return"₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function show(type,title,msg,details=""){modal.className="boltiv-modal show "+type;mt.textContent=title;mm.textContent=msg;mi.textContent=type==="success"?"✓":type==="failed"?"×":"!";ms.textContent=type==="processing"?"PROCESSING":type==="failed"?"FAILED":type==="success"?"SUCCESSFUL":"NOTICE";md.innerHTML=details;md.style.display=details?"block":"none"}
function close(){modal.classList.remove("show");mb.style.display="block"}mb.onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
document.querySelectorAll(".network-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".network-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");network=b.dataset.network});
document.querySelectorAll(".amount-button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".amount-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");amount=Number(b.dataset.amount);custom.value=""});
custom.oninput=()=>{amount=Number(custom.value);document.querySelectorAll(".amount-button").forEach(x=>x.classList.remove("active"))};

// CHUNK 1 END
  function uid(){try{let u=JSON.parse(boltivMemoryStorage.getItem("boltivUser")||"{}");return String(u.id||u.userId||u.email||"")}catch(e){return""}}
function details(){return`<div class="modal-detail"><span>Service</span><strong>Airtime</strong></div><div class="modal-detail"><span>Network</span><strong>${network}</strong></div><div class="modal-detail"><span>Phone</span><strong>${phone.value}</strong></div><div class="modal-detail"><span>Amount</span><strong>${money(amount)}</strong></div>`}
async function buy(){
const p=phone.value.trim();
if(!/^\d{11}$/.test(p))return show("warning","Check Your Number","Enter a valid 11-digit Nigerian phone number.");
if(!network)return show("warning","Select Network","Choose MTN, Airtel, Glo or 9mobile.");
if(!amount||amount<50)return show("warning","Invalid Amount","The minimum airtime purchase is ₦50.");
const id=uid();
if(!id)return show("failed","Session Error","Please log in again and try again.");
const transactionPin=await boltivGetTransactionPin();
if(!transactionPin){mb.style.display="block";return;}
show("processing","Checking Service","Connecting to BOLTIV...");
mb.style.display="none";
try{
const r=await fetch(API+"/api/vtu/airtime",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(boltivMemoryStorage.getItem("boltivAuthToken")||"")},body:JSON.stringify({phone:p,network,amount,airtime_amount:amount,service:"airtime",providerPayload:{service:"airtime",phone:p,network,amount,airtime_amount:amount},idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now()),transactionPin:transactionPin})});
let d={};
try{d=await r.json()}catch(e){}
if(d.success){
const confirmedPhone=d.phone||d.transaction?.phone||p;
const confirmedNetwork=d.network||d.transaction?.network||network;
const confirmedAmount=Number(d.amount||amount);
const receiptDetails=`<div class="modal-detail"><span>Service</span><strong>Airtime</strong></div><div class="modal-detail"><span>Network</span><strong>${confirmedNetwork||"—"}</strong></div><div class="modal-detail"><span>Phone</span><strong>${confirmedPhone||"—"}</strong></div><div class="modal-detail"><span>Amount</span><strong>${money(confirmedAmount)}</strong></div>`;
show("success","Airtime Purchased",d.message||"Your airtime purchase was successful.",receiptDetails+(d.reference?`<div class="modal-detail"><span>Reference</span><strong>${d.reference}</strong></div>`:""));
mb.style.display="block";
}else{
show("failed","Airtime Unavailable",d.message||"The airtime provider is not available yet.",details());
mb.style.display="block";
}
}catch(e){
show("failed","Service Unavailable","The BOLTIV airtime service is currently unavailable. Please try again later.",details());
mb.style.display="block";
}}
document.getElementById("purchaseButton").onclick=buy;
</script><button type="button" class="boltiv-theme-toggle" data-boltiv-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
<script src="boltiv-theme.js"></script>
</body></html>
